l stiker bukti bayar (납부필증), lalu keluarkan", "th": "ลดน้ำให้มากที่สุด ใส่ถังเฉพาะ ติดสติกเกอร์ชำระเงิน (납부필증) แล้วนำออกไปวาง", "en": "Reduce the water as much as possible, put it in the special bin, and attach a payment sticker (납부필증)", "ru": "Слейте как можно больше воды, в спец. контейнер с наклейкой об оплате (납부필증)", "vi": "Giảm nước càng nhiều càng tốt, cho vào thùng chuyên dụng, gắn tem đã trả phí (납부필증) rồi để ra", "ja": "水気をできるだけ減らして専用容器に入れ、納付済証（납부필증）を付けて出す", "zh": "尽量减少水分，装入专用桶并贴上缴费证（납부필증）后排放", "mn": "Усыг аль болох багасгаж тусгай саванд хийн төлбөрийн наалт (납부필증) нааж гаргана", "tw": "儘量減少水分，裝入專用桶並貼上繳費證（납부필증）後排放"}, "bags": {"ko": "종량제봉투 판매소 (음식물·대형폐기물 스티커도 같은 곳)", "id": "Toko penjual kantong berbayar (종량제봉투) (stiker sampah makanan dan sampah besar juga di sana)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (สติกเกอร์ขยะเศษอาหารและขยะชิ้นใหญ่ก็ที่เดียวกัน)", "en": "Pay-as-you-throw bag shops (food-waste and large-waste stickers are sold at the same place)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (наклейки для пищевых отходов и крупного мусора — там же)", "vi": "Nơi bán túi rác có trả phí (tem rác thức ăn và rác cồng kềnh cũng bán ở đây)", "ja": "従量制袋の販売店（生ごみ・大型ごみのシールも同じ店）", "zh": "计量收费袋销售处（厨余·大型废弃物贴纸也在同一处）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (хүнсний хог, том хогны наалт ч тэнд)", "tw": "計量收費袋銷售處（廚餘·大型廢棄物貼紙也在同一處）"}, "bulky": {"ko": "수성구청 홈페이지 '대형폐기물 신청' 또는 '여기로' 앱 신청·결제, 또는 납부필증 스티커 붙이고 수거업체 ☎666-2744", "id": "'Daftar sampah besar' di situs kantor Suseong-gu atau daftar dan bayar di aplikasi '여기로' (Yeogiro), atau tempel stiker bukti bayar lalu hubungi perusahaan ☎666-2744", "th": "เมนู 'ยื่นขอขยะชิ้นใหญ่' (대형폐기물 신청) บนเว็บไซต์สำนักงานเขตซูซอง หรือยื่นขอและจ่ายเงินที่แอป '여기로' (Yeogiro) หรือติดสติกเกอร์ชำระเงินแล้วติดต่อบริษัท ☎666-2744", "en": "Apply and pay via 'Large waste application' (대형폐기물 신청) on the Suseong-gu website or the 'Yeogiro' (여기로) app, or attach a payment sticker and call the collection company ☎666-2744", "ru": "«대형폐기물 신청» на сайте администрации Сусон-гу или заявка и оплата в приложении «여기로», или приклейте наклейку об оплате (납부필증) и позвоните в компанию ☎666-2744", "vi": "Mục '대형폐기물 신청' (đăng ký rác cồng kềnh) trên trang web văn phòng quận Suseong, hoặc đăng ký và trả phí qua ứng dụng '여기로' (Yeogiro), hoặc dán tem đã trả phí rồi gọi công ty thu gom ☎666-2744", "ja": "寿城区役所ホームページの「대형폐기물 신청」（大型ごみ申請）または「여기로」（ヨギロ）アプリで申請・支払い、または納付済証シールを貼って回収業者 ☎666-2744", "zh": "在寿城区厅网站“大型废弃物申请”（대형폐기물 신청）或“여기로”App申请·付款，或贴上缴费证贴纸后打电话给收运公司☎666-2744", "mn": "Сусон-гугийн захиргааны сайт «대형폐기물 신청» эсвэл «여기로» аппаар хүсэлт гаргаж төлөх, эсвэл төлбөрийн наалт (납부필증) нааж хог ачих компани ☎666-2744", "tw": "在壽城區廳網站“大型廢棄物申請”（대형폐기물 신청）或“여기로”App申請·付款，或貼上繳費證貼紙後打電話給收運公司☎666-2744"}, "notes": {"ko": "재활용품은 그물망에: 비닐·투명페트병은 빨간 그물망, 나머지는 초록 그물망. 폐형광등·건전지는 전용수거함", "id": "Daur ulang di kantong jaring (그물망): plastik tipis dan PET bening di jaring merah, lainnya di jaring hijau. Lampu neon dan baterai bekas: kotak khusus", "th": "ขยะรีไซเคิลใส่ถุงตาข่าย (그물망): ถุงพลาสติกและขวด PET ใสใส่ตาข่ายสีแดง ที่เหลือใส่ตาข่ายสีเขียว หลอดฟลูออเรสเซนต์และถ่านเก่า: กล่องรับเฉพาะ", "en": "Recycling in net bags: plastic film and clear PET bottles in the red net bag, everything else in the green net bag. Used fluorescent lamps and batteries: special collection boxes", "ru": "Вторсырьё — в сетчатые мешки: плёнка и прозрачные ПЭТ — в красный, остальное — в зелёный. Лампы дневного света и батарейки — в спец. ящики", "vi": "Rác tái chế cho vào túi lưới (그물망): ni lông, chai PET trong suốt vào lưới đỏ, còn lại vào lưới xanh lá. Bóng đèn huỳnh quang cũ, pin: thùng thu gom chuyên dụng", "ja": "資源ごみはネット袋（그물망）に：ビニール・透明ペットボトルは赤いネット、そのほかは緑のネット。廃蛍光灯・乾電池は専用回収箱", "zh": "可回收物装网袋：塑料膜·透明PET瓶装红色网袋，其他装绿色网袋。废荧光灯·电池放专用回收箱", "mn": "Дахин боловсруулах хогийг торон уутанд: гялгар уут, тунгалаг ПЭТ — улаан торон уут, бусад — ногоон торон уут. Хуучин гэрлийн хоолой, зайг тусгай хайрцагт", "tw": "可回收物裝網袋：塑膠膜·透明PET瓶裝紅色網袋，其他裝綠色網袋。廢熒光燈·電池放專用回收箱"}, "days": {"ko": "종량제봉투: 일~금 저녁 배출(월~토 수거). 음식물·재활용·대형폐기물은 동별 요일 다름 (예: 음식물 범어1·4동 등 화·목·일, 중동·파동 등 월·수·금)", "id": "Kantong berbayar: buang Minggu~Jumat malam (ambil Senin~Sabtu). Makanan, daur ulang, sampah besar: hari beda tiap kelurahan (contoh: makanan Beomeo 1·4-dong dll. Selasa·Kamis·Minggu, Jung-dong·Pa-dong dll. Senin·Rabu·Jumat)", "th": "ถุงขยะแบบเสียเงิน: ทิ้งเย็นวันอาทิตย์~ศุกร์ (เก็บจันทร์~เสาร์) ขยะเศษอาหาร ขยะรีไซเคิล ขยะชิ้นใหญ่: วันต่างกันตามแขวง (เช่น ขยะเศษอาหาร Beomeo 1·4-dong ฯลฯ อังคาร·พฤหัสบดี·อาทิตย์ Jung-dong·Pa-dong ฯลฯ จันทร์·พุธ·ศุกร์)", "en": "Pay-as-you-throw bags: put out Sun–Fri evening (pickup Mon–Sat). Food waste, recycling and large waste: days differ by dong (e.g. food waste: Beomeo 1·4-dong etc. Tue·Thu·Sun; Jung-dong, Pa-dong etc. Mon·Wed·Fri)", "ru": "Платные пакеты: выносить вечером вс~пт (вывоз пн~сб). Пищевые отходы, вторсырьё и крупный мусор — дни по дон (например, пищевые отходы: Помо-1·4-дон и др. — вт, чт, вс; Чун-дон, Пха-дон и др. — пн, ср, пт)", "vi": "Túi rác có trả phí (종량제봉투): để ra tối CN ~ Thứ 6 (thu gom Thứ 2 ~ Thứ 7). Rác thức ăn, rác tái chế, rác cồng kềnh: ngày khác nhau theo phường (ví dụ rác thức ăn: Beomeo 1·4-dong, v.v.: Thứ 3·Thứ 5·CN; Jung-dong, Pa-dong, v.v.: Thứ 2·Thứ 4·Thứ 6)", "ja": "従量制袋（종량제봉투）：日〜金の夜に出す（月〜土に回収）。生ごみ・資源ごみ・大型ごみは洞ごとに曜日が違う（例：生ごみ Beomeo 1・4-dongなど 火・木・日、Jung-dong・Pa-dongなど 月・水・金）", "zh": "计量收费袋：周日至周五晚上扔（周一至周六收）。厨余·可回收物·大型废弃物按洞日子不同（例：厨余 泛鱼1·4洞等 周二·四·日，中洞·巴洞等 周一·三·五）", "mn": "Төлбөртэй уут: Ням~Баасан гарагийн орой гаргана (Даваа~Бямба ачна). Хүнсний, дахин боловсруулах, том хог — хороогоор өөр өдөр (жишээ нь хүнсний хог: Бөмө-1·4-дон г.м. Мягмар·Пүрэв·Ням, Жун-дон, Па-дон г.м. Даваа·Лхагва·Баасан)", "tw": "計量收費袋：週日至週五晚上扔（週一至週六收）。廚餘·可回收物·大型廢棄物按洞日子不同（例：廚餘 泛魚1·4洞等 週二·四·日，中洞·巴洞等 週一·三·五）"}}, "url": "https://www.suseong.kr/index.do?menu_id=00000359", "checked": "2026-10-25"}, {"id": "ulsan-nam", "sido": {"ko": "울산광역시", "id": "Ulsan", "th": "อุลซาน (Ulsan)", "en": "Ulsan", "ru": "Ульсан", "vi": "Ulsan", "ja": "蔚山広域市", "zh": "蔚山广域市", "mn": "Ульсан", "tw": "蔚山廣域市"}, "name": {"ko": "남구", "id": "Nam-gu (Ulsan)", "th": "Nam-gu (Ulsan)", "en": "Nam-gu", "ru": "Ульсан, Нам-гу", "vi": "Nam-gu (Ulsan)", "ja": "南区（ナム）", "zh": "南区", "mn": "Ульсан, Нам-гу", "tw": "南區"}, "f": {"hours": {"ko": "수거 전날 해 진 후 ~ 수거일 03:00", "id": "Malam sebelum hari ambil setelah matahari terbenam ~ 03:00 hari ambil", "th": "เย็นวันก่อนวันเก็บหลังพระอาทิตย์ตก ~ 03:00 ของวันเก็บ", "en": "From sunset the day before pickup until 03:00 on pickup day", "ru": "Накануне вывоза после заката ~ 03:00 дня вывоза", "vi": "Hôm trước ngày thu gom, sau khi mặt trời lặn ~ 03:00 ngày thu gom", "ja": "回収日の前日の日没後〜回収日03:00", "zh": "收运前一天日落后~收运日03:00", "mn": "Ачихын өмнөх өдөр нар жаргасны дараа ~ ачих өдрийн 03:00", "tw": "收運前一天日落後~收運日03:00"}, "place": {"ko": "단독주택(상가)은 자기 집(상가) 앞, 공동주택은 단지 내 보관용기. 전봇대 밑·도로변은 불법", "id": "Rumah tunggal (toko): di depan rumah (toko) sendiri, apartemen/rumah susun: wadah simpan di kompleks. Di bawah tiang listrik atau pinggir jalan = ilegal", "th": "บ้านเดี่ยว (ร้านค้า): หน้าบ้าน (ร้าน) ของตัวเอง อพาร์ตเมนต์/อาคารชุด: ถังเก็บในโครงการ วางใต้เสาไฟฟ้าหรือริมถนน = ผิดกฎหมาย", "en": "Houses (shops): in front of your own home (shop). Apartments: storage bins in the complex. Under utility poles or by the road: illegal", "ru": "Частные дома (магазины): перед своим домом (магазином), многоквартирные дома: контейнер в комплексе. Под столбами и у дороги — незаконно", "vi": "Nhà riêng (cửa hàng): trước nhà (cửa hàng) của bạn. Chung cư (공동주택): thùng chứa trong khu. Để dưới cột điện hoặc lề đường là trái phép", "ja": "一戸建て（店舗）は自宅（店舗）の前、共同住宅は団地内の保管容器。電柱の下・道路沿いは違法", "zh": "独栋住宅（商铺）放自家（商铺）门前，公寓放小区内存放桶。放在电线杆下·路边属违法", "mn": "Хувийн байшин (дэлгүүр) — өөрийн байр (дэлгүүр)-ны үүдэнд, орон сууц — хотхоны сав. Цахилгааны шонгийн доор, замын хажууд — хууль бус", "tw": "獨棟住宅（商鋪）放自家（商鋪）門前，公寓放小區記憶體放桶。放在電線杆下·路邊屬違法"}, "food": {"ko": "전용용기에 납부필증 부착 후 배출, 수거된 빈 통은 바로 회수", "id": "Tempel stiker bukti bayar (납부필증) di wadah khusus, lalu keluarkan. Ambil wadah kosong segera setelah diambil", "th": "ติดสติกเกอร์ชำระเงิน (납부필증) บนถังเฉพาะแล้วนำออกไปวาง เก็บถังเปล่ากลับทันทีหลังเก็บขยะแล้ว", "en": "Special bin with a payment sticker (납부필증). Take the empty bin back right after pickup", "ru": "В спец. контейнер с наклейкой об оплате (납부필증), пустой контейнер после вывоза сразу заберите", "vi": "Gắn tem đã trả phí (납부필증) lên thùng chuyên dụng rồi để ra. Sau khi thu gom, lấy thùng rỗng vào ngay", "ja": "専用容器に納付済証（납부필증）を付けて出す。回収された空の容器はすぐに片付ける", "zh": "在专用桶上贴缴费证（납부필증）后排放，收运后空桶要马上收回", "mn": "Тусгай саванд төлбөрийн наалт (납부필증) нааж гаргана, хоосон савыг ачсаны дараа шууд авна", "tw": "在專用桶上貼繳費證（납부필증）後排放，收運後空桶要馬上收回"}, "bags": {"ko": "종량제봉투 판매소 (구 홈페이지에서 목록 다운로드)", "id": "Toko penjual kantong berbayar (종량제봉투) (unduh daftar di situs kantor gu)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (ดาวน์โหลดรายชื่อบนเว็บไซต์สำนักงานเขต)", "en": "Pay-as-you-throw bag shops (download the list from the district website)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (список можно скачать на сайте района)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) (tải danh sách trên trang web của quận)", "ja": "従量制袋（종량제봉투）の販売店（区ホームページでリストをダウンロード）", "zh": "计量收费袋销售处（可在区网站下载名单）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (жагсаалтыг дүүргийн сайтаас татаж авна)", "tw": "計量收費袋銷售處（可在區網站下載名單）"}, "bulky": {"ko": "동별 수거업체에 신고 후 배출 (태화산업 269-6512, 일진환경 274-2824, 삼정개발 257-5878, 삼화실업 227-5360). 중대형 폐가전 1599-0903", "id": "Lapor ke perusahaan pengumpul tiap kelurahan, lalu keluarkan (Taehwa Sanup 269-6512, Iljin Environment 274-2824, Samjeong Development 257-5878, Samhwa Silup 227-5360). Elektronik sedang-besar 1599-0903", "th": "แจ้งบริษัทเก็บขยะของแต่ละแขวงแล้วนำออกไปวาง (Taehwa Sanup 269-6512, Iljin Environment 274-2824, Samjeong Development 257-5878, Samhwa Silup 227-5360) เครื่องใช้ไฟฟ้าขนาดกลาง-ใหญ่ 1599-0903", "en": "Report to your dong's collection company, then put it out (Taehwa Sanup 태화산업 269-6512, Iljin Hwangyeong 일진환경 274-2824, Samjeong Gaebal 삼정개발 257-5878, Samhwa Silup 삼화실업 227-5360). Medium and large appliances: 1599-0903", "ru": "Сообщите в компанию по вывозу своего дон и выносите (태화산업 269-6512, 일진환경 274-2824, 삼정개발 257-5878, 삼화실업 227-5360). Средняя и крупная техника 1599-0903", "vi": "Khai báo với công ty thu gom của phường rồi để ra (태화산업 269-6512, 일진환경 274-2824, 삼정개발 257-5878, 삼화실업 227-5360). Đồ điện tử cỡ vừa và lớn: 1599-0903", "ja": "洞ごとの回収業者に申告してから出す（テファ産業（태화산업）269-6512、イルジン環境（일진환경）274-2824、サムジョン開発（삼정개발）257-5878、サムファ実業（삼화실업）227-5360）。中・大型廃家電 1599-0903", "zh": "向各洞的收运公司申报后排放（太和产业 태화산업 269-6512、日进环境 일진환경 274-2824、三正开发 삼정개발 257-5878、三和实业 삼화실업 227-5360）。中大型废家电1599-0903", "mn": "Хорооныхоо хог ачих компанид мэдэгдээд гаргана (태화산업 269-6512, 일진환경 274-2824, 삼정개발 257-5878, 삼화실업 227-5360). Дунд, том цахилгаан хэрэгсэл 1599-0903", "tw": "向各洞的收運公司申報後排放（太和產業 태화산업 269-6512、日進環境 일진환경 274-2824、三正開發 삼정개발 257-5878、三和實業 삼화실업 227-5360）。中大型廢家電1599-0903"}, "notes": {"ko": "재활용품은 그물망에(그물망은 동 행정복지센터 무료). 검정봉투 등 안 보이는 봉투로 버리면 과태료", "id": "Daur ulang di kantong jaring (그물망) (jaring gratis di kantor kelurahan (행정복지센터)). Buang dengan kantong tidak tembus pandang seperti kantong hitam = denda (과태료)", "th": "ขยะรีไซเคิลใส่ถุงตาข่าย (그물망) (รับถุงตาข่ายฟรีที่ศูนย์บริการชุมชน (행정복지센터)) ทิ้งด้วยถุงทึบ เช่น ถุงดำ จะถูกปรับ (과태료)", "en": "Recycling in a net bag (그물망) (free at the community center 동 행정복지센터). Throwing it out in a black or other non-see-through bag: fine (과태료)", "ru": "Вторсырьё — в сетчатый мешок (бесплатно в администрации дон (행정복지센터)). Если выбросить в чёрном или другом непрозрачном пакете — штраф", "vi": "Rác tái chế cho vào túi lưới (그물망) (túi lưới miễn phí ở trung tâm hành chính phường (행정복지센터)). Bỏ bằng túi đen hoặc túi không nhìn thấy bên trong sẽ bị phạt tiền (과태료)", "ja": "資源ごみはネット袋（그물망）に（ネット袋は洞の行政福祉センター（행정복지센터）で無料）。黒い袋など中が見えない袋で捨てると過料（과태료）", "zh": "可回收物装网袋（그물망）（网袋可在洞行政福利中心 동 행정복지센터 免费领取）。用黑色等看不见里面的袋子扔会被罚款（과태료）", "mn": "Дахин боловсруулах хогийг торон уутанд (торон уутыг хорооны захиргаа (행정복지센터) үнэгүй өгнө). Хар уут зэрэг дотор нь харагдахгүй уутаар хаявал торгууль", "tw": "可回收物裝網袋（그물망）（網袋可在洞行政福利中心 동 행정복지센터 免費領取）。用黑色等看不見裡面的袋子扔會被罰款（과태료）"}, "days": {"ko": "일반쓰레기 월~토 수거(전날 저녁 배출, 일요일 미수거). 음식물·재활용은 동별로 다름: 예) 음식물은 일·화·목 저녁 또는 월·수·금 저녁 배출", "id": "Sampah umum diambil Senin~Sabtu (buang malam sebelumnya, Minggu tidak diambil). Makanan dan daur ulang beda tiap kelurahan: contoh, makanan dibuang Minggu·Selasa·Kamis malam atau Senin·Rabu·Jumat malam", "th": "ขยะทั่วไปเก็บวันจันทร์~เสาร์ (ทิ้งเย็นวันก่อนหน้า วันอาทิตย์ไม่เก็บ) ขยะเศษอาหารและขยะรีไซเคิลต่างกันตามแขวง: เช่น ขยะเศษอาหารทิ้งเย็นวันอาทิตย์·อังคาร·พฤหัสบดี หรือเย็นวันจันทร์·พุธ·ศุกร์", "en": "General waste: pickup Mon–Sat (put out the evening before; no pickup on Sunday). Food waste and recycling differ by dong: e.g. food waste put out Sun·Tue·Thu evening or Mon·Wed·Fri evening", "ru": "Обычный мусор: вывоз пн~сб (выносить вечером накануне, в вс не вывозят). Пищевые отходы и вторсырьё — по дон: например, пищевые отходы вечером вс, вт, чт или пн, ср, пт", "vi": "Rác thường thu gom Thứ 2 ~ Thứ 7 (để ra tối hôm trước, CN không thu gom). Rác thức ăn và rác tái chế khác nhau theo phường: ví dụ rác thức ăn để ra tối CN·Thứ 3·Thứ 5 hoặc tối Thứ 2·Thứ 4·Thứ 6", "ja": "一般ごみは月〜土に回収（前日の夜に出す、日曜は回収なし）。生ごみ・資源ごみは洞ごとに違う：例）生ごみは日・火・木の夜 または 月・水・金の夜に出す", "zh": "一般垃圾周一至周六收（前一天晚上扔，周日不收）。厨余·可回收物按洞不同：例）厨余周日·二·四晚上或周一·三·五晚上扔", "mn": "Энгийн хог Даваа~Бямба ачна (өмнөх өдрийн орой гаргана, Ням гарагт ачихгүй). Хүнсний болон дахин боловсруулах хог хороогоор өөр: жишээ нь хүнсний хог Ням·Мягмар·Пүрэв эсвэл Даваа·Лхагва·Баасан гарагийн орой гаргана", "tw": "一般垃圾週一至週六收（前一天晚上扔，週日不收）。廚餘·可回收物按洞不同：例）廚餘週日·二·四晚上或週一·三·五晚上扔"}}, "url": "https://www.ulsannamgu.go.kr/fieldInfo/garbageWaste01.jsp", "checked": "2026-10-25"}, {"id": "ulsan-dong", "sido": {"ko": "울산광역시", "id": "Ulsan", "th": "อุลซาน (Ulsan)", "en": "Ulsan", "ru": "Ульсан", "vi": "Ulsan", "ja": "蔚山広域市", "zh": "蔚山广域市", "mn": "Ульсан", "tw": "蔚山廣域市"}, "name": {"ko": "동구", "id": "Dong-gu (Ulsan)", "th": "Dong-gu (Ulsan)", "en": "Dong-gu", "ru": "Ульсан, Тон-гу", "vi": "Dong-gu (Ulsan)", "ja": "東区（トン）", "zh": "东区", "mn": "Ульсан, Дон-гу", "tw": "東區"}, "f": {"hours": {"ko": "20:00~24:00 (수거 전날 저녁)", "id": "20:00~24:00 (malam sebelum hari ambil)", "th": "20:00~24:00 (เย็นวันก่อนวันเก็บ)", "en": "20:00–24:00 (the evening before pickup)", "ru": "20:00~24:00 (вечером накануне вывоза)", "vi": "20:00~24:00 (tối hôm trước ngày thu gom)", "ja": "20:00〜24:00（回収日の前日の夜）", "zh": "20:00–24:00（收运前一天晚上）", "mn": "20:00~24:00 (ачихын өмнөх өдрийн орой)", "tw": "20:00–24:00（收運前一天晚上）"}, "place": {"ko": "대문 앞 (공동주택은 지정 수거용기)", "id": "Di depan pintu gerbang (apartemen/rumah susun: wadah pengumpulan yang ditentukan)", "th": "หน้าประตูรั้ว (อพาร์ตเมนต์/อาคารชุด: ถังเก็บที่กำหนด)", "en": "In front of the gate (apartments: designated collection bins)", "ru": "Перед воротами (многоквартирные дома — назначенный контейнер)", "vi": "Trước cổng (chung cư (공동주택): thùng thu gom được chỉ định)", "ja": "門の前（共同住宅は決められた回収容器）", "zh": "大门前（公寓放指定回收桶）", "mn": "Хаалганы өмнө (орон сууц — заасан сав)", "tw": "大門前（公寓放指定回收桶）"}, "food": {"ko": "종량제봉투 판매소에서 납부필증 사서 이름 쓰고 전용용기 손잡이에 감아 문 앞 배출", "id": "Beli stiker bukti bayar (납부필증) di toko penjual kantong berbayar, tulis nama, lilitkan di pegangan wadah khusus, taruh di depan pintu", "th": "ซื้อสติกเกอร์ชำระเงิน (납부필증) ที่ร้านขายถุงขยะแบบเสียเงิน เขียนชื่อ พันที่หูจับถังเฉพาะ วางหน้าประตู", "en": "Buy a payment sticker (납부필증) at a pay-as-you-throw bag shop, write your name on it, wrap it around the special bin's handle, and put it in front of your door", "ru": "Купите наклейку об оплате (납부필증) в пункте продажи платных пакетов, напишите имя, оберните вокруг ручки спец. контейнера, выносите перед дверью", "vi": "Mua tem đã trả phí (납부필증) ở nơi bán túi rác có trả phí (종량제봉투), viết tên, quấn vào tay cầm của thùng chuyên dụng, để trước cửa", "ja": "従量制袋（종량제봉투）の販売店で納付済証（납부필증）を買い、名前を書いて専用容器の取っ手に巻き、玄関前に出す", "zh": "在计量收费袋销售处买缴费证（납부필증），写上名字缠在专用桶把手上，放在门前", "mn": "Төлбөртэй уут зардаг газраас төлбөрийн наалт (납부필증) авч нэрээ бичээд тусгай савны бариулд ороож хаалганы өмнө гаргана", "tw": "在計量收費袋銷售處買繳費證（납부필증），寫上名字纏在專用桶把手上，放在門前"}, "bags": {"ko": "지정된 봉투판매소", "id": "Toko penjual kantong yang ditentukan", "th": "ร้านขายถุงที่กำหนด", "en": "Designated bag shops", "ru": "Назначенные пункты продажи пакетов", "vi": "Nơi bán túi được chỉ định", "ja": "指定の袋販売店", "zh": "指定的垃圾袋销售处", "mn": "Заасан уут зардаг газар", "tw": "指定的垃圾袋銷售處"}, "bulky": {"ko": "'여기로' 홈페이지(yeogiro24.co.kr)·앱으로 신고, 또는 동별 업체(필환경 052-236-7900, 풍산기업 052-201-4261, 우성환경 052-234-8394)", "id": "Lapor di situs/aplikasi '여기로' (Yeogiro, yeogiro24.co.kr), atau perusahaan tiap kelurahan (Pil Environment 052-236-7900, Pungsan Company 052-201-4261, Useong Environment 052-234-8394)", "th": "แจ้งที่เว็บไซต์/แอป '여기로' (Yeogiro, yeogiro24.co.kr) หรือบริษัทของแต่ละแขวง (Pil Environment 052-236-7900, Pungsan Company 052-201-4261, Useong Environment 052-234-8394)", "en": "Report on the 'Yeogiro' (여기로) website (yeogiro24.co.kr) or app, or call your dong's company (Pilhwangyeong 필환경 052-236-7900, Pungsan Gieop 풍산기업 052-201-4261, Useong Hwangyeong 우성환경 052-234-8394)", "ru": "Заявка на сайте (yeogiro24.co.kr) или в приложении «여기로», или компании по дон (필환경 052-236-7900, 풍산기업 052-201-4261, 우성환경 052-234-8394)", "vi": "Khai báo trên trang web (yeogiro24.co.kr) hoặc ứng dụng '여기로' (Yeogiro), hoặc công ty theo phường (필환경 052-236-7900, 풍산기업 052-201-4261, 우성환경 052-234-8394)", "ja": "「여기로」（ヨギロ）ホームページ（yeogiro24.co.kr）・アプリで申告、または洞ごとの業者（ピル環境（필환경）052-236-7900、プンサン企業（풍산기업）052-201-4261、ウソン環境（우성환경）052-234-8394）", "zh": "通过“여기로”网站（yeogiro24.co.kr）·App申报，或各洞的公司（必环境 필환경 052-236-7900、丰山企业 풍산기업 052-201-4261、宇成环境 우성환경 052-234-8394）", "mn": "«여기로» сайт (yeogiro24.co.kr), аппаар мэдүүлэх, эсвэл хорооны компани (필환경 052-236-7900, 풍산기업 052-201-4261, 우성환경 052-234-8394)", "tw": "透過“여기로”網站（yeogiro24.co.kr）·App申報，或各洞的公司（必環境 필환경 052-236-7900、豐山企業 풍산기업 052-201-4261、宇成環境 우성환경 052-234-8394）"}, "notes": {"ko": "재활용품은 깨끗이 씻어 그물망에(분실 시 동 행정복지센터 무상). 소형폐가전은 동 행정복지센터 수거함", "id": "Daur ulang dicuci bersih, masukkan ke kantong jaring (그물망) (jika hilang, gratis di kantor kelurahan (행정복지센터)). Elektronik kecil: kotak di kantor kelurahan", "th": "ขยะรีไซเคิลล้างให้สะอาด ใส่ถุงตาข่าย (그물망) (ถ้าหาย รับฟรีที่ศูนย์บริการชุมชน (행정복지센터)) เครื่องใช้ไฟฟ้าขนาดเล็ก: กล่องรับที่ศูนย์บริการชุมชน", "en": "Wash recycling clean and put it in a net bag (그물망) (if lost, free at the community center 동 행정복지센터). Small appliances: collection box at the community center", "ru": "Вторсырьё — чисто вымыть, в сетчатый мешок (если потеряли — бесплатно в администрации дон (행정복지센터)). Мелкая техника — в ящик в администрации дон", "vi": "Rác tái chế rửa sạch, cho vào túi lưới (그물망) (mất thì nhận miễn phí ở trung tâm hành chính phường (행정복지센터)). Đồ điện nhỏ cũ: thùng thu gom ở trung tâm hành chính phường", "ja": "資源ごみはきれいに洗ってネット袋（그물망）に（なくしたら洞の行政福祉センター（행정복지센터）で無料）。小型廃家電は洞の行政福祉センターの回収箱", "zh": "可回收物洗干净装网袋（그물망）（丢失时可在洞行政福利中心 동 행정복지센터 免费领取）。小型废家电放洞行政福利中心回收箱", "mn": "Дахин боловсруулах хогийг сайн угааж торон уутанд (алдвал хорооны захиргаа (행정복지센터) үнэгүй өгнө). Жижиг цахилгаан хэрэгслийг хорооны захиргааны хайрцагт", "tw": "可回收物洗乾淨裝網袋（그물망）（丟失時可在洞行政福利中心 동 행정복지센터 免費領取）。小型廢家電放洞行政福利中心回收箱"}, "days": {"ko": "일반·음식물: 일~목 저녁 배출(월~금 수거). 재활용(단독·상가): 월 종이, 화 스티로폼·공병, 수 비닐, 목 캔·고철·플라스틱, 금 투명페트 (전날 저녁 배출) · 금·토 배출금지", "id": "Sampah umum dan makanan: buang Minggu~Kamis malam (ambil Senin~Jumat). Daur ulang (rumah tunggal dan toko): Senin kertas, Selasa styrofoam dan botol kosong, Rabu plastik tipis, Kamis kaleng/besi bekas/plastik, Jumat PET bening (buang malam sebelumnya) · Jumat·Sabtu dilarang buang", "th": "ขยะทั่วไปและขยะเศษอาหาร: ทิ้งเย็นวันอาทิตย์~พฤหัสบดี (เก็บจันทร์~ศุกร์) ขยะรีไซเคิล (บ้านเดี่ยวและร้านค้า): จันทร์ กระดาษ อังคาร โฟมและขวดเปล่า พุธ ถุงพลาสติก พฤหัสบดี กระป๋อง/เศษเหล็ก/พลาสติก ศุกร์ PET ใส (ทิ้งเย็นวันก่อนหน้า) · ศุกร์·เสาร์ ห้ามทิ้ง", "en": "General and food waste: put out Sun–Thu evening (pickup Mon–Fri). Recycling (houses and shops): Mon paper, Tue styrofoam and empty bottles, Wed plastic film, Thu cans, scrap metal and plastic, Fri clear PET (put out the evening before) · No disposal on Friday and Saturday", "ru": "Обычный мусор и пищевые отходы: выносить вечером вс~чт (вывоз пн~пт). Вторсырьё (частные дома и магазины): пн бумага, вт пенопласт и бутылки, ср плёнка, чт банки, металлолом, пластик, пт прозрачные ПЭТ (выносить вечером накануне) · В пт и сб выносить нельзя", "vi": "Rác thường, rác thức ăn: để ra tối CN ~ Thứ 5 (thu gom Thứ 2 ~ Thứ 6). Rác tái chế (nhà riêng, cửa hàng): Thứ 2 giấy, Thứ 3 xốp và chai lọ, Thứ 4 ni lông, Thứ 5 lon, sắt vụn, nhựa, Thứ 6 PET trong suốt (để ra tối hôm trước) · Cấm bỏ rác Thứ 6, Thứ 7", "ja": "一般ごみ・生ごみ：日〜木の夜に出す（月〜金に回収）。資源ごみ（一戸建て・店舗）：月 紙、火 発泡スチロール・空き瓶、水 ビニール、木 缶・鉄くず・プラスチック、金 透明ペット（前日の夜に出す） · 金・土は排出禁止", "zh": "一般垃圾·厨余：周日至周四晚上扔（周一至周五收）。可回收物（独栋·商铺）：周一 纸，周二 泡沫塑料·空瓶，周三 塑料膜，周四 罐·废铁·塑料，周五 透明PET（前一天晚上扔） · 周五、周六禁止扔", "mn": "Энгийн, хүнсний хог: Ням~Пүрэв гарагийн орой гаргана (Даваа~Баасан ачна). Дахин боловсруулах хог (хувийн байшин, дэлгүүр): Даваа цаас, Мягмар хөөсөнцөр, шилэн сав, Лхагва гялгар уут, Пүрэв лааз, хуучин төмөр, хуванцар, Баасан тунгалаг ПЭТ (өмнөх өдрийн орой гаргана) · Баасан·Бямбад гаргахыг хориглоно", "tw": "一般垃圾·廚餘：週日至週四晚上扔（週一至週五收）。可回收物（獨棟·商鋪）：週一 紙，週二 泡沫塑膠·空瓶，週三 塑膠膜，週四 罐·廢鐵·塑膠，週五 透明PET（前一天晚上扔） · 週五、週六禁止扔"}}, "url": "https://www.donggu.ulsan.kr/donggu/contents/contents.do?mId=7050101", "checked": "2026-10-25"}, {"id": "daejeon-dong", "sido": {"ko": "대전광역시", "id": "Daejeon", "th": "แทจ็อน (Daejeon)", "en": "Daejeon", "ru": "Тэджон", "vi": "Daejeon", "ja": "大田広域市", "zh": "大田广域市", "mn": "Тэжон", "tw": "大田廣域市"}, "name": {"ko": "동구", "id": "Dong-gu (Daejeon)", "th": "Dong-gu (Daejeon)", "en": "Dong-gu", "ru": "Тэджон, Тон-гу", "vi": "Dong-gu (Daejeon)", "ja": "東区（トン）", "zh": "东区", "mn": "Тэжон, Дон-гу", "tw": "東區"}, "f": {"hours": {"ko": "전날 18시 ~ 다음날 오전 2시", "id": "Malam sebelumnya 18:00 ~ 02:00 pagi berikutnya", "th": "วันก่อนหน้า 18:00 ~ 02:00 ของวันถัดไป", "en": "18:00 the day before – 02:00 the next day", "ru": "18:00 накануне ~ 02:00 следующего дня", "vi": "18:00 hôm trước ~ 02:00 sáng hôm sau", "ja": "前日18:00〜翌02:00", "zh": "前一天18:00–次日02:00", "mn": "Өмнөх өдөр 18:00 ~ маргааш нь 02:00", "tw": "前一天18:00–次日02:00"}, "place": {"ko": "내 집, 내 직장 앞", "id": "Di depan rumah atau tempat kerja Anda", "th": "หน้าบ้านหรือหน้าที่ทำงานของคุณ", "en": "In front of your own home or workplace", "ru": "Перед своим домом или местом работы", "vi": "Trước nhà, nơi làm việc của bạn", "ja": "自宅・職場の前", "zh": "自家、工作单位门前", "mn": "Өөрийн байр, ажлын газрын үүдэнд", "tw": "自家、工作單位門前"}, "food": {"ko": "가정용 용기(5ℓ)에 담아 납부필증 부착 후 1층 문밖에 배출", "id": "Masukkan ke wadah rumah (5 L), tempel stiker bukti bayar (납부필증), taruh di luar pintu lantai 1", "th": "ใส่ถังสำหรับบ้าน (5 ลิตร) ติดสติกเกอร์ชำระเงิน (납부필증) วางนอกประตูชั้น 1", "en": "Put it in a household bin (5L), attach a payment sticker (납부필증), and put it outside the door on the 1st floor", "ru": "В домашний контейнер (5 л) с наклейкой об оплате (납부필증), за дверь на 1 этаже", "vi": "Cho vào thùng gia đình (5L), dán tem đã trả phí (납부필증), để ngoài cửa tầng 1", "ja": "家庭用容器（5L）に入れ、納付済証（납부필증）を付けて1階の玄関の外に出す", "zh": "装入家用桶（5L），贴上缴费证（납부필증）放在1楼门外", "mn": "Гэрийн саванд (5 л) хийж төлбөрийн наалт (납부필증) нааж 1 давхрын хаалганы гадна гаргана", "tw": "裝入家用桶（5L），貼上繳費證（납부필증）放在1樓門外"}, "bulky": {"ko": "동 행정복지센터에서 스티커 구입 또는 구 누리집 인터넷 신고(donggu.go.kr/dg/kor/60/wasteApply) 후 부착, 동별 수거일정에 배출", "id": "Beli stiker di kantor kelurahan (행정복지센터) atau lapor online di situs kantor gu (donggu.go.kr/dg/kor/60/wasteApply), tempel, keluarkan sesuai jadwal ambil kelurahan", "th": "ซื้อสติกเกอร์ที่ศูนย์บริการชุมชน (행정복지센터) หรือแจ้งออนไลน์บนเว็บไซต์สำนักงานเขต (donggu.go.kr/dg/kor/60/wasteApply) ติดแล้วนำออกไปวางตามตารางเก็บของแขวง", "en": "Buy a sticker at the community center (동 행정복지센터) or report online on the district website (donggu.go.kr/dg/kor/60/wasteApply), attach it, and put it out on your dong's pickup schedule", "ru": "Купите наклейку в администрации дон (행정복지센터) или заявка через интернет на сайте района (donggu.go.kr/dg/kor/60/wasteApply), приклейте, выносите по расписанию дон", "vi": "Mua tem ở trung tâm hành chính phường (행정복지센터) hoặc khai báo online trên trang web của quận (donggu.go.kr/dg/kor/60/wasteApply), dán lên rồi để ra theo lịch thu gom của phường", "ja": "洞の行政福祉センター（행정복지센터）でシールを買う、または区のホームページでネット申告（donggu.go.kr/dg/kor/60/wasteApply）して貼り、洞ごとの回収日程に出す", "zh": "在洞行政福利中心（동 행정복지센터）买贴纸，或在区网站网上申报（donggu.go.kr/dg/kor/60/wasteApply）后贴上，按各洞收运日程排放", "mn": "Хорооны захиргаа (행정복지센터)-наас наалт авах эсвэл дүүргийн сайтаар интернетээр (donggu.go.kr/dg/kor/60/wasteApply) мэдүүлж нааж, хорооны хуваарийн дагуу гаргана", "tw": "在洞行政福利中心（동 행정복지센터）買貼紙，或在區網站網上申報（donggu.go.kr/dg/kor/60/wasteApply）後貼上，按各洞收運日程排放"}, "notes": {"ko": "재활용품은 투명비닐봉투나 종이봉투에 담아 동별 수거일정에 맞춰 집 앞에. 폐가전 무상수거 1599-0903", "id": "Daur ulang di kantong plastik bening atau kantong kertas, taruh di depan rumah sesuai jadwal ambil kelurahan. Ambil elektronik bekas gratis 1599-0903", "th": "ขยะรีไซเคิลใส่ถุงพลาสติกใสหรือถุงกระดาษ วางหน้าบ้านตามตารางเก็บของแขวง เก็บเครื่องใช้ไฟฟ้าเก่าฟรี 1599-0903", "en": "Recycling in a clear plastic bag or a paper bag, in front of your home on your dong's pickup schedule. Free pickup of old appliances: 1599-0903", "ru": "Вторсырьё — в прозрачный или бумажный пакет, по расписанию дон, перед домом. Бесплатный вывоз бытовой техники 1599-0903", "vi": "Rác tái chế cho vào túi ni lông trong suốt hoặc túi giấy, để trước nhà theo lịch thu gom của phường. Thu gom đồ điện tử cũ miễn phí: 1599-0903", "ja": "資源ごみは透明なビニール袋か紙袋に入れ、洞ごとの回収日程に合わせて自宅前へ。廃家電の無料回収 1599-0903", "zh": "可回收物装透明塑料袋或纸袋，按各洞收运日程放在家门前。旧家电免费回收1599-0903", "mn": "Дахин боловсруулах хогийг тунгалаг уут эсвэл цаасан уутанд хийж хорооны хуваарийн дагуу байрны үүдэнд. Хуучин цахилгаан хэрэгслийг үнэгүй авна 1599-0903", "tw": "可回收物裝透明塑膠袋或紙袋，按各洞收運日程放在家門前。舊家電免費回收1599-0903"}, "days": {"ko": "일반쓰레기(음식물 포함): 매일(금·토요일 제외). 재활용품·대형폐기물: 동별 수거요일 전날 · 금요일, 토요일", "id": "Sampah umum (termasuk makanan): setiap hari (kecuali Jumat dan Sabtu). Daur ulang dan sampah besar: sehari sebelum hari ambil kelurahan · Jumat, Sabtu", "th": "ขยะทั่วไป (รวมขยะเศษอาหาร): ทุกวัน (ยกเว้นวันศุกร์และวันเสาร์) ขยะรีไซเคิลและขยะชิ้นใหญ่: วันก่อนวันเก็บของแต่ละแขวง · วันศุกร์ วันเสาร์", "en": "General waste (including food waste): every day (except Fri and Sat). Recycling and large waste: the day before your dong's pickup day · Friday, Saturday", "ru": "Обычный мусор (и пищевые отходы): каждый день (кроме пт и сб). Вторсырьё и крупный мусор: накануне дня вывоза по дон · Пятница, суббота", "vi": "Rác thường (gồm rác thức ăn): mỗi ngày (trừ Thứ 6, Thứ 7). Rác tái chế, rác cồng kềnh: hôm trước ngày thu gom của phường · Thứ 6, Thứ 7", "ja": "一般ごみ（生ごみを含む）：毎日（金・土曜を除く）。資源ごみ・大型ごみ：洞ごとの回収曜日の前日 · 金曜、土曜", "zh": "一般垃圾（含厨余）：每天（周五·周六除外）。可回收物·大型废弃物：各洞收运日前一天 · 周五、周六", "mn": "Энгийн хог (хүнсний хог орно): өдөр бүр (Баасан·Бямбаас бусад). Дахин боловсруулах хог, том хог: хорооны ачих өдрийн өмнөх өдөр · Баасан гараг, Бямба гараг", "tw": "一般垃圾（含廚餘）：每天（週五·週六除外）。可回收物·大型廢棄物：各洞收運日前一天 · 週五、週六"}}, "url": "https://www.donggu.go.kr/dg/kor/contents/170", "checked": "2026-10-25"}, {"id": "daejeon-seo", "sido": {"ko": "대전광역시", "id": "Daejeon", "th": "แทจ็อน (Daejeon)", "en": "Daejeon", "ru": "Тэджон", "vi": "Daejeon", "ja": "大田広域市", "zh": "大田广域市", "mn": "Тэжон", "tw": "大田廣域市"}, "name": {"ko": "서구", "id": "Seo-gu (Daejeon)", "th": "Seo-gu (Daejeon)", "en": "Seo-gu", "ru": "Тэджон, Со-гу", "vi": "Seo-gu (Daejeon)", "ja": "西区（ソ）", "zh": "西区", "mn": "Тэжон, Со-гу", "tw": "西區"}, "f": {"hours": {"ko": "18:00~24:00", "id": "18:00~24:00", "th": "18:00~24:00", "en": "18:00–24:00", "ru": "18:00~24:00", "vi": "18:00~24:00", "ja": "18:00〜24:00", "zh": "18:00–24:00", "mn": "18:00~24:00", "tw": "18:00–24:00"}, "place": {"ko": "일반: 내 집·내 점포 앞 / 공동주택: 지정 배출장소 / 크린넷 지역: 크린넷 투입구", "id": "Biasa: di depan rumah atau toko Anda / Apartemen/rumah susun: tempat buang yang ditentukan / Wilayah Clean-net (크린넷): lubang Clean-net", "th": "ทั่วไป: หน้าบ้านหรือหน้าร้านของคุณ / อพาร์ตเมนต์/อาคารชุด: จุดทิ้งที่กำหนด / พื้นที่ Clean-net (크린넷): ช่อง Clean-net", "en": "Regular: in front of your own home or shop / Apartments: designated disposal spot / Clean Net (크린넷) areas: Clean Net inlet", "ru": "Обычно: перед своим домом или магазином / Многоквартирные дома: назначенное место / Районы 크린넷: приёмное отверстие 크린넷", "vi": "Khu thường: trước nhà, cửa hàng của bạn / Chung cư (공동주택): nơi bỏ rác được chỉ định / Khu Clean-net (크린넷): cửa nạp Clean-net", "ja": "一般：自宅・店舗の前 / 共同住宅：決められた排出場所 / クリーンネット（크린넷）地域：クリーンネットの投入口", "zh": "一般：自家·店铺门前 / 公寓：指定排放处 / Clean Net（크린넷）地区：Clean Net投放口", "mn": "Энгийн: өөрийн байр, дэлгүүрийн үүдэнд / Орон сууц: заасан газар / 크린넷 бүс: 크린넷-ийн нүх", "tw": "一般：自家·店鋪門前 / 公寓：指定排放處 / Clean Net（크린넷）地區：Clean Net投放口"}, "food": {"ko": "수거용기에 담아 용량에 맞는 납부필증을 걸어 저녁 6시 이후 대문 앞에 배출. 아파트는 거점용기(120ℓ). 도안지구는 전용봉투로 크린넷 투입", "id": "Masukkan ke wadah pengumpulan, gantung stiker bukti bayar (납부필증) sesuai kapasitas, taruh di depan pintu gerbang setelah 18:00. Apartemen: wadah bersama (120 L). Kawasan Doan: kantong khusus ke Clean-net", "th": "ใส่ถังเก็บขยะ แขวนสติกเกอร์ชำระเงิน (납부필증) ตามขนาด วางหน้าประตูรั้วหลัง 18:00 อพาร์ตเมนต์: ถังรวม (120 ลิตร) ย่าน Doan: ใส่ถุงเฉพาะทิ้งที่ Clean-net", "en": "Put it in the collection bin, hang a payment sticker (납부필증) matching the size, and put it in front of your gate after 18:00. Apartments: shared bins (120L). Doan district: special bag into the Clean Net", "ru": "В контейнер, повесьте наклейку об оплате (납부필증) по объёму, после 18:00 перед воротами. Апарты: общий контейнер (120 л). Район Тоан: в специальном пакете в 크린넷", "vi": "Cho vào thùng thu gom, treo tem đã trả phí (납부필증) đúng dung tích, để trước cổng sau 18:00. Chung cư (아파트): thùng chung (120L). Khu Doan: dùng túi chuyên dụng, bỏ vào Clean-net", "ja": "回収容器に入れ、容量に合う納付済証（납부필증）をかけて18:00以降に門の前へ。マンションは拠点容器（120L）。Doan地区は専用袋でクリーンネットへ", "zh": "装入回收桶，挂上与容量相符的缴费证（납부필증），18:00后放在大门前。公寓用集中桶（120L）。道安地区用专用袋投入Clean Net", "mn": "Саванд хийж багтаамжид тохирох төлбөрийн наалт (납부필증) зүүж 18:00-аас хойш хаалганы өмнө. Орон сууц — нийтийн сав (120 л). Доан бүс — тусгай уутаар 크린넷-д", "tw": "裝入回收桶，掛上與容量相符的繳費證（납부필증），18:00後放在大門前。公寓用集中桶（120L）。道安地區用專用袋投入Clean Net"}, "bags": {"ko": "납부필증은 종량제봉투 판매소에서 구입", "id": "Stiker bukti bayar (납부필증) dibeli di toko penjual kantong sampah berbayar (종량제봉투)", "th": "สติกเกอร์ชำระเงิน (납부필증) ซื้อที่ร้านขายถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Buy payment stickers (납부필증) at pay-as-you-throw bag shops (종량제봉투 판매소)", "ru": "Наклейки об оплате (납부필증) — в пунктах продажи платных пакетов (종량제 봉투)", "vi": "Tem đã trả phí (납부필증) mua ở nơi bán túi rác có trả phí (종량제봉투)", "ja": "納付済証（납부필증）は従量制袋（종량제봉투）の販売店で購入", "zh": "缴费证（납부필증）在计量收费袋销售处（종량제봉투 판매소）买", "mn": "Төлбөрийн наалт (납부필증)-ыг төлбөртэй уут (종량제 봉투) зардаг газраас", "tw": "繳費證（납부필증）在計量收費袋銷售處（종량제봉투 판매소）買"}, "bulky": {"ko": "동 행정복지센터 방문, 구 누리집(seogu.go.kr) 또는 '여기로' 앱으로 신고 후 스티커·배출번호 부착", "id": "Datang ke kantor kelurahan (행정복지센터), situs kantor gu (seogu.go.kr), atau aplikasi '여기로' (Yeogiro), lalu tempel stiker/nomor buang", "th": "ไปที่ศูนย์บริการชุมชน (행정복지센터) เว็บไซต์สำนักงานเขต (seogu.go.kr) หรือแอป '여기로' (Yeogiro) แจ้งแล้วติดสติกเกอร์/เลขทิ้งขยะ", "en": "Visit the community center (동 행정복지센터), or report on the district website (seogu.go.kr) or the 'Yeogiro' (여기로) app, then attach the sticker and disposal number", "ru": "Заявка в администрации дон (행정복지센터), на сайте района (seogu.go.kr) или в приложении «여기로», затем приклейте наклейку и номер", "vi": "Đến trung tâm hành chính phường (행정복지센터), khai báo trên trang web của quận (seogu.go.kr) hoặc ứng dụng '여기로' (Yeogiro), rồi dán tem/số bỏ rác", "ja": "洞の行政福祉センター（행정복지센터）に行く、区のホームページ（seogu.go.kr）または「여기로」（ヨギロ）アプリで申告後、シール・排出番号を貼る", "zh": "到洞行政福利中心（동 행정복지센터），或在区网站（seogu.go.kr）·“여기로”App申报后贴上贴纸·排放号码", "mn": "Хорооны захиргаа (행정복지센터)-нд очих, дүүргийн сайт (seogu.go.kr) эсвэл «여기로» аппаар мэдүүлээд наалт, дугаараа наана", "tw": "到洞行政福利中心（동 행정복지센터），或在區網站（seogu.go.kr）·“여기로”App申報後貼上貼紙·排放號碼"}, "notes": {"ko": "재활용품은 투명·반투명 비닐봉투에 담아 동별 수거 전날 저녁 일몰 후 집 앞에. 서구 종량제봉투는 서구에서만 사용", "id": "Daur ulang di kantong plastik bening atau setengah bening, taruh di depan rumah malam sebelum hari ambil kelurahan setelah matahari terbenam. Kantong berbayar Seo-gu hanya boleh dipakai di Seo-gu", "th": "ขยะรีไซเคิลใส่ถุงพลาสติกใสหรือขุ่นโปร่งแสง วางหน้าบ้านเย็นวันก่อนวันเก็บของแขวงหลังพระอาทิตย์ตก ถุงขยะแบบเสียเงินของซอ-กู ใช้ได้เฉพาะในซอ-กู", "en": "Recycling in a clear or semi-clear plastic bag, in front of your home after sunset on the evening before your dong's pickup. Seo-gu pay-as-you-throw bags can be used only in Seo-gu", "ru": "Вторсырьё — в прозрачный или полупрозрачный пакет, вечером после заката накануне вывоза по дон, перед домом. Платные пакеты (종량제 봉투) Со-гу — только в Со-гу", "vi": "Rác tái chế cho vào túi ni lông trong suốt hoặc nửa trong suốt, để trước nhà vào tối hôm trước ngày thu gom của phường, sau khi mặt trời lặn. Túi rác có trả phí của Seo-gu chỉ dùng được ở Seo-gu", "ja": "資源ごみは透明・半透明のビニール袋に入れ、洞ごとの回収日の前日、日没後に自宅前へ。西区の従量制袋は西区でのみ使える", "zh": "可回收物装透明或半透明塑料袋，在各洞收运前一天晚上日落后放在家门前。西区计量收费袋只能在西区使用", "mn": "Дахин боловсруулах хогийг тунгалаг, хагас тунгалаг уутанд хийж хорооны ачих өдрийн өмнөх орой нар жаргасны дараа байрны үүдэнд. Со-гугийн төлбөртэй уутыг (종량제 봉투) зөвхөн Со-гуд хэрэглэнэ", "tw": "可回收物裝透明或半透明塑膠袋，在各洞收運前一天晚上日落後放在家門前。西區計量收費袋只能在西區使用"}, "days": {"ko": "일요일~목요일 · 금요일, 토요일 (모든 쓰레기 배출하지 않는 날)", "id": "Minggu~Kamis · Jumat, Sabtu (hari tanpa buang sampah apa pun)", "th": "วันอาทิตย์~วันพฤหัสบดี · วันศุกร์ วันเสาร์ (วันที่ไม่ทิ้งขยะทุกประเภท)", "en": "Sunday–Thursday · Friday, Saturday (no waste of any kind)", "ru": "С воскресенья по четверг · Пятница, суббота (дни, когда никакой мусор не выносят)", "vi": "CN ~ Thứ 5 · Thứ 6, Thứ 7 (ngày không bỏ bất kỳ loại rác nào)", "ja": "日曜〜木曜 · 金曜、土曜（すべてのごみを出さない日）", "zh": "周日至周四 · 周五、周六（所有垃圾都不扔的日子）", "mn": "Ням~Пүрэв гараг · Баасан гараг, Бямба гараг (ямар ч хог гаргахгүй өдөр)", "tw": "週日至週四 · 週五、週六（所有垃圾都不扔的日子）"}}, "url": "https://www.seogu.go.kr/kor/sub06_11_01_08.do", "checked": "2026-10-25"}, {"id": "daejeon-yuseong", "sido": {"ko": "대전광역시", "id": "Daejeon", "th": "แทจ็อน (Daejeon)", "en": "Daejeon", "ru": "Тэджон", "vi": "Daejeon", "ja": "大田広域市", "zh": "大田广域市", "mn": "Тэжон", "tw": "大田廣域市"}, "name": {"ko": "유성구", "id": "Yuseong-gu", "th": "Yuseong-gu", "en": "Yuseong-gu", "ru": "Тэджон, Юсон-гу", "vi": "Yuseong-gu", "ja": "儒城区（ユソン）", "zh": "儒城区", "mn": "Тэжон, Юсон-гу", "tw": "儒城區"}, "f": {"hours": {"ko": "저녁 18:00~24:00 (가급적 20시 이전 배출)", "id": "Malam 18:00~24:00 (sebisanya sebelum 20:00)", "th": "ตอนเย็น 18:00~24:00 (ถ้าทำได้ ก่อน 20:00)", "en": "Evening 18:00–24:00 (before 20:00 if possible)", "ru": "Вечером 18:00~24:00 (лучше до 20:00)", "vi": "Tối 18:00~24:00 (nên bỏ trước 20:00)", "ja": "18:00〜24:00（できれば20:00前に出す）", "zh": "晚上18:00–24:00（尽量在20:00前）", "mn": "Орой 18:00~24:00 (боломжтой бол 20:00-аас өмнө)", "tw": "晚上18:00–24:00（儘量在20:00前）"}, "place": {"ko": "일반지역: 내 집(상가) 앞 / 공동주택: 관리자가 정한 장소 / 도안 크린넷 지역: 종량제·음식물은 크린넷 투입구", "id": "Wilayah biasa: di depan rumah (toko) Anda / Apartemen/rumah susun: tempat yang ditentukan pengelola / Wilayah Clean-net (크린넷) Doan: kantong berbayar dan sampah makanan ke lubang Clean-net", "th": "พื้นที่ทั่วไป: หน้าบ้าน (ร้าน) ของคุณ / อพาร์ตเมนต์/อาคารชุด: จุดที่ผู้ดูแลกำหนด / พื้นที่ Clean-net (크린넷) ย่าน Doan: ขยะถุงเสียเงินและขยะเศษอาหารทิ้งที่ช่อง Clean-net", "en": "Regular areas: in front of your home (shop) / Apartments: spot chosen by the manager / Doan Clean Net (크린넷) area: pay-as-you-throw and food waste into the Clean Net inlet", "ru": "Обычные районы: перед своим домом (магазином) / Многоквартирные дома: место, назначенное управляющим / Район Тоан с системой 크린넷: платные пакеты и пищевые отходы — в приёмное отверстие 크린넷", "vi": "Khu thường: trước nhà (cửa hàng) của bạn / Chung cư (공동주택): nơi do ban quản lý chỉ định / Khu Clean-net Doan (도안 크린넷): túi rác có trả phí và rác thức ăn bỏ vào cửa nạp Clean-net", "ja": "一般地域：自宅（店舗）の前 / 共同住宅：管理者が決めた場所 / Doan（도안）クリーンネット（크린넷）地域：従量制袋・生ごみはクリーンネットの投入口", "zh": "一般地区：自家（商铺）门前 / 公寓：管理人员指定的地点 / 道安Clean Net（크린넷）地区：计量收费袋·厨余投入Clean Net投放口", "mn": "Энгийн бүс: өөрийн байр (дэлгүүр)-ны үүдэнд / Орон сууц: менежерийн заасан газар / Доан 크린넷 бүс: төлбөртэй уут, хүнсний хогийг 크린넷-ийн нүхэнд", "tw": "一般地區：自家（商鋪）門前 / 公寓：管理人員指定的地點 / 道安Clean Net（크린넷）地區：計量收費袋·廚餘投入Clean Net投放口"}, "food": {"ko": "전용용기에 담아 용기에 맞는 납부필증 부착 후 집 앞 배출(비닐봉투 배출 시 수거 불가). 도안 크린넷 지역은 전용봉투로 투입구에", "id": "Masukkan ke wadah khusus, tempel stiker bukti bayar (납부필증) sesuai ukuran wadah, taruh di depan rumah (dalam kantong plastik tidak diambil). Wilayah Clean-net Doan: kantong khusus ke lubang pemasukan", "th": "ใส่ถังเฉพาะ ติดสติกเกอร์ชำระเงิน (납부필증) ที่ตรงกับขนาดถัง วางหน้าบ้าน (ถ้าใส่ถุงพลาสติกจะไม่เก็บ) พื้นที่ Clean-net ย่าน Doan: ใส่ถุงเฉพาะทิ้งที่ช่องใส่ขยะ", "en": "Put it in a special bin, attach a payment sticker (납부필증) matching the bin, and put it in front of your home (not collected in plastic bags). Doan Clean Net area: special bag into the inlet", "ru": "В спец. контейнер с подходящей наклейкой об оплате (납부필증), перед домом (в полиэтиленовом пакете не заберут). Район Тоан с 크린넷 — в специальном пакете в приёмное отверстие", "vi": "Cho vào thùng chuyên dụng, gắn tem đã trả phí (납부필증) đúng loại thùng, để trước nhà (nếu bỏ bằng túi ni lông sẽ không được thu gom). Khu Clean-net Doan: dùng túi chuyên dụng, bỏ vào cửa nạp", "ja": "専用容器に入れ、容器に合う納付済証（납부필증）を付けて自宅前に出す（ビニール袋で出すと回収されない）。Doanクリーンネット地域は専用袋で投入口へ", "zh": "装入专用桶并贴上与桶相符的缴费证（납부필증）放在家门前（用塑料袋装不收）。道安Clean Net地区用专用袋投入投放口", "mn": "Тусгай саванд тохирох төлбөрийн наалт (납부필증) нааж байрны үүдэнд (гялгар уутаар гаргавал авахгүй). Доан 크린넷 бүс — тусгай уутаар нүхэнд", "tw": "裝入專用桶並貼上與桶相符的繳費證（납부필증）放在家門前（用塑膠袋裝不收）。道安Clean Net地區用專用袋投入投放口"}, "bulky": {"ko": "신고 후 신고필증 부착해 배출. 신고필증: 구청, 동 행정복지센터, 구 누리집(yuseong.go.kr/clean), '빼기' 앱", "id": "Lapor, lalu tempel bukti lapor (신고필증) dan keluarkan. Bukti lapor: kantor gu, kantor kelurahan (행정복지센터), situs kantor gu (yuseong.go.kr/clean), aplikasi '빼기' (Bbegi)", "th": "แจ้งแล้วติดใบรับแจ้ง (신고필증) จึงนำออกไปวาง ใบรับแจ้ง: สำนักงานเขต ศูนย์บริการชุมชน (행정복지센터) เว็บไซต์สำนักงานเขต (yuseong.go.kr/clean) แอป '빼기' (Bbegi)", "en": "Report, then attach the certificate (신고필증) and put it out. Certificate: district office (구청), community center (동 행정복지센터), district website (yuseong.go.kr/clean), 'Bbegi' (빼기) app", "ru": "Заявка, затем приклейте квитанцию (신고필증) и выносите. Квитанция: администрация района (구청), администрация дон (행정복지센터), сайт района (yuseong.go.kr/clean), приложение «빼기»", "vi": "Khai báo rồi dán giấy xác nhận khai báo (신고필증) và để ra. Giấy xác nhận: văn phòng quận (구청), trung tâm hành chính phường (행정복지센터), trang web của quận (yuseong.go.kr/clean), ứng dụng '빼기' (Bbegi)", "ja": "申告後、申告済証（신고필증）を貼って出す。申告済証：区役所、洞の行政福祉センター（행정복지센터）、区のホームページ（yuseong.go.kr/clean）、「빼기」（ペギ）アプリ", "zh": "申报后贴上申报证（신고필증）排放。申报证：区厅（구청）、洞行政福利中心（동 행정복지센터）、区网站（yuseong.go.kr/clean）、“빼기”App", "mn": "Мэдүүлээд бүртгэлийн баримт (신고필증) нааж гаргана. Баримт: дүүргийн захиргаа (구청), хорооны захиргаа (행정복지센터), дүүргийн сайт (yuseong.go.kr/clean), «빼기» апп", "tw": "申報後貼上申報證（신고필증）排放。申報證：區廳（구청）、洞行政福利中心（동 행정복지센터）、區網站（yuseong.go.kr/clean）、“빼기”App"}, "notes": {"ko": "재활용품은 투명봉투에 담아 동별 배출일 전날 저녁 집 앞에. 폐가전 무상수거 1599-0903", "id": "Daur ulang di kantong bening, taruh di depan rumah malam sebelum hari buang kelurahan. Ambil elektronik bekas gratis 1599-0903", "th": "ขยะรีไซเคิลใส่ถุงใส วางหน้าบ้านเย็นวันก่อนวันทิ้งของแขวง เก็บเครื่องใช้ไฟฟ้าเก่าฟรี 1599-0903", "en": "Recycling in a clear bag, in front of your home on the evening before your dong's disposal day. Free pickup of old appliances: 1599-0903", "ru": "Вторсырьё — в прозрачный пакет, вечером накануне дня по дон, перед домом. Бесплатный вывоз бытовой техники 1599-0903", "vi": "Rác tái chế cho vào túi trong suốt, để trước nhà vào tối hôm trước ngày bỏ của phường. Thu gom đồ điện tử cũ miễn phí: 1599-0903", "ja": "資源ごみは透明な袋に入れ、洞ごとの排出日の前日の夜に自宅前へ。廃家電の無料回収 1599-0903", "zh": "可回收物装透明袋，在各洞排放日前一天晚上放在家门前。旧家电免费回收1599-0903", "mn": "Дахин боловсруулах хогийг тунгалаг уутанд хийж хорооны гаргах өдрийн өмнөх орой байрны үүдэнд. Хуучин цахилгаан хэрэгслийг үнэгүй авна 1599-0903", "tw": "可回收物裝透明袋，在各洞排放日前一天晚上放在家門前。舊家電免費回收1599-0903"}, "days": {"ko": "일반·음식물: 매일(금·토요일 제외). 재활용품: 동별 지정 요일 저녁(남부·북부권역 일정표 참고) · 금요일, 토요일", "id": "Sampah umum dan makanan: setiap hari (kecuali Jumat dan Sabtu). Daur ulang: malam hari yang ditentukan tiap kelurahan (lihat jadwal wilayah selatan dan utara) · Jumat, Sabtu", "th": "ขยะทั่วไปและขยะเศษอาหาร: ทุกวัน (ยกเว้นวันศุกร์และวันเสาร์) ขยะรีไซเคิล: เย็นวันที่แต่ละแขวงกำหนด (ดูตารางเขตใต้และเขตเหนือ) · วันศุกร์ วันเสาร์", "en": "General and food waste: every day (except Fri and Sat). Recycling: evening of the day set for your dong (see the southern/northern area schedules) · Friday, Saturday", "ru": "Обычный мусор и пищевые отходы: каждый день (кроме пт и сб). Вторсырьё: вечером в дни по дон (расписание южной и северной зоны) · Пятница, суббота", "vi": "Rác thường, rác thức ăn: mỗi ngày (trừ Thứ 6, Thứ 7). Rác tái chế: tối ngày quy định theo phường (xem lịch khu Nam, khu Bắc) · Thứ 6, Thứ 7", "ja": "一般ごみ・生ごみ：毎日（金・土曜を除く）。資源ごみ：洞ごとに決まった曜日の夜（南部・北部圏域の日程表を参照） · 金曜、土曜", "zh": "一般垃圾·厨余：每天（周五·周六除外）。可回收物：各洞指定日的晚上（参考南部·北部区域日程表） · 周五、周六", "mn": "Энгийн, хүнсний хог: өдөр бүр (Баасан·Бямбаас бусад). Дахин боловсруулах хог: хорооны заасан өдрийн орой (өмнөд, хойд бүсийн хуваарь) · Баасан гараг, Бямба гараг", "tw": "一般垃圾·廚餘：每天（週五·週六除外）。可回收物：各洞指定日的晚上（參考南部·北部區域日程表） · 週五、週六"}}, "url": "https://www.yuseong.go.kr/kor/sub07_11_03_09.do", "checked": "2026-10-25"}, {"id": "sejong", "sido": {"ko": "세종특별자치시", "id": "Sejong", "th": "เซจง (Sejong)", "en": "Sejong Special Self-Governing City", "ru": "Сэджон", "vi": "Sejong", "ja": "世宗特別自治市", "zh": "世宗特别自治市", "mn": "Сэжон", "tw": "世宗特別自治市"}, "name": {"ko": "세종특별자치시", "id": "Sejong", "th": "Sejong", "en": "Sejong", "ru": "Сэджон", "vi": "Sejong", "ja": "世宗（セジョン）", "zh": "世宗", "mn": "Сэжон", "tw": "世宗"}, "f": {"hours": {"ko": "읍·면지역: 전날 저녁 ~ 수거일 새벽 6시 이전 배출 (동지역 배출시간은 확인 못 함)", "id": "Wilayah eup·myeon: malam sebelumnya ~ sebelum 06:00 pagi hari ambil (jam buang wilayah dong belum dapat dicek)", "th": "พื้นที่ อึบ·มย็อน (읍·면): เย็นวันก่อนหน้า ~ ก่อน 06:00 ของวันเก็บ (เวลาทิ้งในพื้นที่ทง (동) ยังตรวจสอบไม่ได้)", "en": "Eup/myeon (town and rural) areas: from the evening before until before 06:00 on pickup day (disposal hours for dong areas were not confirmed)", "ru": "Районы ып и мён: вечер накануне ~ до 06:00 дня вывоза (часы для районов дон не проверены)", "vi": "Khu eup·myeon (읍·면): để ra từ tối hôm trước ~ trước 06:00 sáng ngày thu gom (giờ bỏ rác ở khu dong chưa kiểm tra được)", "ja": "邑・面（읍・면）地域：前日の夜〜回収日の06:00前に出す（洞地域の排出時間は確認できていません）", "zh": "邑·面地区：前一天晚上~收运日06:00前排放（洞地区的排放时间未能确认）", "mn": "Ыб, мён бүс: өмнөх өдрийн орой ~ ачих өдрийн 06:00-аас өмнө (дон бүсийн цагийг шалгаж чадаагүй)", "tw": "邑·面地區：前一天晚上~收運日06:00前排放（洞地區的排放時間未能確認）"}, "place": {"ko": "단독주택·상가: 내 집 앞(재활용품) / 공동주택: 단지 내 배출장소 / 크린넷 지역: 크린넷 투입구", "id": "Rumah tunggal dan toko: di depan rumah (daur ulang) / Apartemen/rumah susun: tempat buang di kompleks / Wilayah Clean-net (크린넷): lubang Clean-net", "th": "บ้านเดี่ยวและร้านค้า: หน้าบ้าน (ขยะรีไซเคิล) / อพาร์ตเมนต์/อาคารชุด: จุดทิ้งในโครงการ / พื้นที่ Clean-net (크린넷): ช่อง Clean-net", "en": "Houses and shops: in front of your home (recycling) / Apartments: disposal spot in the complex / Clean Net (크린넷) areas: Clean Net inlet", "ru": "Частные дома и магазины: перед своим домом (вторсырьё) / Многоквартирные дома: место в комплексе / Районы 크린넷: приёмное отверстие 크린넷", "vi": "Nhà riêng, cửa hàng: trước nhà (rác tái chế) / Chung cư (공동주택): nơi bỏ rác trong khu / Khu Clean-net (크린넷): cửa nạp Clean-net", "ja": "一戸建て・商店：自宅前（資源ごみ）/ 共同住宅：団地内の排出場所 / クリーンネット（크린넷）地域：クリーンネットの投入口", "zh": "独栋住宅·商铺：自家门前（可回收物）/ 公寓：小区内排放处 / Clean Net（크린넷）地区：Clean Net投放口", "mn": "Хувийн байшин, дэлгүүр: өөрийн байрны үүдэнд (дахин боловсруулах хог) / Орон сууц: хотхоны хог гаргах газар / 크린넷 бүс: 크린넷-ийн нүх", "tw": "獨棟住宅·商鋪：自家門前（可回收物）/ 公寓：小區內排放處 / Clean Net（크린넷）地區：Clean Net投放口"}, "food": {"ko": "음식물용 종량제봉투 사용. 크린넷에서는 일반쓰레기와 같은 투입구에 버리면 안 됨", "id": "Pakai kantong sampah makanan berbayar (음식물 종량제봉투). Di Clean-net, jangan buang ke lubang yang sama dengan sampah umum", "th": "ใช้ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제봉투) ที่ Clean-net ห้ามทิ้งในช่องเดียวกับขยะทั่วไป", "en": "Use a food-waste pay-as-you-throw bag (음식물용 종량제봉투). In Clean Net areas, do not put it into the same inlet as general waste", "ru": "Платный пакет для пищевых отходов (음식물 종량제 봉투). В 크린넷 нельзя бросать в то же отверстие, что и обычный мусор", "vi": "Dùng túi rác thức ăn có trả phí (종량제봉투). Ở Clean-net, không bỏ vào cùng cửa nạp với rác thường", "ja": "生ごみ用の従量制袋（종량제봉투）を使う。クリーンネットでは一般ごみと同じ投入口に捨ててはいけない", "zh": "使用厨余用计量收费袋（음식물용 종량제봉투）。在Clean Net不能投入一般垃圾的同一投放口", "mn": "Хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투) хэрэглэнэ. 크린넷-д энгийн хогтой нэг нүхэнд хаяж болохгүй", "tw": "使用廚餘用計量收費袋（음식물용 종량제봉투）。在Clean Net不能投入一般垃圾的同一投放口"}, "bulky": {"ko": "품목별 스티커 부착 후 배출. 스티커는 지정판매소 또는 인터넷 신청(sjwaste.kr)", "id": "Tempel stiker per barang, lalu keluarkan. Stiker di toko penjual resmi atau daftar online (sjwaste.kr)", "th": "ติดสติกเกอร์ตามชนิดของแล้วนำออกไปวาง สติกเกอร์ซื้อที่ร้านที่ได้รับอนุญาตหรือยื่นขอออนไลน์ (sjwaste.kr)", "en": "Attach a sticker for the item and put it out. Stickers: designated shops or online (sjwaste.kr)", "ru": "Приклейте наклейку по виду предмета и выносите. Наклейка — в пункте продажи или заявка через интернет (sjwaste.kr)", "vi": "Dán tem theo từng món rồi để ra. Tem mua ở nơi bán được chỉ định hoặc đăng ký online (sjwaste.kr)", "ja": "品目別のシールを貼って出す。シールは指定販売店またはインターネットで申請（sjwaste.kr）", "zh": "按物品贴上贴纸后排放。贴纸在指定销售处买或网上申请（sjwaste.kr）", "mn": "Төрөл бүрийн наалт нааж гаргана. Наалтыг заасан худалдааны цэг эсвэл интернетээр (sjwaste.kr)", "tw": "按物品貼上貼紙後排放。貼紙在指定銷售處買或網上申請（sjwaste.kr）"}, "notes": {"ko": "100ℓ 봉투 사용 금지. 이불·건축자재·부탄가스 등은 크린넷 투입 금지", "id": "Kantong 100 L dilarang. Selimut, bahan bangunan, gas butana, dll. dilarang masuk Clean-net", "th": "ห้ามใช้ถุง 100 ลิตร ผ้าห่ม วัสดุก่อสร้าง แก๊สบิวเทน ฯลฯ ห้ามทิ้งลง Clean-net", "en": "Do not use 100L bags. Blankets, building materials, butane gas cans etc. must not go into the Clean Net", "ru": "Пакеты 100 л нельзя. Одеяла, стройматериалы, газовые баллончики и т. п. в 크린넷 бросать нельзя", "vi": "Cấm dùng túi 100L. Chăn, vật liệu xây dựng, bình gas mini, v.v. không được bỏ vào Clean-net", "ja": "100Lの袋は使用禁止。布団・建築資材・カセットボンベなどはクリーンネットに入れてはいけない", "zh": "禁止使用100L袋。被子·建材·丁烷气罐等不能投入Clean Net", "mn": "100 л уут хэрэглэхийг хориглоно. Хөнжил, барилгын материал, бутан хий зэргийг 크린넷-д хийхийг хориглоно", "tw": "禁止使用100L袋。被子·建材·丁烷氣罐等不能投入Clean Net"}, "days": {"ko": "동지역은 생활권별로 다름(예: 1·2생활권 생활폐기물(크린넷 외) 월요일, 3~6생활권 월~토). 읍·면은 권역별 상이", "id": "Wilayah dong: beda tiap zona hidup (생활권) (contoh: zona 1·2 sampah rumah tangga (selain Clean-net) hari Senin, zona 3~6 Senin~Sabtu). Eup·myeon: beda tiap wilayah", "th": "พื้นที่ทง: แตกต่างตามเขตชุมชน (생활권) (เช่น เขต 1·2 ขยะครัวเรือน (นอก Clean-net) วันจันทร์ เขต 3~6 วันจันทร์~เสาร์) อึบ·มย็อน: แตกต่างตามพื้นที่", "en": "Dong areas differ by living zone (생활권) (e.g. zones 1·2: household waste (not Clean Net) on Monday; zones 3–6: Mon–Sat). Eup/myeon: differs by area", "ru": "Районы дон — по жилым зонам (например, зоны 1·2: бытовой мусор (кроме 크린넷) в понедельник, зоны 3~6: пн~сб). В ып и мён — по-разному", "vi": "Khu dong: khác nhau theo khu sinh hoạt (생활권) (ví dụ: khu sinh hoạt 1·2, rác sinh hoạt (ngoài Clean-net): Thứ 2; khu 3~6: Thứ 2 ~ Thứ 7). Eup·myeon: khác nhau theo khu vực", "ja": "洞地域は生活圏（생활권）ごとに違う（例：1・2生活圏の生活ごみ（クリーンネット以外）は月曜、3〜6生活圏は月〜土）。邑・面は地域ごとに違う", "zh": "洞地区按生活圈（생활권）不同（例：1·2生活圈 生活垃圾（Clean Net以外）周一，3~6生活圈 周一至周六）。邑·面按区域不同", "mn": "Дон бүс — амьдралын бүсээс хамаарна (жишээ нь: 1·2-р бүс ахуйн хог (크린넷-ээс бусад) Даваа гараг, 3~6-р бүс Даваа~Бямба). Ыб, мён — бүсээс хамаарна", "tw": "洞地區按生活圈（생활권）不同（例：1·2生活圈 生活垃圾（Clean Net以外）週一，3~6生活圈 週一至週六）。邑·面按區域不同"}}, "url": "https://www.sejong.go.kr/recycle/sub03_01_02.do", "checked": "2026-10-25"}, {"id": "jn-mokpo", "sido": {"ko": "전남광주통합특별시", "id": "Jeonnam-Gwangju (Kota Khusus Terpadu)", "th": "เมืองพิเศษรวมช็อนนัม-ควังจู (Jeonnam-Gwangju)", "en": "Jeonnam-Gwangju Integrated Special City", "ru": "Кванджу–Чолла-Намдо (전남광주통합특별시)", "vi": "Jeonnam-Gwangju (전남광주통합특별시)", "ja": "全南光州統合特別市", "zh": "全南光州统合特别市", "mn": "Жолла-Намдо–Гванжу нэгдсэн тусгай хот (전남광주통합특별시)", "tw": "全南光州統合特別市"}, "name": {"ko": "목포시", "id": "Mokpo-si", "th": "Mokpo-si", "en": "Mokpo-si", "ru": "Чолла-Намдо, Мокпхо", "vi": "Mokpo-si", "ja": "木浦市（モクポ）", "zh": "木浦市", "mn": "Жолла-Намдо, Могпо", "tw": "木浦市"}, "f": {"hours": {"ko": "하절기 19시 ~ 익일 5시 전, 동절기 18시 ~ 익일 5시 전", "id": "Musim panas 19:00 ~ sebelum 05:00 pagi berikutnya, musim dingin 18:00 ~ sebelum 05:00 pagi berikutnya", "th": "ฤดูร้อน 19:00 ~ ก่อน 05:00 ของวันถัดไป ฤดูหนาว 18:00 ~ ก่อน 05:00 ของวันถัดไป", "en": "Summer 19:00 – before 05:00 next day, winter 18:00 – before 05:00 next day", "ru": "Лето: 19:00 ~ до 05:00 следующего дня, зима: 18:00 ~ до 05:00 следующего дня", "vi": "Mùa hè 19:00 ~ trước 05:00 sáng hôm sau, mùa đông 18:00 ~ trước 05:00 sáng hôm sau", "ja": "夏期 19:00〜翌05:00前、冬期 18:00〜翌05:00前", "zh": "夏季19:00~次日05:00前，冬季18:00~次日05:00前", "mn": "Зун 19:00 ~ маргааш нь 05:00-аас өмнө, өвөл 18:00 ~ маргааш нь 05:00-аас өмнө", "tw": "夏季19:00~次日05:00前，冬季18:00~次日05:00前"}, "place": {"ko": "공동주택: 단지 내 암롤박스·지정 장소 / 단독주택: 동에서 지정한 인근 배출장소", "id": "Apartemen/rumah susun: kontainer besar (암롤박스) atau tempat yang ditentukan di kompleks / Rumah tunggal: tempat buang terdekat yang ditentukan kelurahan", "th": "อพาร์ตเมนต์/อาคารชุด: ตู้คอนเทนเนอร์ (암롤박스) หรือจุดที่กำหนดในโครงการ / บ้านเดี่ยว: จุดทิ้งใกล้บ้านที่แขวงกำหนด", "en": "Apartments: roll-off container (암롤박스) or designated spot in the complex / Houses: nearby disposal spot set by the dong", "ru": "Многоквартирные дома: большой контейнер (암롤박스) или назначенное место в комплексе / Частные дома: ближайшее место выноса, назначенное дон", "vi": "Chung cư (공동주택): thùng container lớn (암롤박스) hoặc nơi được chỉ định trong khu / Nhà riêng: nơi bỏ rác gần nhà do phường chỉ định", "ja": "共同住宅：団地内のアームロールボックス（암롤박스）・決められた場所 / 一戸建て：洞が決めた近くの排出場所", "zh": "公寓：小区内大型垃圾箱（암롤박스）·指定地点 / 独栋住宅：洞指定的附近排放处", "mn": "Орон сууц: хотхоны том чингэлэг (암롤박스), заасан газар / Хувийн байшин: хорооны заасан ойролцоох хог гаргах газар", "tw": "公寓：小區內大型垃圾箱（암롤박스）·指定地點 / 獨棟住宅：洞指定的附近排放處"}, "food": {"ko": "전용수거용기에 용량별 납부필증을 손잡이에 부착해 집·점포 앞 배출(수거전일 21시~당일 05시). 단독주택은 권역별 격일제(월수금 또는 화목토)", "id": "Tempel stiker bukti bayar (납부필증) sesuai kapasitas di pegangan wadah khusus, taruh di depan rumah atau toko (malam sebelum hari ambil 21:00~05:00 hari ambil). Rumah tunggal: selang sehari per zona (Senin·Rabu·Jumat atau Selasa·Kamis·Sabtu)", "th": "ติดสติกเกอร์ชำระเงิน (납부필증) ตามขนาดที่หูจับถังเฉพาะ วางหน้าบ้านหรือหน้าร้าน (เย็นวันก่อนวันเก็บ 21:00~05:00 ของวันเก็บ) บ้านเดี่ยว: วันเว้นวันตามเขต (จันทร์·พุธ·ศุกร์ หรือ อังคาร·พฤหัสบดี·เสาร์)", "en": "Attach a payment sticker (납부필증) for the bin size to the handle of the special bin; in front of your home or shop (21:00 the day before – 05:00 on pickup day). Houses: every other day by area (Mon·Wed·Fri or Tue·Thu·Sat)", "ru": "Спец. контейнер, на ручку — наклейку об оплате (납부필증) по объёму, перед домом или магазином (накануне вывоза 21:00 ~ 05:00 дня вывоза). Частные дома: через день по зонам (пн, ср, пт или вт, чт, сб)", "vi": "Gắn tem đã trả phí (납부필증) theo dung tích vào tay cầm thùng thu gom chuyên dụng, để trước nhà hoặc cửa hàng (21:00 hôm trước ~ 05:00 ngày thu gom). Nhà riêng: cách ngày theo khu (Thứ 2·Thứ 4·Thứ 6 hoặc Thứ 3·Thứ 5·Thứ 7)", "ja": "専用回収容器に容量別の納付済証（납부필증）を取っ手に付けて自宅・店舗の前に出す（回収日の前日21:00〜当日05:00）。一戸建ては地域ごとに1日おき（月水金 または 火木土）", "zh": "在专用回收桶把手上贴与容量相符的缴费证（납부필증），放在家·店铺门前（收运前一天21:00~当天05:00）。独栋住宅按区域隔天（周一·三·五或周二·四·六）", "mn": "Тусгай савны бариулд багтаамжид тохирох төлбөрийн наалт (납부필증) нааж байр, дэлгүүрийн үүдэнд (ачихын өмнөх өдөр 21 цаг~тэр өдрийн 05 цаг). Хувийн байшин — бүсээр өдөр алгасан (Даваа·Лхагва·Баасан эсвэл Мягмар·Пүрэв·Бямба)", "tw": "在專用回收桶把手上貼與容量相符的繳費證（납부필증），放在家·店鋪門前（收運前一天21:00~當天05:00）。獨棟住宅按區域隔天（週一·三·五或週二·四·六）"}, "bags": {"ko": "마트, 편의점 등 종량제봉투 판매 지정업소", "id": "Toko penjual resmi kantong berbayar (종량제봉투) seperti supermarket, minimarket", "th": "ร้านที่ได้รับอนุญาตขายถุงขยะแบบเสียเงิน (종량제봉투) เช่น ซูเปอร์มาร์เก็ต ร้านสะดวกซื้อ", "en": "Designated shops selling pay-as-you-throw bags, such as supermarkets and convenience stores", "ru": "Назначенные пункты продажи платных пакетов (종량제 봉투): супермаркеты, магазины у дома (편의점) и др.", "vi": "Nơi bán túi rác có trả phí (종량제봉투) được chỉ định như siêu thị, cửa hàng tiện lợi", "ja": "スーパー、コンビニなど従量制袋（종량제봉투）の指定販売店", "zh": "超市、便利店等计量收费袋指定销售店", "mn": "Супермаркет, дэлгүүр (편의점) зэрэг төлбөртэй уут (종량제 봉투) зардаг заасан газар", "tw": "超市、便利店等計量收費袋指定銷售店"}, "bulky": {"ko": "'빼기' 앱·홈페이지로 온라인 신고 또는 동 행정복지센터 방문해 납부필증 발부 후 부착", "id": "Lapor online di aplikasi/situs '빼기' (Bbegi), atau datang ke kantor kelurahan (행정복지센터), dapatkan stiker bukti bayar (납부필증), lalu tempel", "th": "แจ้งออนไลน์ที่แอป/เว็บไซต์ '빼기' (Bbegi) หรือไปที่ศูนย์บริการชุมชน (행정복지센터) รับสติกเกอร์ชำระเงิน (납부필증) แล้วติด", "en": "Report online via the 'Bbegi' (빼기) app or website, or visit the community center (동 행정복지센터) to get a payment certificate (납부필증), then attach it", "ru": "Заявка онлайн в приложении или на сайте «빼기», или получите наклейку об оплате (납부필증) в администрации дон (행정복지센터) и приклейте", "vi": "Khai báo online qua ứng dụng/trang web '빼기' (Bbegi), hoặc đến trung tâm hành chính phường (행정복지센터) nhận tem đã trả phí (납부필증) rồi dán lên", "ja": "「빼기」（ペギ）アプリ・ホームページでオンライン申告、または洞の行政福祉センター（행정복지센터）で納付済証（납부필증）を発行してもらって貼る", "zh": "通过“빼기”App·网站网上申报，或到洞行政福利中心（동 행정복지센터）领取缴费证（납부필증）后贴上", "mn": "«빼기» апп, сайтаар онлайн мэдүүлэх эсвэл хорооны захиргаа (행정복지센터)-нд очиж төлбөрийн наалт (납부필증) авч наана", "tw": "透過“빼기”App·網站網上申報，或到洞行政福利中心（동 행정복지센터）領取繳費證（납부필증）後貼上"}, "notes": {"ko": "배출시간 위반·음식물 혼합 배출 시 과태료 10만원. 뼈·조개껍데기·계란껍질은 종량제봉투", "id": "Melanggar jam buang atau mencampur sampah makanan: denda (과태료) 100.000 won. Tulang, cangkang kerang, kulit telur: kantong berbayar (종량제봉투)", "th": "ทิ้งผิดเวลาหรือปนขยะเศษอาหาร: ปรับ (과태료) 100,000 วอน กระดูก เปลือกหอย เปลือกไข่: ถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Breaking disposal times or mixing in food waste: fine (과태료) of 100,000 won. Bones, shells and eggshells go in a pay-as-you-throw bag (종량제봉투)", "ru": "За нарушение времени выноса и смешивание с пищевыми отходами — штраф 100 000 вон. Кости, ракушки, яичную скорлупу — в платный пакет (종량제 봉투)", "vi": "Bỏ rác sai giờ hoặc trộn rác thức ăn: phạt tiền (과태료) 100.000 won. Xương, vỏ sò, vỏ trứng: túi rác có trả phí (종량제봉투)", "ja": "排出時間の違反・生ごみを混ぜて出すと過料（과태료）10万ウォン。骨・貝殻・卵の殻は従量制袋（종량제봉투）", "zh": "违反排放时间·混入厨余会被罚款（과태료）10万韩元。骨头·贝壳·蛋壳装计量收费袋（종량제봉투）", "mn": "Гаргах цагийг зөрчих, хүнсний хогтой хольж гаргавал 100,000 воны торгууль. Яс, хясааны хальс, өндөгний хальсыг төлбөртэй уутанд (종량제 봉투)", "tw": "違反排放時間·混入廚餘會被罰款（과태료）10萬韓元。骨頭·貝殼·蛋殼裝計量收費袋（종량제봉투）"}, "days": {"ko": "수거: 월~토 오전(일요일 휴무) · 토요일 수거 후 ~ 일요일 오후까지 배출 금지", "id": "Ambil: Senin~Sabtu pagi (Minggu libur) · Setelah ambil hari Sabtu ~ sampai Minggu sore dilarang buang", "th": "เก็บ: วันจันทร์~เสาร์ ช่วงเช้า (หยุดวันอาทิตย์) · หลังเก็บขยะวันเสาร์ ~ จนถึงบ่ายวันอาทิตย์ ห้ามทิ้ง", "en": "Pickup: Mon–Sat morning (no pickup on Sunday) · No disposal from after Saturday's pickup until Sunday afternoon", "ru": "Вывоз: пн~сб утром (вс — нет) · После вывоза в субботу ~ до второй половины воскресенья выносить нельзя", "vi": "Thu gom: sáng Thứ 2 ~ Thứ 7 (nghỉ CN) · Cấm bỏ rác từ sau khi thu gom Thứ 7 ~ chiều CN", "ja": "回収：月〜土の午前（日曜は休み） · 土曜の回収後〜日曜の午後までは排出禁止", "zh": "收运：周一至周六上午（周日休息） · 周六收运后至周日下午禁止扔", "mn": "Ачих: Даваа~Бямба өглөө (Ням гараг амарна) · Бямба гарагт ачсаны дараа ~ Ням гарагийн үдээс хойш хүртэл гаргахыг хориглоно", "tw": "收運：週一至週六上午（週日休息） · 週六收運後至週日下午禁止扔"}}, "u eli di toko penjual kantong), taruh di depan pintu. Jika dimasukkan ke kantong berbayar, tidak diambil. Tulang, kulit keras, biji: kantong berbayar (종량제봉투)", "th": "ใส่ถังเฉพาะ ติดสติกเกอร์ชำระเงิน (납부필증, ซื้อที่ร้านขายถุง) วางหน้าประตู ถ้าใส่ถุงขยะแบบเสียเงินจะไม่เก็บ กระดูก เปลือกแข็ง เมล็ด: ถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Special collection bin with a payment sticker (납부필증, bought at bag shops), in front of your door. Not collected if put in a pay-as-you-throw bag. Bones, hard shells and seeds go in a pay-as-you-throw bag (종량제봉투)", "ru": "В спец. контейнер с наклейкой об оплате (납부필증, покупается в пункте продажи пакетов), перед дверью. В платном пакете (종량제 봉투) не заберут. Кости, твёрдую кожуру, косточки — в платный пакет", "vi": "Cho vào thùng thu gom chuyên dụng, gắn tem đã trả phí (납부필증, mua ở nơi bán túi), để trước cửa. Nếu cho vào túi rác có trả phí (종량제봉투) sẽ không được thu gom. Xương, vỏ cứng, hạt: cho vào túi rác có trả phí", "ja": "専用回収容器に入れ、納付済証（납부필증、袋の販売店で購入）を付けて玄関前に出す。従量制袋（종량제봉투）に入れると回収しない。骨・硬い殻・種は従量制袋へ", "zh": "装入专用回收桶，贴上缴费证（납부필증，在垃圾袋销售处买）放在门前。装进计量收费袋的不收。骨头·硬壳·果核装计量收费袋（종량제봉투）", "mn": "Тусгай саванд хийж төлбөрийн наалт (납부필증, уут зардаг газраас авна) нааж хаалганы өмнө. Төлбөртэй уутанд (종량제 봉투) хийвэл авахгүй. Яс, хатуу хальс, үрийг төлбөртэй уутанд", "tw": "裝入專用回收桶，貼上繳費證（납부필증，在垃圾袋銷售處買）放在門前。裝進計量收費袋的不收。骨頭·硬殼·果核裝計量收費袋（종량제봉투）"}, "bulky": {"ko": "대행업체 ㈜녹색환경(062-572-1336~7) 전화 또는 '여기로' 앱·홈페이지(yeogiro24.co.kr) 신고 후 배출, 월~금 수거", "id": "Telepon perusahaan pengumpul Noksaek Environment (㈜녹색환경, 062-572-1336~7) atau lapor di aplikasi/situs '여기로' (Yeogiro, yeogiro24.co.kr), lalu keluarkan. Diambil Senin~Jumat", "th": "โทรหาบริษัทเก็บขยะ Noksaek Environment (㈜녹색환경, 062-572-1336~7) หรือแจ้งที่แอป/เว็บไซต์ '여기로' (Yeogiro, yeogiro24.co.kr) แล้วนำออกไปวาง เก็บวันจันทร์~ศุกร์", "en": "Call the contractor Noksaek Hwangyeong (㈜녹색환경, 062-572-1336~7) or report on the 'Yeogiro' (여기로) app or website (yeogiro24.co.kr), then put it out. Pickup Mon–Fri", "ru": "Звонок в компанию ㈜녹색환경 (062-572-1336~7) или заявка в приложении или на сайте «여기로» (yeogiro24.co.kr), затем вынос, вывоз пн~пт", "vi": "Gọi công ty thu gom ㈜녹색환경 (062-572-1336~7) hoặc khai báo qua ứng dụng/trang web '여기로' (Yeogiro, yeogiro24.co.kr) rồi để ra. Thu gom Thứ 2 ~ Thứ 6", "ja": "代行業者ノクセク環境（㈜녹색환경）（062-572-1336〜7）に電話、または「여기로」（ヨギロ）アプリ・ホームページ（yeogiro24.co.kr）で申告してから出す。月〜金に回収", "zh": "打电话给代理公司（株）绿色环境（㈜녹색환경，062-572-1336~7），或通过“여기로”App·网站（yeogiro24.co.kr）申报后排放，周一至周五收", "mn": "Хог ачих компани ㈜녹색환경 (062-572-1336~7)-д утсаар эсвэл «여기로» апп, сайтаар (yeogiro24.co.kr) мэдүүлээд гаргана, Даваа~Баасан ачна", "tw": "打電話給代理公司（株）綠色環境（㈜녹색환경，062-572-1336~7），或透過“여기로”App·網站（yeogiro24.co.kr）申報後排放，週一至週五收"}, "notes": {"ko": "재활용품은 투명봉투(백색·청색)에 품목별로 담아 문전 배출. 폐건전지·폐형광등·소형가전은 동 행정복지센터·아파트 전용수거함", "id": "Daur ulang dimasukkan per jenis ke kantong bening (putih, biru), taruh di depan pintu. Baterai bekas, lampu neon, elektronik kecil: kotak khusus di kantor kelurahan (행정복지센터) atau apartemen", "th": "ขยะรีไซเคิลแยกตามประเภทใส่ถุงใส (สีขาว สีฟ้า) วางหน้าประตู ถ่านเก่า หลอดฟลูออเรสเซนต์ เครื่องใช้ไฟฟ้าขนาดเล็ก: กล่องรับเฉพาะที่ศูนย์บริการชุมชน (행정복지센터) หรืออพาร์ตเมนต์", "en": "Recycling in clear bags (white or blue), sorted by item, in front of your door. Used batteries, fluorescent lamps and small appliances: collection boxes at the community center (동 행정복지센터) or apartment", "ru": "Вторсырьё — по видам в прозрачный пакет (белый или синий), перед дверью. Батарейки, лампы дневного света, мелкая техника — в спец. ящики в администрации дон (행정복지센터) или в апартах", "vi": "Rác tái chế chia theo loại, cho vào túi trong suốt (trắng, xanh dương), để trước cửa. Pin cũ, bóng đèn huỳnh quang cũ, đồ điện nhỏ: thùng thu gom ở trung tâm hành chính phường (행정복지센터) hoặc chung cư", "ja": "資源ごみは透明な袋（白・青）に品目別に入れて玄関前に出す。廃乾電池・廃蛍光灯・小型家電は洞の行政福祉センター（행정복지센터）・マンションの専用回収箱", "zh": "可回收物按品类装透明袋（白色·蓝色），放在门前。废电池·废荧光灯·小家电放洞行政福利中心（동 행정복지센터）·公寓专用回收箱", "mn": "Дахин боловсруулах хогийг тунгалаг уутанд (цагаан, цэнхэр) төрлөөр н  신청사이트(wonju.go.kr/bigclean) 신청·결제 후 납부필증 붙여 배출", "id": "Daftar dan bayar ke perusahaan pengumpul (1800-9614) atau situs sampah besar (wonju.go.kr/bigclean), tempel stiker bukti bayar (납부필증), lalu keluarkan", "th": "ยื่นขอและจ่ายเงินที่บริษัทเก็บขยะ (1800-9614) หรือเว็บไซต์ขยะชิ้นใหญ่ (wonju.go.kr/bigclean) ติดสติกเกอร์ชำระเงิน (납부필증) แล้วนำออกไปวาง", "en": "Apply and pay through the contractor (1800-9614) or the large household waste website (wonju.go.kr/bigclean), attach the payment certificate (납부필증), and put it out", "ru": "Заявка и оплата через компанию по вывозу (1800-9614) или сайт (wonju.go.kr/bigclean), приклейте наклейку об оплате (납부필증) и выносите", "vi": "Đăng ký và trả phí qua công ty thu gom (1800-9614) hoặc trang đăng ký rác cồng kềnh (wonju.go.kr/bigclean), dán tem đã trả phí (납부필증) rồi để ra", "ja": "代行業者（1800-9614）または大型生活ごみ申請サイト（wonju.go.kr/bigclean）で申請・支払い後、納付済証（납부필증）を貼って出す", "zh": "通过代理公司（1800-9614）或大型生活废弃物申请网站（wonju.go.kr/bigclean）申请·付款后贴上缴费证（납부필증）排放", "mn": "Хог ачих компани (1800-9614) эсвэл том хогны сайт (wonju.go.kr/bigclean)-аар хүсэлт гаргаж төлөөд төлбөрийн наалт (납부필증) нааж гаргана", "tw": "透過代理公司（1800-9614）或大型生活廢棄物申請網站（wonju.go.kr/bigclean）申請·付款後貼上繳費證（납부필증）排放"}, "notes": {"ko": "재활용품은 투명 비닐봉투에 요일별·품목별로 배출, 지정 품목 외 배출 금지. 깨진 병·도자기는 특수 PP마대", "id": "Daur ulang di kantong plastik bening, sesuai hari dan jenis. Barang di luar jenis yang ditentukan dilarang. Botol pecah dan keramik: karung PP khusus (특수 PP마대)", "th": "ขยะรีไซเคิลใส่ถุงพลาสติกใส ตามวันและประเภท ห้ามทิ้งของนอกประเภทที่กำหนด ขวดแตกและเซรามิก: กระสอบ PP พิเศษ (특수 PP마대)", "en": "Recycling in clear plastic bags, by day and by item; only the listed items. Broken bottles and ceramics: special PP sack (특수 PP마대)", "ru": "Вторсырьё — в прозрачный пакет, по дням и видам; другие предметы выносить нельзя. Битые бутылки и керамику — в спец. PP-мешок (마대)", "vi": "Rác tái chế cho vào túi ni lông trong suốt, để ra theo ngày và theo loại. Không bỏ đồ ngoài danh mục quy định. Chai vỡ, đồ sứ: bao tải PP đặc biệt (PP마대)", "ja": "資源ごみは透明なビニール袋に曜日別・品目別に出す。決められた品目以外は出せない。割れた瓶・陶磁器は特殊PP麻袋（PP마대）", "zh": "可回收物按日子·品类装透明塑料袋排放，规定品类以外禁止扔。碎瓶·陶瓷用特殊PP麻袋（특수 PP마대）", "mn": "Дахин боловсруулах хогийг тунгалаг уутанд өдөр, төрлөөр нь гаргана, заасан төрлөөс бусдыг гаргахыг хориглоно. Хагарсан шил, шаазанг тусгай PP шуудайнд (마대)", "tw": "可回收物按日子·品類裝透明塑膠袋排放，規定品類以外禁止扔。碎瓶·陶瓷用特殊PP麻袋（특수 PP마대）"}, "days": {"ko": "재활용(동지역 등): 월·목 종이류·종이팩·스티로폼, 화·금 페트·플라스틱·캔·고철·병·비닐 / 그 외 읍면: 수·토 전부 · 평일 낮시간, 토요일 오전 6시 ~ 일요일 일몰 시까지 배출 금지", "id": "Daur ulang (wilayah dong dll.): Senin·Kamis kertas, karton susu, styrofoam; Selasa·Jumat PET, plastik, kaleng, besi bekas, botol, plastik tipis / Eup·myeon lain: Rabu·Sabtu semua · Siang hari kerja, Sabtu 06:00 pagi ~ Minggu matahari terbenam dilarang buang", "th": "ขยะรีไซเคิล (พื้นที่ทง ฯลฯ): จันทร์·พฤหัสบดี กระดาษ กล่องนม โฟม / อังคาร·ศุกร์ PET พลาสติก กระป๋อง เศษเหล็ก ขวด ถุงพลาสติก / อึบ·มย็อนอื่น: พุธ·เสาร์ ทุกอย่าง · ตอนกลางวันวันธรรมดา และวันเสาร์ 06:00 ~ วันอาทิตย์พระอาทิตย์ตก ห้ามทิ้ง", "en": "Recycling (dong areas etc.): Mon·Thu paper, paper cartons, styrofoam; Tue·Fri PET, plastic, cans, scrap metal, bottles, plastic film / Other eup/myeon: everything on Wed·Sat · No disposal during the daytime on weekdays, or from Saturday 06:00 until sunset on Sunday", "ru": "Вторсырьё (районы дон и др.): пн, чт — бумага, картонная упаковка для напитков, пенопласт; вт, пт — ПЭТ, пластик, банки, металлолом, бутылки, плёнка / другие ып и мён: ср, сб — всё · Днём в будни, с 06:00 субботы до заката воскресенья выносить нельзя", "vi": "Rác tái chế (khu dong, v.v.): Thứ 2·Thứ 5 giấy, hộp giấy, xốp; Thứ 3·Thứ 6 PET, nhựa, lon, sắt vụn, chai lọ, ni lông / Các eup·myeon khác: Thứ 4·Thứ 7 tất cả · Cấm bỏ rác ban ngày các ngày thường và từ 06:00 Thứ 7 ~ khi mặt trời lặn CN", "ja": "資源ごみ（洞地域など）：月・木 紙類・紙パック・発泡スチロール、火・金 ペット・プラスチック・缶・鉄くず・瓶・ビニール / そのほかの邑面：水・土 すべて · 平日の昼間、土曜06:00〜日曜の日没までは排出禁止", "zh": "可回收物（洞地区等）：周一·四 纸类·纸盒·泡沫塑料，周二·五 PET·塑料·罐·废铁·瓶·塑料膜 / 其他邑面：周三·六全部 · 平日白天、周六06:00至周日日落禁止扔", "mn": "Дахин боловсруулах хог (дон бүс г.м.): Даваа·Пүрэв — цаас, цаасан хайрцаг, хөөсөнцөр, Мягмар·Баасан — ПЭТ, хуванцар, лааз, хуучин төмөр, шил, гялгар уут / бусад ыб, мён: Лхагва·Бямба — бүгд · Ажлын өдрийн өдрийн цаг, Бямба 06:00 ~ Ням нар жаргах хүртэл гаргахыг хориглоно", "tw": "可回收物（洞地區等）：週一·四 紙類·紙盒·泡沫塑膠，週二·五 PET·塑膠·罐·廢鐵·瓶·塑膠膜 / 其他邑面：週三·六全部 · 平日白天、週六06:00至週日日落禁止扔"}}, "url": "https://www.wonju.go.kr/www/contents.do?key=543", "checked": "2026-10-25"}, {"id": "gw-chuncheon", "sido": {"ko": "강원특별자치도", "id": "Gangwon State", "th": "จังหวัดปกครองตนเองพิเศษคังวอน (Gangwon)", "en": "Gangwon Special Self-Governing Province", "ru": "Канвондо", "vi": "Gangwon-do", "ja": "江原特別自治道", "zh": "江原特别自治道", "mn": "Ганвондо", "tw": "江原特別自治道"}, "name": {"ko": "춘천시", "id": "Chuncheon-si", "th": "Chuncheon-si", "en": "Chuncheon-si", "ru": "Канвондо, Чхунчхон", "vi": "Chuncheon-si", "ja": "春川市（チュンチョン）", "zh": "春川市", "mn": "Ганвондо, Чүнчон", "tw": "春川市"}, "f": {"hours": {"ko": "오후 6시 ~ 오후 11시", "id": "18:00 ~ 23:00", "th": "18:00 ~ 23:00", "en": "18:00–23:00", "ru": "18:00 ~ 23:00", "vi": "18:00~23:00", "ja": "18:00〜23:00", "zh": "18:00~23:00", "mn": "18:00 ~ 23:00", "tw": "18:00~23:00"}, "place": {"ko": "일반쓰레기: 가까운 수거장 / 음식물: 아파트 공동수거장, 단독주택·상가는 내 집·상가 앞", "id": "Sampah umum: tempat kumpul terdekat / Makanan: tempat kumpul bersama apartemen, rumah tunggal dan toko: di depan rumah atau toko Anda", "th": "ขยะทั่วไป: จุดเก็บขยะใกล้บ้าน / ขยะเศษอาหาร: จุดเก็บรวมของอพาร์ตเมนต์ บ้านเดี่ยวและร้านค้า: หน้าบ้านหรือหน้าร้านของคุณ", "en": "General waste: nearest collection point / Food waste: apartment shared collection area; houses and shops in front of your own home or shop", "ru": "Обычный мусор: ближайший пункт сбора / Пищевые отходы: апарты — общий пункт, частные дома и магазины — перед своим домом или магазином", "vi": "Rác thường: điểm thu gom gần nhà / Rác thức ăn: chung cư (아파트) bỏ ở điểm thu gom chung; nhà riêng, cửa hàng: trước nhà, cửa hàng", "ja": "一般ごみ：近くの回収場 / 生ごみ：
