Toko resmi penjual kantong sampah berbayar (종량제 봉투)", "th": "ร้านที่ได้รับอนุญาตให้ขายถุงขยะแบบเสียเงิน (종량제 봉투)", "en": "Official pay-as-you-throw bag (종량제 봉투) shops", "ru": "Назначенные пункты продажи платных пакетов (종량제 봉투)", "vi": "Cửa hàng bán túi rác có trả phí (종량제 봉투) được chỉ định", "ja": "従量制袋（종량제 봉투）指定販売所", "zh": "计量收费袋（종량제 봉투）指定销售处", "mn": "Төлбөртэй уут (종량제 봉투) зардаг албан ёсны дэлгүүр", "tw": "計量收費袋（종량제 봉투）指定銷售處"}, "bulky": {"ko": "smartclean.nyj.go.kr (대형폐기물 통합관리센터)에서 온라인 신고, 또는 읍면동 행정복지센터에서 신고필증 사서 부착. 문의 1588-4077", "id": "Lapor online di smartclean.nyj.go.kr (pusat sampah besar), atau beli bukti lapor (신고필증) di kantor eup/myeon/dong (행정복지센터) lalu tempel. Info: 1588-4077", "th": "แจ้งออนไลน์ที่ smartclean.nyj.go.kr (ศูนย์จัดการขยะชิ้นใหญ่) หรือซื้อใบแจ้ง (신고필증) ที่ศูนย์บริการชุมชน eup/myeon/dong (행정복지센터) แล้วติด สอบถาม 1588-4077", "en": "Report online at smartclean.nyj.go.kr (bulky waste center), or buy a report receipt (신고필증) at the eup/myeon/dong community center (행정복지센터) and attach it. Inquiries: 1588-4077", "ru": "Заявка онлайн на smartclean.nyj.go.kr (центр крупного мусора) или купите квитанцию о заявке (신고필증) в администрации ып/мён/дон (행정복지센터) и приклейте. Справки: 1588-4077", "vi": "Khai báo online ở smartclean.nyj.go.kr (trung tâm quản lý rác cỡ lớn), hoặc mua giấy xác nhận khai báo (신고필증) ở trung tâm hành chính eup/myeon/dong (행정복지센터) rồi dán lên. Hỏi: 1588-4077", "ja": "smartclean.nyj.go.kr（大型廃棄物統合管理センター）でオンライン申告、または邑・面・洞の行政福祉センター（행정복지센터）で申告済証（신고필증）を買って貼る。問い合わせ 1588-4077", "zh": "在 smartclean.nyj.go.kr（大型废弃物综合管理中心）网上申报，或在邑面洞行政福利中心（행정복지센터）买申报证（신고필증）贴上。咨询 1588-4077", "mn": "smartclean.nyj.go.kr (том хогны нэгдсэн төв)-д онлайнаар бүртгүүлэх, эсвэл ып/мён/дон-ы захиргааны төв (행정복지센터)-өөс бүртгэлийн баримт (신고필증) аваад наах. Лавлах 1588-4077", "tw": "在 smartclean.nyj.go.kr（大型廢棄物綜合管理中心）網上申報，或在邑面洞行政福利中心（행정복지센터）買申報證（신고필증）貼上。諮詢 1588-4077"}, "notes": {"ko": "플라스틱·캔·병은 각각 투명 비닐봉투에. 투명 페트병은 따로. 깨진 유리·사기그릇은 규격마대에", "id": "Plastik, kaleng, dan botol masing-masing di kantong plastik bening. Botol PET bening dipisah. Kaca pecah dan piring keramik di karung standar (규격마대)", "th": "พลาสติก กระป๋อง ขวด แยกใส่ถุงพลาสติกใสคนละใบ ขวด PET ใสแยกต่างหาก แก้วแตกและจานชามเครื่องเคลือบใส่กระสอบมาตรฐาน (규격마대)", "en": "Plastic, cans and bottles each in a clear plastic bag. Clear PET bottles separately. Broken glass and ceramic dishes in a standard sack (규격마대)", "ru": "Пластик, банки, бутылки — каждое в отдельный прозрачный пакет. Прозрачные ПЭТ-бутылки — отдельно. Битое стекло и фарфоровую посуду — в стандартный мешок (규격마대)", "vi": "Nhựa, lon, chai: mỗi loại một túi ni lông trong suốt. Chai PET trong suốt để riêng. Thủy tinh vỡ, bát đĩa sứ cho vào bao tiêu chuẩn (규격마대)", "ja": "プラスチック・缶・びんはそれぞれ透明なビニール袋へ。透明ペットボトルは別に。割れたガラス・陶磁器の食器は規格袋（규격마대）へ", "zh": "塑料、罐、瓶分别装入透明塑料袋。透明PET瓶单独排放。碎玻璃、瓷碗装入规格麻袋（규격마대）", "mn": "Хуванцар, лааз, шилэн савыг тус тусад нь тунгалаг уутанд. Тунгалаг PET савыг тусад нь. Хагарсан шил, шаазан аяга тавгийг стандарт шуудай (규격마대)-нд", "tw": "塑膠、罐、瓶分別裝入透明塑膠袋。透明PET瓶單獨排放。碎玻璃、瓷碗裝入規格麻袋（규격마대）"}, "days": {"ko": "지역마다 수거 요일이 다름. 봉투에 적힌 지역 수거업체에 문의. 일요일은 수거 안 함 · 토요일 저녁 (일요일 수거 없음)", "id": "Hari angkut beda tiap area. Tanyakan ke perusahaan pengangkut area yang tertulis di kantong. Hari Minggu tidak ada pengangkutan · Sabtu malam (Minggu tidak ada pengangkutan)", "th": "วันเก็บแต่ละพื้นที่ไม่เหมือนกัน ถามบริษัทเก็บขยะของพื้นที่ที่เขียนไว้บนถุง วันอาทิตย์ไม่มีการเก็บ · คืนวันเสาร์ (วันอาทิตย์ไม่มีการเก็บ)", "en": "Pickup days differ by area. Ask the local pickup company written on the bag. No pickup on Sunday · Saturday evening (no pickup on Sunday)", "ru": "Дни вывоза зависят от района. Спросите у компании по вывозу, указанной на пакете. В воскресенье не вывозят · Вечер субботы (в воскресенье не вывозят)", "vi": "Ngày thu gom khác nhau theo khu vực. Hỏi công ty thu gom khu vực ghi trên túi rác. Chủ nhật không thu gom · Tối Thứ 7 (Chủ nhật không thu gom)", "ja": "地域ごとに収集曜日が違う。袋に書いてある地域の収集業者に問い合わせ。日曜は収集なし · 土曜日の夜（日曜は収集なし）", "zh": "各地区收运日不同。请询问垃圾袋上写的地区收运公司。周日不收 · 周六晚上（周日不收）", "mn": "Хог авах өдөр бүсээс хамаарна. Уутан дээр бичсэн бүсийн хог авах компаниас асуу. Ням гарагт авахгүй · Бямба гарагийн орой (ням гарагт авахгүй)", "tw": "各地區收運日不同。請詢問垃圾袋上寫的地區收運公司。週日不收 · 週六晚上（週日不收）"}}, "url": "https://www.nyj.go.kr/www/contents.do?key=3004", "checked": "2026-10-25"}, {"id": "gg-bucheon", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "부천시", "id": "Bucheon-si", "th": "Bucheon-si", "en": "Bucheon-si", "ru": "Кёнгидо, Пучхон", "vi": "Bucheon-si", "ja": "富川市（プチョン）", "zh": "富川市", "mn": "Гёнгидо, Бучон", "tw": "富川市"}, "f": {"hours": {"ko": "저녁 8시 ~ 다음날 아침 6시", "id": "Jam 8 malam (20:00) sampai jam 6 pagi (06:00) besoknya", "th": "2 ทุ่ม (20:00) ถึง 6 โมงเช้าวันรุ่งขึ้น (06:00)", "en": "20:00 to 06:00 the next day", "ru": "20:00~06:00 следующего дня", "vi": "Từ 8 giờ tối (20:00) đến 6 giờ sáng hôm sau (06:00)", "ja": "20:00～翌06:00", "zh": "20:00至次日06:00", "mn": "20:00-аас дараа өдрийн 06:00 хүртэл", "tw": "20:00至次日06:00"}, "place": {"ko": "단독주택: 자기 집 대문 앞 또는 수거 가능한 곳 / 아파트: 단지 지정 장소", "id": "Rumah: di depan gerbang rumah sendiri atau tempat yang bisa diangkut / Apartemen: tempat yang ditentukan kompleks", "th": "บ้านพัก: หน้าประตูบ้านตัวเอง หรือจุดที่เก็บได้ / อพาร์ตเมนต์: จุดที่หมู่บ้านกำหนด", "en": "Houses: in front of your own gate or a spot where pickup is possible / Apartments: the spot set by the complex", "ru": "Частный дом: перед своими воротами или там, откуда можно забрать / Многоквартирный дом (아파트): место, назначенное комплексом", "vi": "Nhà riêng: trước cổng nhà mình hoặc nơi có thể thu gom / Chung cư: nơi khu chung cư quy định", "ja": "一戸建て：自宅の門の前か収集できる場所 / マンション：団地の指定場所", "zh": "独栋住宅：自家大门前或可收运的地方 / 公寓：小区指定地点", "mn": "Хувийн байшин: өөрийн хаалганы өмнө эсвэл хог авч болох газар / Орон сууц (아파트): хорооллын тогтоосон газар", "tw": "獨棟住宅：自家大門前或可收運的地方 / 公寓：小區指定地點"}, "food": {"ko": "음식물 전용봉투(종량제봉투 판매소에서 구입)에 담아 수거용기에 봉투째. 물기 빼기. 일반봉투에 버리면 과태료", "id": "Masukkan ke kantong khusus sampah makanan (beli di toko kantong berbayar), lalu masukkan bersama kantongnya ke wadah pengumpul. Tiriskan air. Jika dibuang di kantong umum, kena denda", "th": "ใส่ถุงเฉพาะเศษอาหาร (ซื้อที่ร้านขายถุงขยะแบบเสียเงิน) แล้วใส่ทั้งถุงลงในถังเก็บ สะเด็ดน้ำ ถ้าทิ้งในถุงขยะทั่วไปจะถูกปรับ", "en": "Put it in a food-waste bag (sold at pay-as-you-throw bag shops) and put the whole bag in the collection bin. Drain the water. Putting it in a general bag means a fine", "ru": "Положите в специальный пакет для пищевых отходов (продаётся там же, где платные пакеты) и опустите пакет целиком в контейнер. Слейте воду. За выброс в обычный пакет — штраф", "vi": "Cho vào túi rác thức ăn riêng (mua ở cửa hàng bán túi rác có trả phí), bỏ cả túi vào thùng thu gom. Để ráo nước. Bỏ vào túi rác thường sẽ bị phạt tiền", "ja": "生ごみ専用袋（従量制袋の販売所で購入）に入れ、袋ごと収集容器へ。水気を切る。一般の袋に捨てると過料", "zh": "装入厨余专用袋（在计量收费袋销售处购买），连袋放入回收桶。沥干水分。扔进一般垃圾袋会被罚款", "mn": "Хүнсний хаягдлын тусгай уутанд (төлбөртэй уут зардаг газраас авна) хийж, уутаар нь хогийн саванд. Усыг нь сайн шавхана. Энгийн уутанд хаявал торгуультай", "tw": "裝入廚餘專用袋（在計量收費袋銷售處購買），連袋放入回收桶。瀝乾水分。扔進一般垃圾袋會被罰款"}, "bags": {"ko": "종량제봉투 판매소 (시 홈페이지 '종량제봉투 지정판매소 위치안내')", "id": "Toko kantong sampah berbayar (종량제 봉투) (lihat 'lokasi toko resmi' di situs kota)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제 봉투) (ดู 'ตำแหน่งร้านที่ได้รับอนุญาต' ในเว็บไซต์เมือง)", "en": "Pay-as-you-throw bag (종량제 봉투) shops (see 'designated shop locations' on the city website)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (см. «расположение пунктов продажи» на сайте города)", "vi": "Cửa hàng bán túi rác có trả phí (종량제 봉투) (xem 'vị trí cửa hàng bán chỉ định' trên trang web thành phố)", "ja": "従量制袋（종량제 봉투）販売所（市ホームページ「指定販売所の位置案内」）", "zh": "计量收费袋（종량제 봉투）销售处（见市网站“指定销售处位置”）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг дэлгүүр (хотын вэбсайтын 'албан ёсны дэлгүүрийн байршил')", "tw": "計量收費袋（종량제 봉투）銷售處（見市網站“指定銷售處位置”）"}, "bulky": {"ko": "clean.bucheon.go.kr 에서 신고·결제 후 필증 붙여 배출 / 전화 032-320-3000 / 행정복지센터 방문. 지상에 내놓기", "id": "Lapor dan bayar di clean.bucheon.go.kr, tempel bukti (필증) lalu keluarkan / Telepon 032-320-3000 / Datang ke kantor kelurahan (행정복지센터). Taruh di permukaan tanah", "th": "แจ้งและชำระเงินที่ clean.bucheon.go.kr ติดใบยืนยัน (필증) แล้วนำออก / โทร 032-320-3000 / ไปที่ศูนย์บริการชุมชน (행정복지센터) วางไว้บนพื้นชั้นล่าง", "en": "Report and pay at clean.bucheon.go.kr, attach the receipt (필증) and put it out / Phone 032-320-3000 / Visit the community center (행정복지센터). Put it out at ground level", "ru": "Заявка и оплата на clean.bucheon.go.kr, приклейте квитанцию (필증) и выносите / Тел. 032-320-3000 / Обратитесь в администрацию дон (행정복지센터). Выносите на уровень земли", "vi": "Khai báo và trả phí ở clean.bucheon.go.kr, dán giấy xác nhận (필증) rồi để ra / Gọi 032-320-3000 / Đến trung tâm hành chính phường (행정복지센터). Để ở mặt đất", "ja": "clean.bucheon.go.kr で申告・支払い後、証明（필증）を貼って出す / 電話 032-320-3000 / 行政福祉センター（행정복지센터）に行く。地上に出す", "zh": "在 clean.bucheon.go.kr 申报并付款后贴上证明（필증）排放 / 电话 032-320-3000 / 去行政福利中心（행정복지센터）。放在地面上", "mn": "clean.bucheon.go.kr-д бүртгүүлж төлөөд баримт (필증) наан гаргах / Утас 032-320-3000 / Захиргааны төв (행정복지센터)-д очих. Газрын түвшинд гаргана", "tw": "在 clean.bucheon.go.kr 申報並付款後貼上證明（필증）排放 / 電話 032-320-3000 / 去行政福利中心（행정복지센터）。放在地面上"}, "notes": {"ko": "재활용품은 재활용 그물망이나 투명 비닐봉투에. 박스·신문·스티로폼은 끈으로 묶기. 그물망은 동 행정복지센터에서 무료", "id": "Sampah daur ulang di kantong jaring daur ulang atau kantong plastik bening. Kardus, koran, styrofoam diikat dengan tali. Kantong jaring gratis di kantor kelurahan dong (행정복지센터)", "th": "ขยะรีไซเคิลใส่ถุงตาข่ายรีไซเคิลหรือถุงพลาสติกใส กล่องกระดาษ หนังสือพิมพ์ โฟม มัดด้วยเชือก ถุงตาข่ายรับฟรีที่ศูนย์บริการชุมชนของตำบล (행정복지센터)", "en": "Recyclables in a recycling net bag or clear plastic bag. Tie boxes, newspapers and styrofoam with string. Net bags are free at the dong community center (행정복지센터)", "ru": "Вторсырьё — в сетку для вторсырья или прозрачный пакет. Коробки, газеты, пенопласт связывайте верёвкой. Сетку дают бесплатно в администрации дон (행정복지센터)", "vi": "Rác tái chế cho vào túi lưới tái chế hoặc túi ni lông trong suốt. Thùng giấy, báo, xốp buộc bằng dây. Túi lưới nhận miễn phí ở trung tâm hành chính phường (행정복지센터)", "ja": "資源ごみはリサイクル用ネットか透明なビニール袋へ。段ボール・新聞・発泡スチロールはひもでしばる。ネットは洞の行政福祉センター（행정복지센터）で無料", "zh": "可回收物装入回收网袋或透明塑料袋。纸箱、报纸、泡沫塑料用绳子捆好。网袋可在洞行政福利中心（행정복지센터）免费领取", "mn": "Дахин боловсруулах хогийг дахин боловсруулах тор уут эсвэл тунгалаг уутанд. Хайрцаг, сонин, хөөсөнцрийг уяагаар боох. Тор уутыг дон-ы захиргааны төв (행정복지센터)-өөс үнэгүй авна", "tw": "可回收物裝入回收網袋或透明塑膠袋。紙箱、報紙、泡沫塑膠用繩子捆好。網袋可在洞行政福利中心（행정복지센터）免費領取"}, "days": {"ko": "일반·음식물: 토요일·공휴일 전날 빼고 매일. 재활용품: 동마다 월·수·금 또는 화·목·토 (시 홈페이지 재활용품 수거요일 표 확인) · 토요일과 공휴일 전날은 내놓지 않기 (일요일·공휴일은 수거 안 함)", "id": "Sampah umum dan makanan: setiap hari kecuali Sabtu dan sehari sebelum hari libur. Sampah daur ulang: Senin·Rabu·Jumat atau Selasa·Kamis·Sabtu tergantung dong (cek tabel hari angkut daur ulang di situs kota) · Jangan keluarkan pada hari Sabtu dan sehari sebelum hari libur (Minggu dan hari libur tidak ada pengangkutan)", "th": "ขยะทั่วไปและเศษอาหาร: ทุกวัน ยกเว้นวันเสาร์และวันก่อนวันหยุดนักขัตฤกษ์ ขยะรีไซเคิล: จันทร์·พุธ·ศุกร์ หรือ อังคาร·พฤหัส·เสาร์ แล้วแต่ตำบล (dong) (ดูตารางวันเก็บขยะรีไซเคิลในเว็บไซต์เมือง) · ห้ามนำออกวันเสาร์และวันก่อนวันหยุดนักขัตฤกษ์ (วันอาทิตย์และวันหยุดนักขัตฤกษ์ไม่มีการเก็บ)", "en": "General and food waste: every day except Saturday and the day before a public holiday. Recyclables: Mon·Wed·Fri or Tue·Thu·Sat depending on your dong (check the recycling pickup day table on the city website) · Do not put it out on Saturday or the day before a public holiday (no pickup on Sunday and public holidays)", "ru": "Обычный и пищевой мусор: каждый день, кроме субботы и дня перед праздником. Вторсырьё: пн·ср·пт или вт·чт·сб — зависит от дон (см. таблицу дней вывоза вторсырья на сайте города) · В субботу и накануне праздника не выносить (в воскресенье и праздники не вывозят)", "vi": "Rác thường và rác thức ăn: mỗi ngày trừ Thứ 7 và ngày trước ngày lễ. Rác tái chế: Thứ 2·4·6 hoặc Thứ 3·5·7 tùy theo phường (dong) (xem bảng ngày thu gom rác tái chế trên trang web thành phố) · Không để rác ra vào Thứ 7 và ngày trước ngày lễ (Chủ nhật và ngày lễ không thu gom)", "ja": "一般ごみ・生ごみ：土曜日と祝日の前日以外は毎日。資源ごみ：洞ごとに月・水・金または火・木・土（市ホームページの資源ごみ収集曜日表で確認） · 土曜日と祝日の前日は出さない（日曜・祝日は収集なし）", "zh": "一般垃圾·厨余：除周六和公休日前一天外每天。可回收物：按洞分为周一·三·五或周二·四·六（请查看市网站的可回收物收运日表） · 周六和公休日前一天不要扔（周日·公休日不收）", "mn": "Энгийн хог ба хүнсний хаягдал: бямба гараг болон баярын өмнөх өдрөөс бусад өдөр бүр. Дахин боловсруулах хог: дон (동)-оос хамаарч да·лх·ба эсвэл мя·пү·бя (хотын вэбсайтын хог авах өдрийн хүснэгтийг шалгана уу) · Бямба гараг болон баярын өмнөх өдөр гаргахгүй (ням гараг, баярын өдөр авахгүй)", "tw": "一般垃圾·廚餘：除週六和公休日前一天外每天。可回收物：按洞分為週一·三·五或週二·四·六（請檢視市網站的可回收物收運日表） · 週六和公休日前一天不要扔（週日·公休日不收）"}}, "url": "https://www.bucheon.go.kr/site/homepage/menu/viewMenu?menuid=148006007006001", "checked": "2026-10-25"}, {"id": "gg-suwon", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "수원시", "id": "Suwon-si", "th": "Suwon-si", "en": "Suwon-si", "ru": "Кёнгидо, Сувон", "vi": "Suwon-si", "ja": "水原市（スウォン）", "zh": "水原市", "mn": "Гёнгидо, Сувон", "tw": "水原市"}, "f": {"hours": {"ko": "주택: 저녁 8시 이후 집 앞에. 끝나는 시간은 구마다 다름(장안구 새벽 3시, 팔달구 새벽 5시)", "id": "Rumah: taruh di depan rumah setelah jam 8 malam. Jam selesainya beda menurut gu (Jangan-gu jam 3 pagi, Paldal-gu jam 5 pagi)", "th": "บ้านพัก: วางหน้าบ้านหลัง 2 ทุ่ม (20:00) เวลาสิ้นสุดแต่ละเขตไม่เหมือนกัน (Jangan-gu ตี 3, Paldal-gu ตี 5)", "en": "Houses: in front of your home after 20:00. End time differs by district (Jangan-gu 03:00, Paldal-gu 05:00)", "ru": "Частный дом: перед домом после 20:00. Время окон uk kantong berbayar (종량제봉투). Botol PET bening dibuang terpisah", "th": "พลาสติกที่เปื้อนเศษอาหาร ฯลฯ ให้ใส่ถุงขยะแบบเสียเงิน (종량제봉투) ขวด PET ใส แยกทิ้งต่างหาก", "en": "Plastic dirty with food or other matter goes in a pay-as-you-throw bag (종량제봉투). Put clear PET bottles out separately", "ru": "Пластик с остатками еды и грязью — в платный пакет (종량제 봉투). Прозрачные ПЭТ-бутылки — отдельно", "vi": "Nhựa dính thức ăn hoặc tạp chất: cho vào túi rác có trả phí (종량제봉투). Chai PET trong suốt: phân loại để ra riêng", "ja": "生ごみなど異物が付いたプラスチックは従量制袋（종량제봉투）へ。透明ペットボトルは別に分別して出す", "zh": "沾有食物等杂物的塑料装计量收费袋（종량제봉투）。透明PET瓶单独分类排放", "mn": "Хоолны үлдэгдэл зэрэг бохир наалдсан хуванцрыг төлбөртэй уутанд (종량제 봉투). Тунгалаг ПЭТ савыг тусад нь ялгаж гаргана", "tw": "沾有食物等雜物的塑膠裝計量收費袋（종량제봉투）。透明PET瓶單獨分類排放"}, "days": {"ko": "일~목요일 · 토요일 하루 종일 배출 금지 (금 오전 6시~일 오후 6시 배출 금지), 낮 배출 금지", "id": "Minggu~Kamis · Sabtu seharian dilarang buang (Jumat 06:00~Minggu 18:00 dilarang), dilarang buang siang hari", "th": "วันอาทิตย์~วันพฤหัสบดี · วันเสาร์ห้ามทิ้งทั้งวัน (วันศุกร์ 06:00~วันอาทิตย์ 18:00 ห้ามทิ้ง) ห้ามทิ้งตอนกลางวัน", "en": "Sunday–Thursday · No disposal all day Saturday (no disposal from Friday 06:00 to Sunday 18:00). No disposal in the daytime", "ru": "С воскресенья по четверг · В субботу весь день выносить нельзя (с 06:00 пятницы до 18:00 воскресенья нельзя), днём выносить нельзя", "vi": "CN ~ Thứ 5 · Cấm bỏ rác cả ngày Thứ 7 (cấm từ 06:00 Thứ 6 ~ 18:00 CN), cấm bỏ rác ban ngày", "ja": "日〜木曜 · 土曜は終日排出禁止（金曜06:00〜日曜18:00は排出禁止）、昼間の排出禁止", "zh": "周日至周四 · 周六全天禁止扔（周五06:00至周日18:00禁止扔），白天禁止扔", "mn": "Ням~Пүрэв гараг · Бямба гарагт бүтэн өдөр гаргахыг хориглоно (Баасан 06:00~Ням 18:00 хүртэл хориглоно), өдрийн цагаар гаргахыг хориглоно", "tw": "週日至週四 · 週六全天禁止扔（週五06:00至週日18:00禁止扔），白天禁止扔"}}, "url": "https://www.yeoju.go.kr/www/contents.do?key=565", "checked": "2026-10-25"}, {"id": "gg-icheon", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "이천시", "id": "Icheon-si", "th": "Icheon-si", "en": "Icheon-si", "ru": "Кёнгидо, Ичхон", "vi": "Icheon-si", "ja": "利川市（イチョン）", "zh": "利川市", "mn": "Гёнгидо, Ичон", "tw": "利川市"}, "f": {"hours": {"ko": "수거일 전날 해 진 뒤 ~ 수거일 해 뜨기 전 (낮에 내놓으면 안 됨)", "id": "Setelah matahari terbenam sehari sebelum hari angkut ~ sebelum matahari terbit pada hari angkut (tidak boleh dikeluarkan siang hari)", "th": "หลังพระอาทิตย์ตกของวันก่อนวันเก็บ ~ ก่อนพระอาทิตย์ขึ้นของวันเก็บ (ห้ามวางตอนกลางวัน)", "en": "From sunset the day before pickup until sunrise on pickup day (not in the daytime)", "ru": "С заката накануне дня вывоза до рассвета в день вывоза (днём выносить нельзя)", "vi": "Từ sau khi trời tối ngày trước ngày thu gom ~ trước khi trời sáng ngày thu gom (không được để ra ban ngày)", "ja": "収集日の前日、日が沈んでから 〜 収集日の日の出前まで（昼間に出してはいけない）", "zh": "收运日前一天日落后 ~ 收运日日出前（白天不可放）", "mn": "Хог авах өдрийн өмнөх өдөр нар жаргасны дараа ~ хог авах өдөр нар мандахаас өмнө (өдөр гаргаж болохгүй)", "tw": "收運日前一天日落後 ~ 收運日日出前（白天不可放）"}, "place": {"ko": "수거시간표에 적힌 배출장소", "id": "Tempat buang yang tertulis di jadwal angkut", "th": "จุดทิ้งขยะที่เขียนไว้ในตารางเวลาเก็บขยะ", "en": "The disposal spot written in the pickup timetable", "ru": "Место выноса, указанное в расписании вывоза", "vi": "Nơi bỏ rác ghi trong bảng giờ thu gom", "ja": "収集時間表に書かれた排出場所", "zh": "收运时间表上写的排放处", "mn": "Хог авах хуваарьт заасан гаргах цэг", "tw": "收運時間表上寫的排放處"}, "bags": {"ko": "반드시 이천시 종량제 봉투", "id": "Wajib pakai kantong sampah berbayar (종량제 봉투) Kota Icheon", "th": "ต้องใช้ถุงขยะแบบเสียเงิน (종량제 봉투) ของเมืองอีชอน (Icheon) เท่านั้น", "en": "Only Icheon City pay-as-you-throw bags (이천시 종량제 봉투)", "ru": "Только платные пакеты (종량제 봉투) города Ичхон", "vi": "Bắt buộc dùng túi rác có trả phí (종량제 봉투) của thành phố Icheon", "ja": "必ず利川市の従量制袋（이천시 종량제 봉투）", "zh": "必须使用利川市计量收费袋（이천시 종량제 봉투）", "mn": "Заавал Ичон хотын төлбөртэй уут (종량제 봉투)", "tw": "必須使用利川市計量收費袋（이천시 종량제 봉투）"}, "bulky": {"ko": "신고 후 스티커 붙여 배출. 시 홈페이지 온라인 신청 (자원순환과 031-644-2598)", "id": "Lapor dulu, lalu tempel stiker (스티커) dan keluarkan. Daftar online di situs kota (Bagian Daur Ulang Sumber Daya (자원순환과) 031-644-2598)", "th": "แจ้งก่อน แล้วติดสติกเกอร์ (스티커) และนำออกไปวาง ยื่นออนไลน์บนเว็บไซต์ของเมือง (ฝ่ายหมุนเวียนทรัพยากร (자원순환과) 031-644-2598)", "en": "Report first, then attach the sticker and put it out. Apply online on the city website (Resource Circulation Division 자원순환과: 031-644-2598)", "ru": "Подайте заявку, приклейте наклейку (스티커) и выносите. Онлайн-заявка на сайте города (отдел 자원순환과: 031-644-2598)", "vi": "Khai báo rồi dán tem (스티커) và để ra. Đăng ký online trên trang web của thành phố (Phòng Tuần hoàn tài nguyên (자원순환과) 031-644-2598)", "ja": "申告してからシールを貼って出す。市ホームページでオンライン申請（資源循環課 자원순환과：031-644-2598）", "zh": "申报后贴上贴纸排放。在市网站网上申请（资源循环科 자원순환과：031-644-2598）", "mn": "Бүртгүүлээд наалт (스티커) нааж гаргана. Хотын сайтаар онлайн хүсэлт (자원순환과 хэлтэс: 031-644-2598)", "tw": "申報後貼上貼紙排放。在市網站網上申請（資源迴圈科 자원순환과：031-644-2598）"}, "notes": {"ko": "재활용은 투명 비닐에 담거나 끈으로 묶어서. 깨진 형광등은 종량제 봉투에", "id": "Sampah daur ulang masukkan ke kantong plastik bening atau ikat dengan tali. Lampu neon yang pecah masukkan ke kantong sampah berbayar (종량제 봉투)", "th": "ขยะรีไซเคิลใส่ถุงพลาสติกใสหรือมัดด้วยเชือก หลอดฟลูออเรสเซนต์ที่แตกแล้ว ใส่ถุงขยะแบบเสียเงิน (종량제 봉투)", "en": "Put recycling in clear plastic bags or tie it with string. Broken fluorescent lamps go in a pay-as-you-throw bag (종량제 봉투)", "ru": "Вторсырьё — в прозрачный пакет или связать верёвкой. Разбитые люминесцентные лампы — в платный пакет (종량제 봉투)", "vi": "Rác tái chế cho vào túi ni lông trong suốt hoặc buộc bằng dây. Bóng đèn huỳnh quang vỡ cho vào túi rác có trả phí (종량제 봉투)", "ja": "資源ごみは透明なビニール袋に入れるか、ひもで縛って。割れた蛍光灯は従量制袋（종량제 봉투）へ", "zh": "可回收物装入透明塑料袋或用绳子捆好。碎了的荧光灯管装入计量收费袋（종량제 봉투）", "mn": "Дахин боловсруулах хогийг тунгалаг уутанд хийх эсвэл утсаар боох. Хагарсан люминесцент чийдэнг төлбөртэй уутанд (종량제 봉투)", "tw": "可回收物裝入透明塑膠袋或用繩子捆好。碎了的熒光燈管裝入計量收費袋（종량제 봉투）"}, "days": {"ko": "마을(배출장소)마다 다름. 시 홈페이지 '쓰레기 수거노선 안내' 시간표에서 확인. 일요일 수거 없음", "id": "Beda-beda menurut desa (tempat buang). Cek jadwal '쓰레기 수거노선 안내' (rute angkut sampah) di situs kota. Hari Minggu tidak ada pengangkutan", "th": "แต่ละหมู่บ้าน (จุดทิ้งขยะ) ไม่เหมือนกัน ดูตารางเวลา '쓰레기 수거노선 안내' (เส้นทางเก็บขยะ) บนเว็บไซต์ของเมือง วันอาทิตย์ไม่มีการเก็บ", "en": "Depends on the village (disposal spot). Check the timetable 'Garbage collection routes' (쓰레기 수거노선 안내) on the city website. No pickup on Sunday", "ru": "Зависит от деревни (места выноса). Смотрите расписание «쓰레기 수거노선 안내» на сайте города. В воскресенье не вывозят", "vi": "Khác nhau theo từng làng (nơi bỏ rác). Xem bảng giờ '쓰레기 수거노선 안내' (tuyến thu gom rác) trên trang web của thành phố. Chủ nhật không thu gom", "ja": "村（排出場所）ごとに違う。市ホームページの「ごみ収集路線案内」（쓰레기 수거노선 안내）の時間表で確認。日曜は収集なし", "zh": "按村（排放处）不同。在市网站“垃圾收运路线指南”（쓰레기 수거노선 안내）时间表中确认。周日不收", "mn": "Тосгон (гаргах цэг) бүрээр өөр. Хотын сайтын «쓰레기 수거노선 안내» хуваариас шалгана уу. Ням гарагт хог авахгүй", "tw": "按村（排放處）不同。在市網站“垃圾收運路線指南”（쓰레기 수거노선 안내）時間表中確認。週日不收"}}, "url": "https://www.icheon.go.kr/depart/contents.do?mid=0507000000", "checked": "2026-10-24"}, {"id": "gg-paju", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "파주시", "id": "Paju-si", "th": "Paju-si", "en": "Paju-si", "ru": "Кёнгидо, Пхаджу", "vi": "Paju-si", "ja": "坡州市（パジュ）", "zh": "坡州市", "mn": "Гёнгидо, Пажу", "tw": "坡州市"}, "f": {"hours": {"ko": "수거일 전날 저녁 6시 ~ 새벽 4시", "id": "Sehari sebelum hari angkut, jam 6 sore (18:00) sampai jam 4 pagi (04:00)", "th": "วันก่อนวันเก็บ 6 โมงเย็น (18:00) ถึงตี 4 (04:00)", "en": "18:00 the day before pickup to 04:00", "ru": "Накануне вывоза с 18:00 до 04:00", "vi": "Ngày trước ngày thu gom, từ 6 giờ tối (18:00) đến 4 giờ sáng (04:00)", "ja": "収集日の前日18:00～04:00", "zh": "收运前一天18:00至凌晨04:00", "mn": "Хог авах өдрийн өмнөх өдөр 18:00-аас 04:00 хүртэл", "tw": "收運前一天18:00至凌晨04:00"}, "place": {"ko": "내 집 앞 대로변. 운정신도시 1·2지구는 자동집하시설 투입구에 직접", "id": "Di pinggir jalan besar depan rumah. Kota baru Unjeong distrik 1·2: masukkan langsung ke lubang fasilitas pengumpul otomatis", "th": "ริมถนนใหญ่หน้าบ้าน เมืองใหม่ Unjeong เขต 1·2: ใส่ช่องทิ้งของระบบเก็บขยะอัตโนมัติโดยตรง", "en": "On the main road in front of your home. Unjeong New Town districts 1 and 2: put it directly into the automatic collection system inlet", "ru": "У большой дороги перед домом. Новый город Унджон (Unjeong), районы 1 и 2: прямо в приёмное отверстие автоматической системы сбора", "vi": "Lề đường lớn trước nhà. Khu đô thị mới Unjeong khu 1·2: bỏ trực tiếp vào cửa hệ thống thu gom tự động", "ja": "自宅前の大通り沿い。Unjeong新都市1・2地区は自動集積施設の投入口に直接", "zh": "家门前大路边。Unjeong新城1·2区直接投入自动收集设施投入口", "mn": "Байрны урд том замын хажууд. Унжон (Unjeong) шинэ хотын 1·2-р бүс: автомат хог цуглуулах байгууламжийн хийх нүхэнд шууд", "tw": "家門前大路邊。Unjeong新城1·2區直接投入自動收集設施投入口"}, "food": {"ko": "노란색 음식물 전용봉투에. RFID 계량기가 있는 아파트는 봉투 없이 계량해 배출", "id": "Di kantong khusus sampah makanan warna kuning. Apartemen dengan mesin timbang RFID: tanpa kantong, timbang lalu buang", "th": "ใส่ถุงเศษอาหารเฉพาะสีเหลือง อพาร์ตเมนต์ที่มีเครื่องชั่ง RFID: ไม่ต้องใช้ถุง ชั่งแล้วทิ้ง", "en": "In the yellow food-waste bag. Apartments with an RFID scale: no bag, weigh it and dispose", "ru": "В жёлтый пакет для пищевых отходов. В многоквартирных домах с весами RFID — без пакета, взвесить и выбросить", "vi": "Cho vào túi rác thức ăn màu vàng. Chung cư có máy cân RFID: không cần túi, cân rồi bỏ", "ja": "黄色の生ごみ専用袋へ。RFID計量機のあるマンションは袋なしで計量して出す", "zh": "装入黄色厨余专用袋。有RFID计量器的公寓不用袋子，称重后排放", "mn": "Шар өнгийн хүнсний хаягдлын тусгай уутанд. RFID жинлүүртэй орон сууцанд уутгүйгээр жинлүүлж хаяна", "tw": "裝入黃色廚餘專用袋。有RFID計量器的公寓不用袋子，稱重後排放"}, "bags": {"ko": "슈퍼마켓, 편의점 등 종량제봉투 판매처", "id": "Toko penjual kantong sampah berbayar (종량제 봉투) seperti supermarket dan minimarket", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제 봉투) เช่น ซูเปอร์มาร์เก็ต ร้านสะดวกซื้อ", "en": "Pay-as-you-throw bag (종량제 봉투) shops such as supermarkets and convenience stores", "ru": "Пункты продажи платных пакетов (종량제 봉투): супермаркеты, круглосуточные магазины и т. п.", "vi": "Cửa hàng bán túi rác có trả phí (종량제 봉투) như siêu thị, cửa hàng tiện lợi", "ja": "スーパー、コンビニなどの従量制袋（종량제 봉투）販売所", "zh": "超市、便利店等计量收费袋（종량제 봉투）销售处", "mn": "Супермаркет, дэлгүүр зэрэг төлбөртэй уут (종량제 봉투) зардаг газар", "tw": "超市、便利店等計量收費袋（종량제 봉투）銷售處"}, "bulky": {"ko": "앱/웹 '빼기' 또는 '그린원'에서 결제 후 신청번호 붙여 배출, 또는 판매처에서 스티커 구입", "id": "Bayar di aplikasi/web '빼기' atau '그린원', tempel nomor pendaftaran lalu keluarkan, atau beli stiker (스티커) di toko", "th": "ชำระเงินในแอป/เว็บ '빼기' หรือ '그린원' ติดหมายเลขใบสมัครแล้วนำออก หรือซื้อสติกเกอร์ (스티커) ที่ร้าน", "en": "Pay on the app/web '빼기' (Ppaegi) or '그린원' (Green One), attach the application number and put it out, or buy a sticker at a shop", "ru": "Оплатите в приложении/на сайте «빼기» или «그린원», приклейте номер заявки и выносите, или купите наклейку (스티커) в магазине", "vi": "Trả phí trên ứng dụng/web '빼기' hoặc '그린원', dán số đăng ký lên rồi để ra, hoặc mua tem (스티커) ở cửa hàng", "ja": "アプリ/ウェブ「빼기」または「그린원」で支払い後、申請番号を貼って出す、または販売所でシールを買う", "zh": "在App/网站“빼기”或“그린원”付款后贴上申请号码排放，或在销售处买贴纸", "mn": "'빼기' эсвэл '그린원' апп/вэбээр төлөөд өргөдлийн дугаарыг нааж гаргах, эсвэл дэлгүүрээс наалт (스티커) авах", "tw": "在App/網站“빼기”或“그린원”付款後貼上申請號碼排放，或在銷售處買貼紙"}, "notes": {"ko": "재활용품은 품목별로 나눠 투명 비닐봉투에. 도자기·깨진 유리·타일은 불연성 폐기물 봉투에", "id": "Sampah daur ulang dipisah per jenis di kantong plastik bening. Tembikar, kaca pecah, dan ubin di kantong sampah tidak bisa dibakar", "th": "ขยะรีไซเคิลแยกตามประเภทใส่ถุงพลาสติกใส เครื่องปั้นดินเผา แก้วแตก กระเบื้อง ใส่ถุงขยะเผาไม่ได้", "en": "Sort recyclables by item into clear plastic bags. Pottery, broken glass and tiles in a non-burnable waste bag", "ru": "Вторсырьё разделите по видам в прозрачные пакеты. Глиняную посуду, битое стекло, плитку — в 出す / マンション：共用の生ごみ容器", "zh": "独栋住宅：去掉水分和杂物，在厨余专用桶上贴缴费证（납부필증，芯片）排放 / 公寓：公用厨余桶", "mn": "Хувийн байшин: ус, хольцыг нь авч, төлбөрийн баримт (납부필증, чип) наасан хүнсний хаягдлын тусгай саванд / Орон сууц (아파트): нийтийн хүнсний хаягдлын сав", "tw": "獨棟住宅：去掉水分和雜物，在廚餘專用桶上貼繳費證（납부필증，晶片）排放 / 公寓：公用廚餘桶"}, "bulky": {"ko": "스티커 구입해 붙여 배출. 배출신고·수수료는 구역별 대행업체에 문의 (시 홈페이지 업체 목록)", "id": "Beli stiker (스티커), tempel, lalu keluarkan. Untuk lapor dan biaya, tanyakan ke perusahaan area Anda (daftar perusahaan di situs kota)", "th": "ซื้อสติกเกอร์ (스티커) ติดแล้วนำออก เรื่องการแจ้งและค่าธรรมเนียม ถามบริษัทรับเหมาในพื้นที่ (รายชื่อบริษัทในเว็บไซต์เมือง)", "en": "Buy a sticker, attach it and put it out. For reporting and fees, ask your area's contractor (company list on the city website)", "ru": "Купите наклейку (스티커), приклейте и выносите. По заявке и оплате — к подрядчику вашего района (список компаний на сайте города)", "vi": "Mua tem (스티커) dán lên rồi để ra. Khai báo và phí: hỏi công ty phụ trách khu vực (danh sách công ty trên trang web thành phố)", "ja": "シールを買って貼って出す。排出申告・手数料は地域ごとの委託業者に問い合わせ（市ホームページの業者一覧）", "zh": "买贴纸贴上后排放。申报和费用请询问所在区域的代理公司（见市网站公司名单）", "mn": "Наалт (스티커) аваад нааж гаргана. Бүртгэл, төлбөрийн талаар бүсийнхээ гэрээт компаниас асуу (хотын вэбсайтад компанийн жагсаалт бий)", "tw": "買貼紙貼上後排放。申報和費用請詢問所在區域的代理公司（見市網站公司名單）"}, "notes": {"ko": "주택은 품목별로 투명 비닐에 담아 집 앞에. 아파트 비닐·스티로폼은 시 직영 수거(031-790-6251)", "id": "Rumah: per jenis di kantong plastik bening, taruh di depan rumah. Plastik vinil dan styrofoam apartemen diangkut langsung oleh kota (031-790-6251)", "th": "บ้านพัก: แยกตามประเภทใส่ถุงพลาสติกใส วางหน้าบ้าน ถุงพลาสติกและโฟมของอพาร์ตเมนต์: เมืองเก็บเอง (031-790-6251)", "en": "Houses: sort by item into clear plastic bags, in front of your home. Apartment plastic film and styrofoam: collected directly by the city (031-790-6251)", "ru": "Частный дом: по видам в прозрачные пакеты, перед домом. Плёнку и пенопласт из многоквартирных домов вывозит сам город (031-790-6251)", "vi": "Nhà riêng: cho vào túi ni lông trong suốt theo từng loại, để trước nhà. Ni lông và xốp của chung cư: thành phố trực tiếp thu gom (031-790-6251)", "ja": "一戸建ては品目ごとに透明なビニール袋に入れて自宅前へ。マンションのビニール・発泡スチロールは市の直営収集（031-790-6251）", "zh": "独栋住宅按品类装入透明塑料袋放在家门前。公寓的塑料膜·泡沫塑料由市直接收运（031-790-6251）", "mn": "Хувийн байшин: төрлөөр нь тунгалаг уутанд хийж байрны өмнө. Орон сууцны гялгар уут, хөөсөнцрийг хот өөрөө авна (031-790-6251)", "tw": "獨棟住宅按品類裝入透明塑膠袋放在家門前。公寓的塑膠膜·泡沫塑膠由市直接收運（031-790-6251）"}}, "url": "https://www.hanam.go.kr/www/contents.do?key=6421", "checked": "2026-10-25"}, {"id": "gg-hwaseong", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "화성시", "id": "Hwaseong-si", "th": "Hwaseong-si", "en": "Hwaseong-si", "ru": "Кёнгидо, Хвасон", "vi": "Hwaseong-si", "ja": "華城市（ファソン）", "zh": "华城市", "mn": "Гёнгидо, Хвасон", "tw": "華城市"}, "f": {"place": {"ko": "반드시 규격봉투에 담아 지정장소에", "id": "Wajib dimasukkan ke kantong standar (규격봉투) dan ditaruh di tempat yang ditentukan", "th": "ต้องใส่ถุงมาตรฐาน (규격봉투) และวางที่จุดที่กำหนดเท่านั้น", "en": "Always in a standard bag (규격봉투), at the designated spot", "ru": "Только в стандартном пакете (규격봉투), в назначенное место", "vi": "Bắt buộc cho vào túi tiêu chuẩn (규격봉투) và để ở nơi quy định", "ja": "必ず規格袋（규격봉투）に入れて指定場所へ", "zh": "必须装入规格袋（규격봉투），放在指定地点", "mn": "Заавал стандарт уутанд (규격봉투) хийж, тогтоосон цэгт", "tw": "必須裝入規格袋（규격봉투），放在指定地點"}, "food": {"ko": "물기를 최대한 빼서 규격봉투나 수거용기에", "id": "Tiriskan air sebanyak mungkin, masukkan ke kantong standar atau tong pengumpul", "th": "สะเด็ดน้ำออกให้มากที่สุด ใส่ถุงมาตรฐานหรือถังเก็บขยะ", "en": "Drain as much water as possible, then put it in a standard bag (규격봉투) or collection bin", "ru": "Слейте воду как можно лучше, в стандартный пакет (규격봉투) или контейнер", "vi": "Chắt nước càng khô càng tốt, cho vào túi tiêu chuẩn hoặc thùng thu gom", "ja": "水気をできるだけ切って、規格袋（규격봉투）または回収容器へ", "zh": "尽量沥干水分，装入规格袋（규격봉투）或回收桶", "mn": "Усыг аль болох шавхаад стандарт уут (규격봉투) эсвэл саванд", "tw": "儘量瀝乾水分，裝入規格袋（규격봉투）或回收桶"}, "bags": {"ko": "지정 판매소", "id": "Tempat jual resmi (지정 판매소)", "th": "จุดขายที่กำหนด (지정 판매소)", "en": "Designated sales points", "ru": "Назначенные пункты продажи", "vi": "Nơi bán được chỉ định (지정 판매소)", "ja": "指定販売所", "zh": "指定销售处", "mn": "Тогтоосон борлуулах цэг", "tw": "指定銷售處"}, "bulky": {"ko": "판매소에서 스티커 사서 붙이고 업체에 전화, 또는 '빼기'(bbegi.com) 신청", "id": "Beli stiker (스티커) di tempat jual, tempel, lalu telepon perusahaan pengangkut, atau daftar lewat '빼기' (bbegi.com)", "th": "ซื้อสติกเกอร์ (스티커) ที่จุดขาย ติดแล้วโทรหาบริษัทเก็บขยะ หรือยื่นผ่าน '빼기' (bbegi.com)", "en": "Buy a sticker at a sales point, attach it and call the company, or apply via 'Bbegi' (빼기, bbegi.com)", "ru": "Купите наклейку (스티커) в пункте продажи, приклейте и позвоните подрядчику, или подайте заявку в «빼기» (bbegi.com)", "vi": "Mua tem (스티커) ở nơi bán, dán lên rồi gọi công ty thu gom, hoặc đăng ký qua '빼기' (bbegi.com)", "ja": "販売所でシールを買って貼り、業者へ電話、または「빼기」（ペギ、bbegi.com）で申請", "zh": "在销售处买贴纸贴上后打电话给公司，或通过“빼기”（Bbegi，bbegi.com）申请", "mn": "Борлуулах цэгээс наалт (스티커) аваад нааж, компани руу утасдах эсвэл «빼기» (bbegi.com)-ээр хүсэлт гаргах", "tw": "在銷售處買貼紙貼上後打電話給公司，或透過“빼기”（Bbegi，bbegi.com）申請"}, "notes": {"ko": "분리 안 된 쓰레기는 수거 안 함. 투명페트병은 라벨 떼고 눌러서 투명 봉투에", "id": "Sampah yang tidak dipilah tidak akan diangkut. Botol PET bening (투명페트병): lepas label, tekan sampai gepeng, masukkan ke kantong bening", "th": "ขยะที่ไม่แยกประเภทจะไม่ถูกเก็บ ขวด PET ใส (투명페트병): แกะฉลาก บีบให้แบน ใส่ถุงใส", "en": "Unsorted waste is not collected. Clear PET bottles (투명페트병): remove the label, crush, put in a clear bag", "ru": "Несортированный мусор не забирают. Прозрачные ПЭТ-бутылки (투명페트병): снять этикетку, смять, в прозрачный пакет", "vi": "Rác không phân loại sẽ không được thu gom. Chai PET trong suốt (투명페트병): bóc nhãn, bóp dẹt, cho vào túi trong suốt", "ja": "分別されていないごみは収集しない。透明ペットボトル（투명페트병）はラベルをはがしてつぶし、透明な袋へ", "zh": "没有分类的垃圾不收。透明PET瓶（투명페트병）撕掉标签、压扁，装入透明袋", "mn": "Ангилаагүй хогийг авахгүй. Тунгалаг ПЭТ сав (투명페트병): шошгыг хуулж, дараад тунгалаг уутанд", "tw": "沒有分類的垃圾不收。透明PET瓶（투명페트병）撕掉標籤、壓扁，裝入透明袋"}, "days": {"ko": "지역마다 주 2~3회 (재활용은 주 1회 이상). 담당 업체는 시 생활공간 웹포털에서 확인", "id": "Tiap daerah 2~3 kali seminggu (daur ulang minimal 1 kali seminggu). Cek perusahaan pengangkutnya di portal web ruang hidup (생활공간 웹포털) kota", "th": "แต่ละพื้นที่ สัปดาห์ละ 2~3 ครั้ง (ขยะรีไซเคิลอย่างน้อยสัปดาห์ละ 1 ครั้ง) ดูบริษัทที่รับผิดชอบได้ที่เว็บพอร์ทัลพื้นที่ชีวิต (생활공간 웹포털) ของเมือง", "en": "2–3 times a week depending on the area (recycling at least once a week). Find your collection company on the city's living-space web portal (생활공간 웹포털)", "ru": "2~3 раза в неделю, зависит от района (вторсырьё — не реже 1 раза в неделю). Компанию-подрядчика смотрите на городском портале (생활공간 웹포털)", "vi": "Mỗi khu 2~3 lần/tuần (rác tái chế ít nhất 1 lần/tuần). Xem công ty phụ trách trên cổng web không gian sống (생활공간 웹포털) của thành phố", "ja": "地域ごとに週2〜3回（資源ごみは週1回以上）。担当業者は市の生活空間ウェブポータル（생활공간 웹포털）で確認", "zh": "按地区每周2–3次（可回收物每周至少1次）。负责公司在市“生活空间网站”（생활공간 웹포털）查询", "mn": "Бүс бүрт долоо хоногт 2~3 удаа (дахин боловсруулах — долоо хоногт 1-ээс доошгүй удаа). Хариуцсан компанийг хотын порталаас (생활공간 웹포털) шалгана", "tw": "按地區每週2–3次（可回收物每週至少1次）。負責公司在市“生活空間網站”（생활공간 웹포털）查詢"}}, "url": "https://www.hscity.go.kr/www/partInfo/trnsportEnvrn/trashProcessInfo.jsp", "checked": "2026-10-24"}, {"id": "busan-geumjeong", "sido": {"ko": "부산광역시", "id": "Busan", "th": "ปูซาน (Busan)", "en": "Busan", "ru": "Пусан", "vi": "Busan", "ja": "釜山広域市", "zh": "釜山广域市", "mn": "Бусан", "tw": "釜山廣域市"}, "name": {"ko": "금정구", "id": "Geumjeong-gu", "th": "Geumjeong-gu", "en": "Geumjeong-gu", "ru": "Пусан, Кымджон-гу", "vi": "Geumjeong-gu", "ja": "金井区（クムジョン）", "zh": "金井区", "mn": "Бусан, Гымжон-гу", "tw": "金井區"}, "f": {"hours": {"ko": "19:00~22:00", "id": "19:00~22:00", "th": "19:00~22:00", "en": "19:00–22:00", "ru": "19:00~22:00", ertas, plastik, styrofoam, dll.). Wilayah ambil dengan bel: hari yang ditentukan tiap desa · Jumat·Sabtu dilarang buang (wilayah ambil depan pintu)", "th": "พื้นที่เก็บหน้าประตู: อาทิตย์·อังคาร·พฤหัสบดี ถุงขยะแบบเสียเงิน + ขยะเศษอาหาร / จันทร์ ขยะรีไซเคิล (PET ใส กระป๋อง ขวด ถุงพลาสติก เศษเหล็ก เสื้อผ้า) / พุธ ขยะรีไซเคิล (กระดาษ พลาสติก โฟม ฯลฯ) พื้นที่เก็บแบบตีระฆัง: วันที่แต่ละหมู่บ้านกำหนด · ศุกร์·เสาร์ ห้ามทิ้ง (พื้นที่เก็บหน้าประตู)", "en": "Door-to-door pickup areas: Sun·Tue·Thu pay-as-you-throw bags + food waste / Mon recycling (clear PET, cans, bottles, plastic film, scrap metal, clothes) / Wed recycling (paper, plastic, styrofoam etc.). Bell-pickup areas: days set by each village · No disposal on Friday and Saturday (door-to-door pickup areas)", "ru": "Районы сбора у двери: вс, вт, чт — платный пакет + пищевые отходы / пн — вторсырьё (прозрачные ПЭТ, банки, бутылки, плёнка, металлолом, одежда) / ср — вторсырьё (бумага, пластик, пенопласт и т. п.). Районы сбора по сигналу — дни по деревням · В пт и сб выносить нельзя (районы сбора у двери)", "vi": "Khu thu gom trước cửa: CN·Thứ 3·Thứ 5 túi rác có trả phí + rác thức ăn / Thứ 2 rác tái chế (PET trong suốt, lon, chai lọ, ni lông, sắt vụn, quần áo) / Thứ 4 rác tái chế (giấy, nhựa, xốp, v.v.). Khu thu gom theo tiếng chuông: ngày do từng làng quy định · Cấm bỏ rác Thứ 6, Thứ 7 (khu thu gom trước cửa)", "ja": "戸別回収地域：日・火・木 従量制袋＋生ごみ / 月 資源ごみ（透明ペット・缶・瓶・ビニール・鉄くず・衣類）/ 水 資源ごみ（紙・プラスチック・発泡スチロールなど）。打鐘回収地域は村ごとに決められた曜日 · 金・土は排出禁止（戸別回収地域）", "zh": "门前收运地区：周日·二·四 计量收费袋+厨余 / 周一 可回收物（透明PET·罐·瓶·塑料膜·废铁·衣物）/ 周三 可回收物（纸·塑料·泡沫塑料等）。敲钟收运地区按各村指定日子 · 周五、周六禁止扔（门前收运地区）", "mn": "Хаалганы өмнөөс авах бүс: Ням·Мягмар·Пүрэв төлбөртэй уут + хүнсний хог / Даваа дахин боловсруулах (тунгалаг ПЭТ, лааз, шил, гялгар уут, хуучин төмөр, хувцас) / Лхагва дахин боловсруулах (цаас, хуванцар, хөөсөнцөр г.м.). Дохиогоор цуглуулах бүс — тосгон бүрийн заасан өдөр · Баасан·Бямбад гаргахыг хориглоно (хаалганы өмнөөс авах бүс)", "tw": "門前收運地區：週日·二·四 計量收費袋+廚餘 / 週 ก เปลือกหอย เปลือกแข็ง: ถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Special bin with a payment sticker (납부필증) (Sun·Tue·Thu). Bones, shells and hard peels go in a pay-as-you-throw bag (종량제봉투)", "ru": "Спец. контейнер с наклейкой об оплате (납부필증) (вс, вт, чт). Кости, ракушки, твёрдую кожуру — в платный пакет (종량제 봉투)", "vi": "Gắn tem đã trả phí (납부필증) lên thùng chuyên dụng (CN·Thứ 3·Thứ 5). Xương, vỏ sò, vỏ cứng: cho vào túi rác có trả phí (종량제봉투)", "ja": "専用容器に納付済証（납부필증）を付ける（日・火・木）。骨・貝殻・硬い皮は従量制袋（종량제봉투）へ", "zh": "在专用桶上贴缴费证（납부필증）（周日·二·四）。骨头·贝壳·硬壳装计量收费袋（종량제봉투）", "mn": "Тусгай саванд төлбөрийн наалт (납부필증) наана (Ням·Мягмар·Пүрэв). Яс, хясааны хальс, хатуу хальсыг төлбөртэй уутанд (종량제 봉투)", "tw": "在專用桶上貼繳費證（납부필증）（週日·二·四）。骨頭·貝殼·硬殼裝計量收費袋（종량제봉투）"}, "bulky": {"ko": "남구 자원순환 종합포털(bsnamgu.go.kr) 인터넷 신청, 또는 경인산업 051-631-7868~9 / 고려산업 051-628-4373~4 전화. 대문 앞 도로에 내놓기", "id": "Daftar online di portal daur ulang Nam-gu (bsnamgu.go.kr), atau telepon Gyeongin Sanup 051-631-7868~9 / Goryeo Sanup 051-628-4373~4. Taruh di jalan depan pintu gerbang", "th": "ยื่นขอออนไลน์ที่พอร์ทัลรีไซเคิลของนัม-กู (bsnamgu.go.kr) หรือโทร Gyeongin Sanup 051-631-7868~9 / Goryeo Sanup 051-628-4373~4 วางบนถนนหน้าประตูรั้ว", "en": "Apply online at the Nam-gu resource circulation portal (bsnamgu.go.kr), or call Gyeongin Sanup (경인산업) 051-631-7868~9 / Goryeo Sanup (고려산업) 051-628-4373~4. Put it on the road in front of your gate", "ru": "Заявка через интернет на портале Нам-гу (bsnamgu.go.kr) или звонок: 경인산업 051-631-7868~9 / 고려산업 051-628-4373~4. Выставить на дорогу перед воротами", "vi": "Đăng ký online trên cổng thông tin tuần hoàn tài nguyên quận Nam (bsnamgu.go.kr), hoặc gọi 경인산업 051-631-7868~9 / 고려산업 051-628-4373~4. Để ra đường trước cổng", "ja": "南区資源循環総合ポータル（bsnamgu.go.kr）でネット申請、またはキョンイン産業（경인산업）051-631-7868〜9 / コリョ産業（고려산업）051-628-4373〜4 に電話。門の前の道路に出す", "zh": "在南区资源循环综合门户（bsnamgu.go.kr）网上申请，或打电话给京仁产业（경인산업）051-631-7868~9 / 高丽产业（고려산업）051-628-4373~4。放在大门前的路边", "mn": "Нам-гугийн нөөц ашиглалтын портал (bsnamgu.go.kr)-аар интернетээр, эсвэл 경인산업 051-631-7868~9 / 고려산업 051-628-4373~4 утсаар. Хаалганы өмнөх замд гаргана", "tw": "在南區資源迴圈綜合門戶（bsnamgu.go.kr）網上申請，或打電話給京仁產業（경인산업）051-631-7868~9 / 高麗產業（고려산업）051-628-4373~4。放在大門前的路邊"}, "notes": {"ko": "재활용품은 품목별로 끈으로 묶거나 흰색(투명) 봉투에. 불에 안 타는 쓰레기는 전용마대 사용", "id": "Daur ulang diikat tali per jenis atau dimasukkan ke kantong putih (bening). Sampah tidak bisa dibakar: karung khusus (마대)", "th": "ขยะรีไซเคิลมัดด้วยเชือกตามประเภท หรือใส่ถุงสีขาว (ใส) ขยะที่เผาไม่ได้ใช้กระสอบเฉพาะ (마대)", "en": "Tie recycling by item with string or put it in a white (clear) bag. Non-burnable waste: special sack (전용마대)", "ru": "Вторсырьё — по видам, связать верёвкой или в белый (прозрачный) пакет. Негорючий мусор — в спец. мешок (마대)", "vi": "Rác tái chế buộc bằng dây theo từng loại hoặc cho vào túi màu trắng (trong suốt). Rác không cháy: dùng bao tải (마대) chuyên dụng", "ja": "資源ごみは品目別にひもで束ねるか、白色（透明）の袋に。燃えないごみは専用の麻袋（마대）を使う", "zh": "可回收物按品类用绳子捆好或装白色（透明）袋。不可燃垃圾用专用麻袋（전용마대）", "mn": "Дахин боловсруулах хогийг төрлөөр нь утсаар боох эсвэл цагаан (тунгалаг) уутанд. Шатдаггүй хогт тусгай шуудай (마대) хэрэглэнэ", "tw": "可回收物按品類用繩子捆好或裝白色（透明）袋。不可燃垃圾用專用麻袋（전용마대）"}, "days": {"ko": "일·화·목: 일반+음식물 / 월: 재활용(종이·종이팩·비닐·플라스틱·투명페트 등) / 수: 재활용(캔·고철·유리병·의류·스티로폼)+불연성·소형폐가전·연탄재 · 금·토 배출금지", "id": "Minggu·Selasa·Kamis: sampah umum + makanan / Senin: daur ulang (kertas, karton susu, plastik tipis, plastik, PET bening, dll.) / Rabu: daur ulang (kaleng, besi bekas, botol kaca, pakaian, styrofoam) + tidak bisa dibakar, elektronik kecil, abu briket · Jumat·Sabtu dilarang buang", "th": "อาทิตย์·อังคาร·พฤหัสบดี: ขยะทั่วไป + ขยะเศษอาหาร / จันทร์: ขยะรีไซเคิล (กระดาษ กล่องนม ถุงพลาสติก พลาสติก PET ใส ฯลฯ) / พุธ: ขยะรีไซเคิล (กระป๋อง เศษเหล็ก ขวดแก้ว เสื้อผ้า โฟม) + ขยะเผาไม่ได้ เครื่องใช้ไฟฟ้าขนาดเล็ก ขี้เถ้าถ่านอัดแท่ง · ศุกร์·เสาร์ ห้ามทิ้ง", "en": "Sun·Tue·Thu: general + food waste / Mon: recycling (paper, paper cartons, plastic film, plastic, clear PET etc.) / Wed: recycling (cans, scrap metal, glass bottles, clothes, styrofoam) + non-burnable waste, small appliances, briquette ash · No disposal on Friday and Saturday", "ru": "вс, вт, чт: обычный мусор + пищевые отходы / пн: вторсырьё (бумага, картонная упаковка для напитков, плёнка, пластик, прозрачные ПЭТ и т. п.) / ср: вторсырьё (банки, металлолом, стеклянные бутылки, одежда, пенопласт) + негорючий мусор, мелкая техника, угольный пепел · В пт и сб выносить нельзя", "vi": "CN·Thứ 3·Thứ 5: rác thường + rác thức ăn / Thứ 2: rác tái chế (giấy, hộp giấy, ni lông, nhựa, PET trong suốt, v.v.) / Thứ 4: rác tái chế (lon, sắt vụn, chai thủy tinh, quần áo, xốp) + rác không cháy, đồ điện nhỏ cũ, tro than tổ ong · Cấm bỏ rác Thứ 6, Thứ 7", "ja": "日・火・木：一般ごみ＋生ごみ / 月：資源ごみ（紙・紙パック・ビニール・プラスチック・透明ペットなど）/ 水：資源ごみ（缶・鉄くず・ガラス瓶・衣類・発泡スチロール）＋燃えないごみ・小型廃家電・練炭の灰 · 金・土は排出禁止", "zh": "周日·二·四：一般+厨余 / 周一：可回收物（纸·纸盒·塑料膜·塑料·透明PET等）/ 周三：可回收物（罐·废铁·玻璃瓶·衣物·泡沫塑料）+不可燃垃圾·小型废家电·煤球灰 · 周五、周六禁止扔", "mn": "Ням·Мягмар·Пүрэв: энгийн + хүнсний хог / Даваа: дахин боловсруулах (цаас, цаасан хайрцаг, гялгар уут, хуванцар, тунгалаг ПЭТ г.м.) / Лхагва: дахин боловсруулах (лааз, хуучин төмөр, шилэн сав, хувцас, хөөсөнцөр) + шатдаггүй хог, жижиг цахилгаан хэрэгсэл, нүүрсний үнс · Баасан·Бямбад гаргахыг хориглоно", "tw": "週日·二·四：一般+廚餘 / 週一：可回收物（紙·紙盒·塑膠膜·塑膠·透明PET等）/ 週三：可回收物（罐·廢鐵·玻璃瓶·衣物·泡沫塑膠）+不可燃垃圾·小型廢家電·煤球灰 · 週五、週六禁止扔"}}, "url": "https://www.bsnamgu.go.kr/index.namgu?menuCd=DOM_000003501001001000", "checked": "2026-10-25"}, {"id": "busan-dongnae", "sido": {"ko": "부산광역시", "id": "Busan", "th": "ปูซาน (Busan)", "en": "Busan", "ru": "Пусан", "vi": "Busan", "ja": "釜山広域市", "zh": "釜山广域市", "mn": "Бусан", "tw": "釜山廣域市"}, "name": {"ko": "동래구", "id": "Dongnae-gu", "th": "Dongnae-gu", "en": "Dongnae-gu", "ru": "Пусан, Тоннэ-гу", "vi": "Dongnae-gu", "ja": "東莱区（トンネ）", "zh": "东莱区", "mn": "Бусан, Доннэ-гу", "tw": "東萊區"}, "f": {"hours": {"ko": "19:00~22:00", "id": "19:00~22:00", "th": "19:00~22:00", "en": "19:00–22:00", "ru": "19:00~22:00", "vi": "19:00~22:00", "ja": "19:00〜22:00", "zh": "19:00–22:00", "mn": "19:00~22:00", "tw": "19:00–22:00"}, "place": {"ko": "단독주택은 대문 앞, 업소는 문 앞, 20세대 미만 공동주택은 1층 출입구 앞", "id": "Rumah tunggal: depan pintu gerbang, usaha: depan pintu, rumah susun di bawah 20 rumah tangga: depan pintu masuk lantai 1", "th": "บ้านเดี่ยว: หน้าประตูรั้ว ร้านค้า: หน้าประตู อาคารชุดต่ำกว่า 20 ครัวเรือน: หน้าทางเข้าชั้น 1", "en": "Houses: in front of the gate. Businesses: in front of the door. Apartments with fewer than 20 households: in front of the 1st-floor entrance", "ru": "Частные дома — перед воротами, заведения — перед дверью, многоквартирные дома менее 20 квартир — перед входом на 1 этаже", "vi": "Nhà riêng: trước cổng; cơ sở kinh doanh: trước cửa; chung cư (공동주택) dưới 20 hộ: trước lối vào tầng 1", "ja": "一戸建ては門の前、店舗は入口の前、20世帯未満の共同住宅は1階出入口の前", "zh": "独栋住宅放大门前，店铺放门前，未满20户的公寓放1楼出入口前", "mn": "Хувийн байшин — хаалганы өмнө, байгууллага — үүдэнд, 20-оос цөөн айлтай орон сууц — 1 давхрын орцны өмнө", "tw": "獨棟住宅放大門前，店鋪放門前，未滿20戶的公寓放1樓出入口前"}, "food": {"ko": "물기와 이물질(조개껍데기·뼈·과일씨 등) 빼고 전용수거용기에 납부필증 부착. 비닐봉지째 넣으면 미수거", "id": "Buang air dan benda asing (cangkang kerang, tulang, biji buah, dll.), tempel stiker bukti bayar (납부필증) di wadah khusus. Jika dimasukkan dengan kantong plastiknya, tidak diambil", "th": "เอาน้ำและสิ่งแปลกปลอม (เปลือกหอย กระดูก เมล็ดผลไม้ ฯลฯ) ออก ติดสติกเกอร์ชำระเงิน (납부필증) บนถังเฉพาะ ถ้าใส่ทั้งถุงพลาสติกจะไม่เก็บ", "en": "Remove water and foreign objects (shells, bones, fruit seeds etc.); special collection bin with a payment sticker (납부필증). Not collected if you put it in with the plastic bag", "ru": "Уберите воду и посторонние предметы (ракушки, кости, косточки фруктов и т. п.), в спец. контейнер с наклейкой об оплате (납부필증). В полиэтиленовом пакете не заберут", "vi": "Bỏ nước và tạp chất (vỏ sò, xương, hạt trái cây, v.v.), gắn tem đã trả phí (납부필증) lên thùng thu gom chuyên dụng. Nếu bỏ cả túi ni lông vào sẽ không được thu gom", "ja": "水気と異物（貝殻・骨・果物の種など）を取り除き、専用回収容器に納付済証（납부필증）を付ける。ビニール袋ごと入れると回収されない", "zh": "去掉水分和杂物（贝壳· ын хог гаргана. Стандарт уут хэрэглээгүй эсвэл хольж гаргавал «авахаас татгалзсан» наалт нааж авахгүй", "tw": "週四可扔少量建築垃圾。不用規格袋或混扔時會貼上拒收貼紙（수거거부 스티커）不收走"}, "days": {"ko": "일·목: 종량제+음식물 / 화: 종량제(가연·불연)+의류·폐비닐+소형폐가전+음식물 / 월: 플라스틱·유색페트·종이팩 / 수: 투명페트·캔·고철·스티로폼·유리병·종이·연탄재 · 금·토 배출금지", "id": "Minggu·Kamis: kantong berbayar + makanan / Selasa: kantong berbayar (bisa dan tidak bisa dibakar) + pakaian, plastik tipis + elektronik kecil + makanan / Senin: plastik, PET berwarna, karton susu / Rabu: PET bening, kaleng, besi bekas, styrofoam, botol kaca, kertas, abu briket · Jumat·Sabtu dilarang buang", "th": "อาทิตย์·พฤหัสบดี: ถุงขยะแบบเสียเงิน + ขยะเศษอาหาร / อังคาร: ถุงขยะแบบเสียเงิน (เผาได้·เผาไม่ได้) + เสื้อผ้า ถุงพลาสติก + เครื่องใช้ไฟฟ้าขนาดเล็ก + ขยะเศษอาหาร / จันทร์: พลาสติก PET สี กล่องนม / พุธ: PET ใส กระป๋อง เศษเหล็ก โฟม ขวดแก้ว กระดาษ ขี้เถ้าถ่านอัดแท่ง · ศุกร์·เสาร์ ห้ามทิ้ง", "en": "Sun·Thu: pay-as-you-throw bags + food waste / Tue: pay-as-you-throw bags (burnable and non-burnable) + clothes, plastic film + small appliances + food waste / Mon: plastic, colored PET, paper cartons / Wed: clear PET, cans, scrap metal, styrofoam, glass bottles, paper, briquette ash · No disposal on Friday and Saturday", "ru": "вс, чт: платный пакет + пищевые отходы / вт: платный пакет (горючий и негорючий) + одежда, плёнка + мелкая техника + пищевые отходы / пн: пластик, цветные ПЭТ, картонная упаковка для напитков / ср: прозрачные ПЭТ, банки, металлолом, пенопласт, стеклянные бутылки, бумага, угольный пепел · В пт и сб выносить нельзя", "vi": "CN·Thứ 5: túi rác có trả phí + rác thức ăn / Thứ 3: túi rác có trả phí (cháy được, không cháy) + quần áo, ni lông thải + đồ điện nhỏ cũ + rác thức ăn / Thứ 2: nhựa, PET có màu, hộp giấy / Thứ 4: PET trong suốt, lon, sắt vụn, xốp, chai thủy tinh, giấy, tro than tổ ong · Cấm bỏ rác Thứ 6, Thứ 7", "ja": "日・木：従量制袋＋生ごみ / 火：従量制袋（燃える・燃えない）＋衣類・廃ビニール＋小型廃家電＋生ごみ / 月：プラスチック・色付きペット・紙パック / 水：透明ペット・缶・鉄くず・発泡スチロール・ガラス瓶・紙・練炭の灰 · 金・土は排出禁止", "zh": "周日·四：计量收费袋+厨余 / 周 사하환경，051-266-1170~1），或通过KakaoTalk频道“맑은사하환경”申请。冰箱·电视·洗衣机等免费回收1599-0903", "mn": "Хог ачих компани «맑은사하환경»-д утас, мессеж (051-266-1170~1) эсвэл KakaoTalk суваг «맑은사하환경». Хөргөгч, ТВ, угаалгын машин зэргийг үнэгүй авна 1599-0903", "tw": "打電話或發簡訊給代理公司“清澈沙下環境”（맑은사하환경，051-266-1170~1），或透過KakaoTalk頻道“맑은사하환경”申請。冰箱·電視·洗衣機等免費回收1599-0903"}, "notes": {"ko": "재활용품을 종량제봉투에 넣거나 일반쓰레기와 섞으면 과태료. 품목별로 나눠 지정 요일에만 배출", "id": "Daur ulang dimasukkan ke kantong berbayar (종량제봉투) atau dicampur sampah umum = denda (과태료). Pisah per jenis, buang hanya pada hari yang ditentukan", "th": "ใส่ขยะรีไซเคิลในถุงขยะแบบเสียเงิน (종량제봉투) หรือปนกับขยะทั่วไป จะถูกปรับ (과태료) แยกตามประเภท ทิ้งเฉพาะวันที่กำหนด", "en": "Putting recycling in a pay-as-you-throw bag or mixing it with general waste: fine (과태료). Sort by item and put out only on the set days", "ru": "Если положить вторсырьё в платный пакет (종량제 봉투) или смешать с обычным мусором — штраф. Сортируйте по видам и выносите только в назначенные дни", "vi": "Cho rác tái chế vào túi rác có trả phí (종량제봉투) hoặc trộn với rác thường sẽ bị phạt tiền (과태료). Chia theo loại, chỉ bỏ vào ngày quy định", "ja": "資源ごみを従量制袋（종량제봉투）に入れたり、一般ごみと混ぜたりすると過料（과태료）。品目別に分けて決められた曜日だけに出す", "zh": "把可回收物装进计量收费袋或与一般垃圾混扔会被罚款（과태료）。按品类分开，只在指定日子扔", "mn": "Дахин боловсруулах хогийг төлбөртэй уутанд (종량제 봉투) хийх эсвэл энгийн хогтой холивол торгууль. Төрлөөр нь ялгаж зөвхөн заасан өдөр гаргана", "tw": "把可回收物裝進計量收費袋或與一般垃圾混扔會被罰款（과태료）。按品類分開，只在指定日子扔"}, "days": {"ko": "일·화·목: 일반(가연성)+음식물 / 월: 재활용(플라스틱·비닐·의류 등) / 수: 재활용(투명페트·종이·캔·병 등)+불연성·소형폐가전 · 금·토 배출금지", "id": "Minggu·Selasa·Kamis: sampah umum (bisa dibakar) + makanan / Senin: daur ulang (plastik, plastik tipis (비닐), pakaian, dll.) / Rabu: daur ulang (PET bening, kertas, kaleng, botol, dll.) + tidak bisa dibakar, elektronik kecil · Jumat·Sabtu dilarang buang", "th": "อาทิตย์·อังคาร·พฤหัสบดี: ขยะทั่วไป (เผาได้) + ขยะเศษอาหาร / จันทร์: ขยะรีไซเคิล (พลาสติก ถุงพลาสติก (비닐) เสื้อผ้า ฯลฯ) / พุธ: ขยะรีไซเคิล (PET ใส กระดาษ กระป๋อง ขวด ฯลฯ) + ขยะเผาไม่ i": "Nơi bán túi rác có trả phí như siêu thị, cửa hàng tiện lợi gần nhà", "ja": "近くのスーパー・コンビニなど従量制袋の販売店", "zh": "附近超市·便利店等计量收费袋销售处", "mn": "Ойролцоох супермаркет, дэлгүүр (편의점) зэрэг төлбөртэй уут (종량제 봉투) зардаг газар", "tw": "附近超市·便利店等計量收費袋銷售處"}, "bulky": {"ko": "'여기로' 앱 또는 www.yeogiro24.co.kr 접수·결제, 또는 배출 3~4일 전 수거업체에 전화. 배출번호 적어 대문 앞에", "id": "Daftar dan bayar di aplikasi '여기로' (Yeogiro) atau www.yeogiro24.co.kr, atau telepon perusahaan pengumpul 3~4 hari sebelum buang. Tulis nomor buang, taruh di depan pintu gerbang", "th": "ยื่นขอและจ่ายเงินที่แอป '여기로' (Yeogiro) หรือ www.yeogiro24.co.kr หรือโทรหาบริษัทเก็บขยะ 3~4 วันก่อนทิ้ง เขียนเลขทิ้งขยะ วางหน้าประตูรั้ว", "en": "Apply and pay on the 'Yeogiro' (여기로) app or www.yeogiro24.co.kr, or call the collection company 3–4 days before. Write the disposal number and put it in front of your gate", "ru": "Заявка и оплата в приложении «여기로» или на www.yeogiro24.co.kr, или звонок в компанию по вывозу за 3~4 дня до выноса. Напишите номер и выносите перед воротами", "vi": "Đăng ký và trả phí qua ứng dụng '여기로' (Yeogiro) hoặc www.yeogiro24.co.kr, hoặc gọi công ty thu gom 3~4 ngày trước khi bỏ. Viết số bỏ rác, để trước cổng", "ja": "「여기로」（ヨギロ）アプリまたは www.yeogiro24.co.kr で受付・支払い、または出す3〜4日前に回収業者に電話。排出番号を書いて門の前に", "zh": "通过“여기로”App或 www.yeogiro24.co.kr 申请·付款，或在排放3~4天前打电话给收运公司。写上排放号码放在大门前", "mn": "«여기로» апп эсвэл www.yeogiro24.co.kr-аар хүсэлт гаргаж төлөх, эсвэл гаргахаас 3~4 хоногийн өмнө хог ачих компанид утсаар. Дугаараа бичиж хаалганы өмнө", "tw": "透過“여기로”App或 www.yeogiro24.co.kr 申請·付款，或在排放3~4天前打電話給收運公司。寫上排放號碼放在大門前"}, "notes": {"ko": "단독·상가·원룸은 투명비닐이나 통합가방에 담아 집 앞 배출. 봉투 무게 50L 13kg·75L 19kg 이하", "id": "Rumah tunggal, toko, kamar sewa (원룸): masukkan ke plastik bening atau tas terpadu (통합가방), taruh di depan rumah. Berat kantong: 50 L maks. 13 kg, 75 L maks. 19 kg", "th": "บ้านเดี่ยว ร้านค้า ห้องเช่า (원룸): ใส่ถุงพลาสติกใสหรือกระเป๋ารวม (통합가방) วางหน้าบ้าน น้ำหนักถุง: 50 ลิตรไม่เกิน 13 กก. 75 ลิตรไม่เกิน 19 กก.", "en": "Houses, shops and one-room buildings (원룸): in a clear plastic bag or a combined recycling bag (통합가방), in front of your home. Bag weight: 50L up to 13kg, 75L up to 19kg", "ru": "Частные дома, магазины, студии (원룸): в прозрачный пакет или общую сумку, перед домом. Вес пакета: 50 л — до 13 кг, 75 л — до 19 кг", "vi": "Nhà riêng, cửa hàng, phòng one-room (원룸): cho vào túi ni lông trong suốt hoặc túi chung (통합가방), để trước nhà. Trọng lượng túi: 50L tối đa 13kg, 75L tối đa 19kg", "ja": "一戸建て・店舗・ワンルームは透明なビニール袋か統合バッグ（통합가방）に入れて自宅前へ。袋の重さは50L 13kg・75L 19kg以下", "zh": "独栋·商铺·单间（원룸）：装透明塑料袋或综合回收袋（통합가방）放在家门前。袋子重量50L不超过13kg、75L不超过19kg", "mn": "Хувийн байшин, дэлгүүр, нэг өрөө байр (원룸) — тунгалаг уут эсвэл нэгдсэн цүнхэнд хийж байрны үүдэнд. Уутны жин 50 л — 13 кг, 75 л — 19 кг хүртэл", "tw": "獨棟·商鋪·單間（원룸）：裝透明塑膠袋或綜合回收袋（통합가방）放在家門前。袋子重量50L不超過13kg、75L不超過19kg"}, "days": {"ko": "종량제봉투: 일요일 저녁~금요일 배출 (일요일 미수거). 음식물: 동별로 일·화·목 또는 월·수·금 저녁. 재활용은 격일 수거(동별 다름) · 토요일~일요일 저녁 8시 전 (종량제봉투)", "id": "Kantong berbayar: Minggu malam~Jumat (Minggu tidak diambil). Makanan: Minggu·Selasa·Kamis atau Senin·Rabu·Jumat malam, beda tiap kelurahan. Daur ulang diambil selang sehari (beda tiap kelurahan) · Sabtu~Minggu sebelum 20:00 (kantong berbayar)", "th": "ถุงขยะแบบเสียเงิน: เย็นวันอาทิตย์~วันศุกร์ (วันอาทิตย์ไม่เก็บ) ขยะเศษอาหาร: เย็นวันอาทิตย์·อังคาร·พฤหัสบดี หรือ จันทร์·พุธ·ศุกร์ แตกต่างตามแขวง ขยะรีไซเคิลเก็บวันเว้นวัน (ต่างกันตามแขวง) · วันเสาร์~วันอาทิตย์ก่อน 20:00 (ถุงขยะแบบเสียเงิน)", "en": "Pay-as-you-throw bags: put out Sunday evening–Friday (no pickup on Sunday). Food waste: Sun·Tue·Thu or Mon·Wed·Fri evening depending on the dong. Recycling: pickup every other day (differs by dong) · Saturday until Sunday 20:00 (pay-as-you-throw bags)", "ru": "Платные пакеты: выносить с вечера воскресенья по пятницу (в вс не вывозят). Пищевые отходы: по дон вечером вс, вт, чт или пн, ср, пт. Вторсырьё — вывоз через день (по дон) · С субботы до 20:00 воскресенья (платные пакеты)", "vi": "Túi rác có trả phí (종량제봉투): để ra t
