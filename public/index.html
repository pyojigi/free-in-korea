<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --ink:#1d2024; --muted:#5f6368; --line:#dcdbd6;
  --accent:#0f6b55; --accent-ink:#ffffff; --sticker:#f2c230;
  --c-bag:#b88a12; --c-food:#8a5a2b; --c-rec:#1f7a4d; --c-spec:#b23a3a;
  --f-display:"Do Hyeon","PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;
  --f-body:"IBM Plex Sans KR","PingFang SC","PingFang TC","Microsoft YaHei","Hiragino Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1b1d20; --ink:#e8e9eb; --muted:#a3a7ad; --line:#2e3135;
  --accent:#4cc39f; --accent-ink:#0b1814; --sticker:#e5b923;
  --c-bag:#e0b443; --c-food:#d19a63; --c-rec:#5fc792; --c-spec:#ec7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1b1d20; --ink:#e8e9eb; --muted:#a3a7ad; --line:#2e3135;
  --accent:#4cc39f; --accent-ink:#0b1814; --sticker:#e5b923;
  --c-bag:#e0b443; --c-food:#d19a63; --c-rec:#5fc792; --c-spec:#ec7b7b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.shoot{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.drop{display:flex;align-items:center;gap:14px}
.preview{width:84px;height:84px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--f-body);padding:13px 16px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--sticker);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.verdict{scroll-margin-top:150px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.v-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.v-badge{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:#fff}
.v-item{font-weight:600;font-size:17px;margin:0}
.v-head>div:not(.v-badge){flex:1 1 160px}
.v-cat{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:2px 0 0}
.v-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.v-body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.warn{background:color-mix(in srgb,var(--c-spec) 12%,transparent);border-left:3px solid var(--c-spec);padding:10px 12px;border-radius:6px;font-size:14px}
.ko-card{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.ko-card b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);display:block;font-weight:500}
.example{font-family:var(--f-mono);font-size:11px;background:var(--sticker);color:#2a2100;padding:2px 8px;border-radius:999px;margin-left:auto;flex:none}
section h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;font:14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.rules{display:grid;gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.rule .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.rule .v{min-width:0}
.note{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say.small .ko{font-size:18px}
.search{width:100%;box-sizing:border-box;font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin:4px 0 10px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2;margin:4px 0 2px}
.hero p{margin:0 0 12px;color:var(--muted);font-size:15px}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sticker);border-radius:12px;padding:14px 16px;font-size:15px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-top:12px}
.area .r{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.area .r:last-of-type{border-bottom:0}
.area .k{font-size:13px;color:var(--muted);font-weight:600}
.area .v{min-width:0;overflow-wrap:anywhere}
.area .ko{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.area a{color:var(--accent);font-weight:600}
.area .foot{font-size:12px;color:var(--muted);padding:10px 0}
@media (max-width:380px){.area .r{grid-template-columns:1fr}}
body:not([data-motif="ko"]):not([data-motif="en"]):not([data-motif="id"]){--f-mono:var(--f-body)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);padding:10px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:3px solid var(--sticker);outline-offset:2px}
.pane{display:flex;flex-direction:column;gap:18px}
.nums{display:grid;gap:10px;margin-top:8px}
.num{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.num .n{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--c-spec);font-variant-numeric:tabular-nums}
.num .name{font-weight:600}
.num .desc{grid-column:1/-1;font-size:13px;color:var(--muted)}
.num a{grid-row:1;grid-column:3;text-decoration:none;min-height:40px;padding:8px 14px;font-size:14px}
.builder{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field select,.field input{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.say{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.say .ko{font-size:22px;font-weight:600;line-height:1.35}
.say .rom{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.say .mean{font-size:14px}
a.btn{text-decoration:none}
/* 언어별 전통 배경: 아래 띠(가옥 실루엣) + 바탕 무늬, 색은 테마 토큰으로 */

.motif::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:.07;-webkit-mask:var(--pat) repeat 0 0/48px 48px;mask:var(--pat) repeat 0 0/48px 48px}
.sky{position:absolute;left:0;right:0;bottom:0;height:calc(150px + env(safe-area-inset-bottom,0px));background:var(--scene) no-repeat center top/auto 150px,linear-gradient(var(--ground),var(--ground)) left 130px/100% 100% no-repeat;opacity:.95}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sky{opacity:.6}}
:root[data-theme="dark"] .sky{opacity:.6}
.bar{z-index:10}
main.wrap{position:relative;z-index:1;padding-bottom:170px}

.results{display:flex;flex-direction:column;gap:12px;scroll-margin-top:150px}
.found{margin:0;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.textrow{display:flex;gap:8px}
.textrow input{flex:1;min-width:0;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
.textrow input:focus-visible{outline:3px solid var(--sticker);outline-offset:2px}
.textrow .btn{flex:none}
.bar{display:block;position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in,.subs-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1;min-width:0}
#lang{font:600 13px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px;min-height:34px;max-width:46vw}
.main{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.m{border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);padding:9px;border-radius:9px;cursor:pointer}
.m[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.subs{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
@media (max-width:400px){.subs-in{gap:12px}.subs .s{font-size:13px}}
.subs::-webkit-scrollbar{display:none}
.subs-in{display:flex;gap:18px}
.s{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:11px 0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.s[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:14px}
.drop-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);font:600 15px var(--f-body);padding:6px 0;cursor:pointer}
.m:focus-visible,.s:focus-visible,.back:focus-visible,#lang:focus-visible{outline:3px solid var(--sticker);outline-offset:2px}

[data-cat="bag"]{--cc:var(--c-bag)} [data-cat="food"]{--cc:var(--c-food)} [data-cat="rec"]{--cc:var(--c-rec)} [data-cat="spec"]{--cc:var(--c-spec)}
.v-badge,.dot{background:var(--cc,var(--muted))}
@media (prefers-reduced-motion:no-preference){.verdict{transition:box-shadow .3s}.verdict.flash{box-shadow:0 0 0 3px var(--sticker)}}

</head>
<body>
<div class="motif" aria-hidden="true"><div class="sky"></div></div>
<header class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <strong class="brand" data-t="appName"></strong>
      <select id="lang" aria-label="Language"></select>
    </div>
    <nav class="main" role="tablist">
      <button class="m" id="m-trash" type="button" role="tab" data-main="trash" data-t="tabTrash"></button>
      <button class="m" id="m-help" type="button" role="tab" data-main="help" data-t="tabHelp"></button>
    </nav>
  </div>
  <nav class="subs"><div class="subs-in" id="subs"></div></nav>
</header>

<main class="wrap">
  <!-- 쓰레기 > 사진 -->
  <section class="view" data-view="trash/photo">
    <div class="hero"><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
    <div class="shoot">
      <div class="drop">
        <div class="preview" id="preview"></div>
        <div class="drop-txt">
          <strong data-t="shootTitle"></strong>
          <span class="note" data-t="shootHint"></span>
        </div>
      </div>
      <input id="photo" type="file" accept="image/*" hidden>
      <div class="row">
        <button class="btn" id="pick" type="button" data-t="pickBtn"></button>
        <button class="btn ghost" id="ask" type="button" disabled data-t="askBtn"></button>
      </div>
      <div class="or"><span data-t="textLabel"></span></div>
      <div class="textrow">
        <input id="textIn" type="text" maxlength="300" autocomplete="off">
        <button class="btn" id="askText" type="button" data-t="askBtn"></button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <div class="results" id="aiVerdict" aria-live="polite" hidden></div>
  </section>

  <!-- 쓰레기 > 물건 목록 -->
  <section class="view" data-view="trash/list" hidden>
    <div id="listPick">
      <p class="note" data-t="quickHint"></p>
      <input id="itemSearch" class="search" type="search" autocomplete="off">
      <div class="chips" id="chips"></div>
      <p class="note" id="noMatch" hidden></p>
    </div>
    <div id="listDetail" hidden>
      <button class="back" id="back" type="button"><span aria-hidden="true">←</span> <span data-t="back"></span></button>
      <article class="verdict" id="itemVerdict"></article>
    </div>
  </section>

  <!-- 쓰레기 > 내 지역 -->
  <section class="view" data-view="trash/area" hidden>
    <h2 data-t="areaTitle"></h2>
    <p class="note" data-t="areaHint"></p>
    <label class="field"><select id="areaSel" aria-label="Area"></select></label>
    <div id="areaCard"></div>
  </section>

  <!-- 쓰레기 > 봉투 사기 -->
  <section class="view" data-view="trash/bag" hidden>
    <h2 data-t="bagTitle"></h2>
    <p class="note" data-t="bagHint"></p>
    <div class="builder">
      <label class="field"><span data-t="bagType"></span><select id="bagType"></select></label>
      <div class="row2">
        <label class="field" id="bagSizeF"><span data-t="bagSize"></span><select id="bagSize"></select></label>
        <label class="field"><span data-t="bagCount"></span><select id="bagCount"></select></label>
      </div>
      <div class="say" id="bagSay" lang="ko"></div>
      <div class="row">
        <button class="btn" id="bagSpeak" type="button" data-t="playBtn"></button>
      </div>
      <div class="status" id="bagVoice" aria-live="polite"></div>
      <div class="say small" id="bagCheck" lang="ko"></div>
      <p class="note" data-t="bagNote"></p>
    </div>
  </section>

  <!-- 쓰레기 > 규칙 -->
  <section class="view" data-view="trash/rules" hidden>
    <h2 data-t="rulesTitle"></h2>
    <div class="rules" id="rules"></div>
    <p class="note" data-t="disclaimer"></p>
  </section>

  <!-- 긴급 > 전화 -->
  <section class="view" data-view="help/call" hidden>
    <p class="note" data-t="helpSub"></p>
    <div class="nums" id="nums"></div>
    <p class="note" data-t="checkedNote"></p>
  </section>

  <!-- 긴급 > 한국어로 말하기 -->
  <section class="view" data-view="help/report" hidden>
    <div class="builder">
      <label class="field"><span data-t="situationLabel"></span><select id="sit"></select></label>
      <label class="field"><span data-t="placeLabel"></span><input id="place" type="text" autocomplete="off"></label>
      <div class="say" id="say" lang="ko"></div>
      <div class="row">
        <button class="btn" id="speak" type="button" data-t="playBtn"></button>
        <a class="btn ghost" id="callSit" href="tel:119"></a>
      </div>
      <div class="status" id="voiceStatus" aria-live="polite"></div>
    </div>
  </section>
</main>

ọc thực phẩm", "steps": ["Màng bọc sạch bỏ chung với đồ nilon", "Màng bọc dính đồ ăn bỏ vào túi rác trả phí theo lượng"], "warn": "Màng bọc đồ ăn giao tận nơi và hàng siêu thị là PVC nên không tái chế được."}, "tw": {"name": "保鮮膜", "steps": ["乾淨的保鮮膜放到塑膠袋類回收", "沾了食物的保鮮膜放進計量垃圾袋"], "warn": "外賣和超市包裝用的保鮮膜是PVC，不能回收。"}}}, {"cat": "rec", "src": "https://xn--oy2b29bd3a601b.kr/front/dischargeMethod/dictionaryView.do?niIdx=106", "t": {"ko": {"name": "뽁뽁이(에어캡)", "steps": ["테이프·송장을 떼요", "비닐류 수거함에 넣어요"]}, "en": {"name": "Bubble wrap", "steps": ["Remove tape and shipping labels", "Put it in the plastic film (비닐) bin"]}, "zh": {"name": "气泡膜", "steps": ["撕掉胶带和快递单", "放进塑料袋类（비닐）回收箱"]}, "id": {"name": "Plastik gelembung (bubble wrap)", "steps": ["Lepas selotip dan label pengiriman", "Masukkan ke tempat plastik tipis (vinil)"]}, "ja": {"name": "プチプチ（緩衝材）", "steps": ["テープと送り状をはがす", "ビニール類の回収箱に入れる"]}, "mn": {"name": "Агаартай хальс (бөмбөлөгт хальс)", "steps": ["Скоч, илгээмжийн хуудсыг авна", "Гялгар уут цуглуулах саванд хийнэ"]}, "ru": {"name": "Пузырчатая плёнка", "steps": ["Снимите скотч и накладную", "Положите в контейнер для плёнки и пакетов"]}, "th": {"name": "พลาสติกกันกระแทก (บับเบิล)", "steps": ["แกะเทปและใบปะหน้าพัสดุออก", "ใส่ถังรับถุงพลาสติก/ฟิล์ม"]}, "vi": {"name": "Màng xốp hơi (bóng khí)", "steps": ["Bóc băng keo và phiếu giao hàng", "Bỏ vào thùng thu gom nilon"]}, "tw": {"name": "氣泡膜", "steps": ["撕掉膠帶和快遞單", "放進塑膠袋類（비닐）回收箱"]}}}, {"cat": "rec", "src": "https://xn--oy2b29bd3a601b.kr/front/dischargeMethod/dictionaryView.do?niIdx=779", "t": {"ko": {"name": "물 아이스팩", "steps": ["팩을 잘라 물은 하수구에 버려요", "비닐 포장은 비닐류로 내놓아요"], "warn": "젤 아이스팩은 방법이 달라요."}, "en": {"name": "Water ice pack", "steps": ["Cut the pack and pour the water down the drain", "Put the plastic pouch out with plastic film"], "warn": "Gel ice packs are handled differently."}, "zh": {"name": "水冰袋", "steps": ["剪开冰袋，把水倒进下水道", "塑料袋放到塑料袋类回收"], "warn": "凝胶冰袋的扔法不一样。"}, "id": {"name": "Ice pack berisi air", "steps": ["Gunting 電話給代理公司（대행업체）"}, "notes": {"ko": "주택·빌라: 비닐·투명페트병은 투명 봉투/흰색 그물망, 다른 재활용은 녹색 그물망", "id": "Rumah, vila (빌라): plastik dan botol PET bening ke kantong bening atau jaring putih; daur ulang lain ke jaring hijau", "th": "บ้านพัก วิลล่า (빌라): ถุงพลาสติกและขวด PET ใส ใส่ถุงใสหรือตาข่ายสีขาว ขยะรีไซเคิลอื่นใส่ตาข่ายสีเขียว", "en": "Houses and villas (빌라): plastic film and clear PET bottles in a clear bag / white net bag; other recycling in a green net bag", "ru": "Частные дома и виллы (빌라): плёнка (비닐) и прозрачные ПЭТ-бутылки (투명페트병) — в прозрачный пакет или белую сетку, другое вторсырьё — в зелёную сетку", "vi": "Nhà riêng, nhà nhiều hộ (빌라): ni lông và chai PET trong suốt cho vào túi trong suốt hoặc lưới màu trắng; rác tái chế khác cho vào lưới màu xanh lá", "ja": "一戸建て・ヴィラ（빌라）：ビニール・透明ペットボトルは透明な袋／白いネット、その他の資源ごみは緑のネット", "zh": "独栋·别墅型公寓（빌라）：塑料膜·透明PET瓶装透明袋/白色网袋，其他可回收物装绿色网袋", "mn": "Хувийн байшин, вилла (빌라): гялгар уут (비닐), тунгалаг ПЭТ сав (투명페트병) — тунгалаг уут эсвэл цагаан торонд, бусад дахин боловсруулах хог — ногоон торонд", "tw": "獨棟·別墅型公寓（빌라）：塑膠膜·透明PET瓶裝透明袋/白色網袋，其他可回收物裝綠色網袋"}, "days": {"ko": "월~금 (일부 안내는 일~금). 재활용: 목요일은 비닐·투명페트병만, 나머지는 월·화·수·금·일", "id": "Senin~Jumat (sebagian info: Minggu~Jumat). Daur ulang: Kamis hanya plastik (비닐) dan botol PET bening, sisanya Senin·Selasa·Rabu·Jumat·Minggu", "th": "จันทร์~ศุกร์ (บางประกาศเขียนว่า อาทิตย์~ศุกร์) ขยะรีไซเคิล: วันพฤหัสบดีเฉพาะถุงพลาสติก (비닐) และขวด PET ใส ที่เหลือ จันทร์·อังคาร·พุธ·ศุกร์·อาทิตย์", "en": "Mon–Fri (some notices say Sun–Fri). Recycling: Thursday is only plastic film (비닐) and clear PET bottles (투명페트병); other recycling Mon·Tue·Wed·Fri·Sun", "ru": "Пн~пт (в некоторых источниках вс~пт). Вторсырьё: в четверг только плёнка (비닐) и прозрачные ПЭТ-бутылки (투명페트병), остальное — пн, вт, ср, пт, вс", "vi": "Thứ 2~Thứ 6 (một số thông báo ghi CN~Thứ 6). Rác tái chế: Thứ 5 chỉ ni lông và chai PET trong suốt, loại khác vào Thứ 2·Thứ 3·Thứ 4·Thứ 6·CN", "ja": "月〜金（一部の案内では日〜金）。資源ごみ：木曜はビニール（비닐）と透明ペットボトル（투명페트병）のみ、その他は月・火・水・金・日", "zh": "周一至周五（部分通知为周日至周五）。可回收物：周四只收塑料膜（비닐）和透明PET瓶（투명페트병），其他在周一·二·三·五·日", "mn": "Даваа~Баасан (зарим мэдээлэлд Ням~Баасан). Дахин боловсруулах: Пүрэв гарагт зөвхөн гялгар уут (비닐), тунгалаг ПЭТ сав (투명페트병), бусад нь Даваа·Мягмар·Лхагва·Баасан·Ням", "tw": "週一至週五（部分通知為週日至週五）。可回收物：週四只收塑膠膜（비닐）和透明PET瓶（투명페트병），其他在週一·二·三·五·日"}}, "url": "https://www.gangnam.go.kr/board/waste/list.do?mid=ID02_011109", "checked": "2026-10-24"}, {"id": "seoul-gangdong", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "강동구", "id": "Gangdong-gu", "th": "Gangdong-gu", "en": "Gangdong-gu", "ru": "Сеул, Кандон-гу", "vi": "Gangdong-gu", "ja": "江東区（カンドン）", "zh": "江东区", "mn": "Сөүл, Гандон-гу", "tw": "江東區"}, "f": {"hours": {"ko": "밤 8시 ~ 새벽 4시", "id": "20:00 ~ 04:00 dini hari", "th": "20:00 ~ 04:00 ของวันถัดไป", "en": "20:00–04:00 (next day)", "ru": "20:00~04:00", "vi": "20:00~04:00 sáng hôm sau", "ja": "20:00〜翌04:00", "zh": "20:00–次日04:00", "mn": "20:00~04:00", "tw": "20:00–次日04:00"}, "place": {"ko": "내 집·내 점포 앞 또는 지정된 배출 장소", "id": "Di depan rumah atau toko Anda, atau di tempat buang sampah yang ditentukan", "th": "หน้าบ้านหรือหน้าร้านของคุณ หรือจุดทิ้งขยะที่กำหนด", "en": "In front of your own home or shop, or at the designated disposal spot", "ru": "Перед своим домом или магазином, или в назначенном месте", "vi": "Trước nhà hoặc cửa hàng của bạn, hoặc nơi bỏ rác được chỉ định", "ja": "自宅・店舗の前、または決められた排出場所", "zh": "自家·店铺门前，或指定的排放处", "mn": "Өөрийн байр, дэлгүүрийн үүдэнд эсвэл заасан газарт", "tw": "自家·店鋪門前，或指定的排放處"}, "food": {"ko": "물기 빼고 이물질 골라서 음식물 종량제 봉투, 납부필증, RFID 종량기로 배출", "id": "Buang air dan benda asing, lalu buang dengan kantong sampah makanan berbayar (음식물 종량제 봉투), stiker bukti bayar (납부필증), atau mesin timbang RFID", "th": "เทน้ำออก เอาสิ่งแปลกปลอมออก แล้วทิ้งด้วยถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제 봉투) สติกเกอร์ชำระเงินแล้ว (납부필증) หรือเครื่องชั่ง RFID", "en": "Drain the water and remove foreign objects. Use a food-waste pay-as-you-throw bag (음식물 종량제 봉투), a payment sticker (납부필증), or an RFID food-waste machine", "ru": "Слейте воду, уберите посторонние предметы. Выносите в платном пакете для пищевых отходов (음식물 종량제 봉투), с наклейкой об оплате (납부필증) или через RFID-устройство", "vi": "Để ráo nước, nhặt bỏ tạp chất, rồi bỏ bằng túi rác thức ăn có trả phí (음식물 종량제 봉투), tem đã trả phí (납부필증) hoặc máy cân RFID", "ja": "水気を切り、異物を取り除いて、生ごみ用の従量制袋（음식물 종량제 봉투）、納付済証（납부필증）、またはRFID計量機で出す", "zh": "沥干水分、挑出杂物，用厨余计量收费袋（음식물 종량제 봉투）、缴费证（납부필증）或RFID厨余称重机扔", "mn": "Усыг нь шүүж, хольцыг ялгаад хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투), төлбөрийн наалт (납부필증) эсвэл RFID төхөөрөмжөөр гаргана", "tw": "瀝乾水分、挑出雜物，用廚餘計量收費袋（음식물 종량제 봉투）、繳費證（납부필증）或RFID廚餘稱重機扔"}, "bulky": {"ko": "구청 홈페이지 대형폐기물 온라인 신청(gangdong.go.kr), 수수료 결제 후 배출. 배출일 최소 2일 전 신청", "id": "Daftar sampah besar (대형폐기물) online di situs kantor gu (gangdong.go.kr), bayar biaya, lalu keluarkan. Daftar paling lambat 2 hari sebelum hari buang", "th": "ยื่นขอทิ้งขยะชิ้นใหญ่ (대형폐기물) ออนไลน์บนเว็บไซต์สำนักงานเขต (gangdong.go.kr) จ่ายค่าธรรมเนียมแล้วจึงนำออกไปวาง ต้องยื่นอย่างน้อย 2 วันก่อนวันทิ้ง", "en": "Apply online for large waste (대형폐기물) on the district office (구청) website (gangdong.go.kr), pay the fee, then put it out. Apply at least 2 days before the disposal day", "ru": "Онлайн-заявка на крупный мусор (대형폐기물) на сайте администрации района (구청) (gangdong.go.kr), оплата сбора, затем вынос. Заявка минимум за 2 дня до выноса", "vi": "Đăng ký rác cồng kềnh (대형폐기물) online trên trang web của quận (구청) (gangdong.go.kr), trả phí rồi để ra. Đăng ký ít nhất 2 ngày trước ngày bỏ", "ja": "区役所（구청）ホームページで大型ごみ（대형폐기물）をオンライン申請（gangdong.go.kr）、手数料を払ってから出す。出す日の2日前までに申請", "zh": "在区厅（구청）网站网上申请大型废弃物（대형폐기물）（gangdong.go.kr），付费后排放。最晚在排放日2天前申请", "mn": "Дүүргийн захиргааны (구청) сайтаар том хог (대형폐기물) онлайн хүсэлт (gangdong.go.kr), хураамж төлөөд гаргана. Гаргах өдрөөс дор хаяж 2 хоногийн өмнө хүсэлт гаргана", "tw": "在區廳（구청）網站網上申請大型廢棄物（대형폐기물）（gangdong.go.kr），付費後排放。最晚在排放日2天前申請"}, "notes": {"ko": "폐비닐·투명 페트병은 목요일에만 배출(그날 다른 재활용 배출 금지). 깨진 유리·도자기는 특수마대", "id": "Plastik dan botol PET bening hanya hari Kamis (hari itu jangan buang daur ulang lain). Kaca pecah dan keramik ke karung khusus (특수마대)", "th": "ถุงพลาสติกและขวด PET ใส ทิ้งเฉพาะวันพฤหัสบดี (วันนั้นห้ามทิ้งขยะรีไซเคิลอื่น) แก้วแตกและเซรามิกใส่กระสอบพิเศษ (특수마대)", "en": "Plastic film and clear PET bottles: Thursday only (no other recycling that day). Broken glass and ceramics: special sack (특수마대)", "ru": "Плёнку и прозрачные ПЭТ-бутылки — только в четверг (в этот день другое вторсырьё не выносить). Битое стекло и керамику — в спец. мешок (특수마대)", "vi": "Ni lông thải, chai PET trong suốt chỉ bỏ vào Thứ 5 (ngày đó không bỏ rác tái chế khác). Kính vỡ, đồ sứ: cho vào bao tải đặc biệt (특수마대)", "ja": "廃ビニール・透明ペットボトルは木曜のみ（その日はほかの資源ごみは出せない）。割れたガラス・陶磁器は特殊麻袋（특수마대）", "zh": "塑料膜·透明PET瓶只在周四扔（当天不能扔其他可回收物）。碎玻璃·陶瓷装特殊麻袋（특수마대）", "mn": "Гялгар уут, тунгалаг ПЭТ савыг зөвхөн Пүрэв гарагт (тэр өдөр бусад дахин боловсруулах хог гаргахгүй). Хагарсан шил, шаазанг тусгай шуудайнд (특수마대)", "tw": "塑膠膜·透明PET瓶只在週四扔（當天不能扔其他可回收物）。碎玻璃·陶瓷裝特殊麻袋（특수마대）"}, "days": {"ko": "매일 배출 (토요일·공휴일 전날 제외). 폐비닐·투명 페트병은 목요일만 · 토요일, 공휴일 전날", "id": "Setiap hari (kecuali Sabtu dan sehari sebelum hari libur). Plastik (폐비닐) dan botol PET bening hanya hari Kamis · Sabtu, sehari sebelum hari libur", "th": "ทิ้งได้ทุกวัน (ยกเว้นวันเสาร์และวันก่อนวันหยุดราชการ) ถุงพลาสติก/ฟิล์มพลาสติก (폐비닐) และขวด PET ใส ทิ้งได้เฉพาะวันพฤหัสบดี · วันเสาร์ วันก่อนวันหยุดราชการ", "en": "Every day (except Saturday and the day before a public holiday). Plastic film (비닐) and clear PET bottles (투명 페트병): Thursday only · Saturday, the day before a public holiday", "ru": "Выносить можно каждый день (кроме субботы и дня перед праздником). Плёнку и прозрачные ПЭТ-бутылки — только в четверг · Суббота, день перед праздником", "vi": "Bỏ rác mỗi ngày (trừ Thứ 7 và ngày trước ngày lễ). Ni lông thải, chai PET trong suốt: chỉ Thứ 5 · Thứ 7, ngày trước ngày lễ", "ja": "毎日出せる（土曜・祝日の前日を除く）。廃ビニール・透明ペットボトルは木曜のみ · 土曜、祝日の前日", "zh": "每天可扔（周六及公休日前一天除外）。塑料膜（비닐）·透明PET瓶（투명 페트병）只在周四 · 周六、公休日前一天", "mn": "Өдөр бүр гаргана (Бямба гараг, баярын өдрийн өмнөх өдрөөс бусад). Гялгар уут, тунгалаг ПЭТ савыг зөвхөн Пүрэв гарагт · Бямба гараг, баярын өдрийн өмнөх өдөр", "tw": "每天可扔（週六及公休日前一天除外）。塑膠膜（비닐）·透明PET瓶（투명 페트병）只在週四 · 週六、公休日前一天"}}, "url": "https://www.gangdong.go.kr/web/newportal/contents/gdp_005_004_010_001", "checked": "2026-10-25"}, {"id": "seoul-gangseo", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "강서구", "id": "Gangseo-gu", "th": "Gangseo-gu", "en": "Gangseo-gu", "ru": "Сеул, Кансо-гу", "vi": "Gangseo-gu", "ja": "江西区（カンソ）", "zh": "江西区", "mn": "Сөүл, Гансо-гу", "tw": "江西區"}, "f": {"hours": {"ko": "일반쓰레기 19시~24시, 음식물 18시~24시, 재활용 일몰 후~24시", "id": "Sampah umum 19:00~24:00, sampah makanan 18:00~24:00, daur ulang setelah matahari terbenam~24:00", "th": "ขยะทั่วไป 19:00~24:00 ขยะเศษอาหาร 18:00~24:00 ขยะรีไซเคิล หลังพระอาทิตย์ตก~24:00", "en": "General waste 19:00–24:00, food waste 18:00–24:00, recycling from sunset to 24:00", "ru": "Обычный мусор 19:00~24:00, пищевые отходы 18:00~24:00, вторсырьё после заката~24:00", "vi": "Rác thường 19:00~24:00, rác thức ăn 18:00~24:00, rác tái chế từ sau khi mặt trời lặn ~24:00", "ja": "一般ごみ 19:00〜24:00、生ごみ 18:00〜24:00、資源ごみ 日没後〜24:00", "zh": "一般垃圾19:00–24:00，厨余18:00–24:00，可回收物日落后–24:00", "mn": "Энгийн хог 19:00~24:00, хүнсний хог 18:00~24:00, дахин боловсруулах хог нар жаргасны дараа~24:00", "tw": "一般垃圾19:00–24:00，廚餘18:00–24:00，可回收物日落後–24:00"}, "place": {"ko": "내 집 앞, 내 점포 앞", "id": "Di depan rumah, di depan toko Anda", "th": "หน้าบ้าน หน้าร้านของคุณ", "en": "In front of your own home or shop", "ru": "Перед своим домом, перед своим магазином", "vi": "Trước nhà, trước cửa hàng của bạn", "ja": "自宅の前、店舗の前", "zh": "自家门前、自家店铺门前", "mn": "Өөрийн байрны үүдэнд, өөрийн дэлгүүрийн үүдэнд", "tw": "自家門前、自家店鋪門前"}, "food": {"ko": "물기·이물질 빼고 음식물 종량제 봉투에 담아 수거용기에 배출. RFID 종량기 설치 주택은 기기에 배출", "id": "Buang air dan benda asing, masukkan ke kantong sampah makanan berbayar (음식물 종량제 봉투), lalu ke wadah pengumpulan. Rumah yang punya mesin RFID: buang ke mesin", "th": "เทน้ำและเอาสิ่งแปลกปลอมออก ใส่ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제 봉투) แล้วใส่ถังเก็บขยะ บ้านที่มีเครื่อง RFID ให้ทิ้งที่เครื่อง", "en": "Remove water and foreign objects, put it in a food-waste pay-as-you-throw bag (음식물 종량제 봉투), then in the collection bin. Houses with an RFID machine: put it in the machine", "ru": "Слейте воду, уберите посторонние предметы, положите в платный пакет для пищевых отходов (음식물 종량제 봉투) и в контейнер для сбора. Если у дома есть RFID-устройство — в него", "vi": "Bỏ nước và tạp chất, cho vào túi rác thức ăn có trả phí (음식물 종량제 봉투), bỏ vào thùng thu gom. Nhà có máy cân RFID thì bỏ vào máy", "ja": "水気・異物を取り除き、生ごみ用の従量制袋（음식물 종량제 봉투）に入れて回収容器へ。RFID計量機がある住宅は機械に入れる", "zh": "去掉水分和杂物，装入厨余计量收费袋（음식물 종량제 봉투），放进回收桶。装有RFID称重机的住宅投入机器", "mn": "Ус, хольцыг нь гаргаж хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투) хийн хогийн саванд гаргана. RFID төхөөрөмжтэй байранд төхөөрөмжид хийнэ", "tw": "去掉水分和雜物，裝入廚餘計量收費袋（음식물 종량제 봉투），放進回收桶。裝有RFID稱重機的住宅投入機器"}, "bulky": {"ko": "구청 홈페이지 대형폐기물 배출신청(빼기, bbegi.com) 후 예약번호를 붙여 배출일 저녁(해진 후~자정)에 배출", "id": "Daftar sampah besar (대형폐기물) di situs kantor gu (빼기, bbegi.com), tempel nomor reservasi, lalu keluarkan malam hari buang (setelah matahari terbenam~tengah malam)", "th": "ยื่นขอทิ้งขยะชิ้นใหญ่ (대형폐기물) บนเว็บไซต์สำนักงานเขต (빼기, bbegi.com) ติดเลขจองแล้วนำออกไปวางตอนเย็นวันทิ้ง (หลังพระอาทิตย์ตก~เที่ยงคืน)", "en": "Apply for large waste (대형폐기물) on the district office website ('Bbegi' 빼기, bbegi.com), attach the reservation number, and put it out in the evening of the disposal day (after sunset until midnight)", "ru": "Заявка на крупный мусор (대형폐기물) на сайте администрации района (구청) («빼기», bbegi.com), затем приклейте номер заявки и выносите вечером в день выноса (после заката~полночь)", "vi": "Đăng ký rác cồng kềnh (대형폐기물) trên trang web của quận ('빼기' Bbegi, bbegi.com) → dán số đặt chỗ, để ra vào tối ngày bỏ (sau khi mặt trời lặn ~ nửa đêm)", "ja": "区役所ホームページで大型ごみ（대형폐기물）を申請（「빼기」（ペギ）、bbegi.com）→ 予約番号を貼り、出す日の夜（日没後〜24:00）に出す", "zh": "在区厅网站申请大型废弃物（“빼기”，bbegi.com），贴上预约号码，在排放日晚上（日落后~午夜）排放", "mn": "Дүүргийн захиргааны (구청) сайтаар том хог (대형폐기물) хүсэлт («빼기», bbegi.com) гаргаад захиалгын дугаараа нааж, гаргах өдрийн орой (нар жаргасны дараа~шөнө дунд) гаргана", "tw": "在區廳網站申請大型廢棄物（“빼기”，bbegi.com），貼上預約號碼，在排放日晚上（日落後~午夜）排放"}, "notes": {"ko": "재활용품은 투명·반투명 비닐봉투에 담아 배출(검은 봉투 불가). 깨진 유리는 신문지에 싸서 종량제봉투", "id": "Daur ulang dimasukkan ke kantong plastik bening atau setengah bening (kantong hitam tidak boleh). Kaca pecah dibungkus koran, lalu ke kantong berbayar (종량제봉투)", "th": "ขยะรีไซเคิลใส่ถุงพลาสติกใสหรือขุ่นโปร่งแสง (ถุงดำใช้ไม่ได้) แก้วแตกห่อด้วยหนังสือพิมพ์ แล้วใส่ถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Recycling in a clear or semi-clear plastic bag (no black bags). Broken glass: wrap it in newspaper and put it in a pay-as-you-throw bag (종량제 봉투)", "ru": "Вторсырьё — в прозрачный или полупрозрачный пакет (чёрный нельзя). Битое стекло заверните в газету и положите в платный пакет (종량제 봉투)", "vi": "Rác tái chế cho vào túi ni lông trong suốt hoặc nửa trong suốt (không dùng túi đen). Kính vỡ: gói bằng giấy báo, cho vào túi rác có trả phí (종량제 봉투)", "ja": "資源ごみは透明・半透明のビニール袋に入れて出す（黒い袋は不可）。割れたガラスは新聞紙に包んで従量制袋（종량제 봉투）へ", "zh": "可回收物装透明或半透明塑料袋（不可用黑色袋）。碎玻璃用报纸包好，装入计量收费袋（종량제 봉투）", "mn": "Дахин боловсруулах хогийг тунгалаг, хагас тунгалаг уутанд (хар уут болохгүй). Хагарсан шилийг сонинд ороож төлбөртэй уутанд (종량제 봉투)", "tw": "可回收物裝透明或半透明塑膠袋（不可用黑色袋）。碎玻璃用報紙包好，裝入計量收費袋（종량제 봉투）"}, "days": {"ko": "주 5일: 일·월·화·수·목 (금·토 배출 안 함). 공동주택 재활용은 단지별 지정 요일 · 금요일, 토요일", "id": "5 hari seminggu: Minggu·Senin·Selasa·Rabu·Kamis (Jumat·Sabtu tidak boleh). Daur ulang di apartemen/rumah susun: hari yang ditentukan tiap kompleks · Jumat, Sabtu", "th": "สัปดาห์ละ 5 วัน: อาทิตย์·จันทร์·อังคาร·พุธ·พฤหัสบดี (ศุกร์·เสาร์ ห้ามทิ้ง) ขยะรีไซเคิลของอพาร์ตเมนต์/อาคารชุด: วันที่แต่ละโครงการกำหนด · วันศุกร์ วันเสาร์", "en": "5 days a week: Sun·Mon·Tue·Wed·Thu (not Fri or Sat). Apartments (공동주택): recycling on the day set by each complex · Friday, Saturday", "ru": "5 дней в неделю: вс, пн, вт, ср, чт (в пт и сб не выносить). Вторсырьё в многоквартирных домах — в дни, назначенные комплексом · Пятница, суббота", "vi": "5 ngày/tuần: CN·Thứ 2·Thứ 3·Thứ 4·Thứ 5 (không bỏ Thứ 6·Thứ 7). Rác tái chế ở chung cư (공동주택): theo ngày của từng khu · Thứ 6, Thứ 7", "ja": "週5日：日・月・火・水・木（金・土は出さない）。共同住宅（공동주택）の資源ごみは団地ごとに決められた曜日 · 金曜、土曜", "zh": "每周5天：周日·一·二·三·四（周五·六不扔）。公寓（공동주택）的可回收物按各小区指定的日子 · 周五、周六", "mn": "Долоо хоногт 5 өдөр: Ням·Даваа·Мягмар·Лхагва·Пүрэв (Баасан·Бямбад гаргахгүй). Орон сууцны дахин боловсруулах хог — хотхон бүрийн заасан өдөр · Баасан гараг, Бямба гараг", "tw": "每週5天：週日·一·二·三·四（週五·六不扔）。公寓（공동주택）的可回收物按各小區指定的日子 · 週五、週六"}}, "url": "https://www.gangseo.seoul.kr/env/env010401", "checked": "2026-10-25"}, {"id": "seoul-gwanak", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "관악구", "id": "Gwanak-gu", "th": "Gwanak-gu", "en": "Gwanak-gu", "ru": "Сеул, Кванак-гу", "vi": "Gwanak-gu", "ja": "冠岳区（クァナク）", "zh": "冠岳区", "mn": "Сөүл, Гванак-гу", "tw": "冠嶽區"}, "f": {"hours": {"ko": "주택가 18:00~24:00 / 큰길가 22:00~다음날 01:00", "id": "Kawasan rumah: 18:00~24:00 / Jalan besar: 22:00~01:00 dini hari berikutnya", "th": "ย่านบ้านพัก: 18:00~24:00 / ถนนใหญ่: 22:00~01:00 ของวันถัดไป", "en": "Residential areas: 18:00–24:00 / Main roads: 22:00–01:00 (next day)", "ru": "Жилые улицы: 18:00~24:00 / большие улицы: 22:00~01:00 следующего дня", "vi": "Khu nhà ở: 18:00~24:00 / Đường lớn: 22:00~01:00 sáng hôm sau", "ja": "住宅街：18:00〜24:00 / 大通り沿い：22:00〜翌01:00", "zh": "住宅区：18:00–24:00 / 大马路边：22:00–次日01:00", "mn": "Орон сууцны бүс: 18:00~24:00 / Том зам: 22:00~маргааш нь 01:00", "tw": "住宅區：18:00–24:00 / 大馬路邊：22:00–次日01:00"}, "place": {"ko": "내 집·점포 앞", "id": "Di depan rumah, toko Anda", "th": "หน้าบ้าน หน้าร้านของคุณ", "en": "In front of your own home or shop", "ru": "Перед своим домом или магазином", "vi": "Trước nhà, cửa hàng của bạn", "ja": "自宅・店舗の前", "zh": "自家或店铺门前", "mn": "Өөрийн байр, дэлгүүрийн үүдэнд", "tw": "自家或店鋪門前"}, "food": {"ko": "주택·빌라: 물기 빼서 음식물 전용봉투에 넣어 전용용기에", "id": "Rumah, vila (빌라): tiriskan airnya, masukkan ke kantong sampah makanan (음식물 전용봉투), lalu ke wadah khusus", "th": "บ้านพัก วิลล่า (빌라): สะเด็ดน้ำออก ใส่ถุงขยะเศษอาหาร (음식물 전용봉투) แล้วใส่ถังเฉพาะ", "en": "Houses and villas: drain the water, put it in a food-waste bag (음식물 전용봉투), then in the special bin", "ru": "Частные дома и виллы (빌라): слейте воду, в пакет для пищевых отходов (음식물 전용봉투), затем в спец. контейнер", "vi": "Nhà riêng, nhà nhiều hộ (빌라): chắt hết nước, cho vào túi rác thức ăn (음식물 전용봉투), bỏ vào thùng riêng", "ja": "一戸建て・ヴィラ：水気を切って生ごみ専用袋（음식물 전용봉투）に入れ、専用容器へ", "zh": "独栋·别墅型公寓：沥干水分，装入厨余专用袋（음식물 전용봉투），放进专用桶", "mn": "Хувийн байшин, вилла (빌라): усыг шавхаад хүнсний хаягдлын уутанд (음식물 전용봉투) хийж, тусгай саванд", "tw": "獨棟·別墅型公寓：瀝乾水分，裝入廚餘專用袋（음식물 전용봉투），放進專用桶"}, "bags": {"ko": "종량제봉투 판매소(구 홈페이지에서 위치 검색). 특수마대는 동주민센터", "id": "Tempat jual kantong sampah berbayar (종량제봉투 판매소) (cari lokasinya di situs kantor gu). Karung khusus (특수마대) di kantor kelurahan (동주민센터)", "th": "จุดขายถุงขยะแบบเสียเงิน (종량제봉투 판매소) (ค้นหาตำแหน่งบนเว็บไซต์สำนักงานเขต) กระสอบพิเศษ (특수마대) ซื้อที่ศูนย์บริการชุมชน (동주민센터)", "en": "Pay-as-you-throw bag (종량제봉투) sales points (search locations on the district website). Special sacks (특수마대) at the community center (동주민센터)", "ru": "Пункты продажи платных пакетов (종량제봉투 판매소) — адреса ищите на сайте района. Специальные мешки (특수마대) — в центре (동주민센터)", "vi": "Nơi bán túi rác có trả phí (종량제봉투 판매소) (tìm vị trí trên trang web của quận). Bao tải đặc biệt (특수마대) mua ở trung tâm phường (동주민센터)", "ja": "従量制袋 ": "18:00~24:00 (Шихын-дэро зэрэг том замын дэлгүүрүүд 22:00~маргааш нь 01:00)", "tw": "18:00–24:00（始興大路等主要道路的商鋪22:00–次日01:00）"}, "place": {"ko": "내 집(대문) 앞, 내 상가 앞. 인도·가로수 앞 금지", "id": "Di depan rumah (pintu gerbang) atau toko Anda. Jangan di trotoar atau di depan pohon pinggir jalan", "th": "หน้าบ้าน (ประตูรั้ว) หรือหน้าร้านของคุณ ห้ามวางบนทางเท้าหรือหน้าต้นไม้ริมถนน", "en": "In front of your own home (gate) or shop. Not on the sidewalk or in front of street trees", "ru": "Перед своим домом (воротами), перед своим магазином. Нельзя на тротуаре и у деревьев", "vi": "Trước cổng nhà, trước cửa hàng của bạn. Không để trên vỉa hè hay trước cây ven đường", "ja": "自宅（門）の前、自分の店の前。歩道・街路樹の前は禁止", "zh": "自家（大门）前、自家店铺门前。不可放在人行道或行道树前", "mn": "Өөрийн байр (хаалга)-ны үүдэнд, өөрийн дэлгүүрийн үүдэнд. Явган зам, модны дэргэд болохгүй", "tw": "自家（大門）前、自家店鋪門前。不可放在人行道或行道樹前"}, "food": {"ko": "물기 빼고 음식물 전용봉투에 담아 전용용기로 집 앞 배출. 공동주택은 RFID 카드로 배출", "id": "Buang air, masukkan ke kantong khusus sampah makanan (음식물 전용봉투), lalu ke wadah khusus di depan rumah. Apartemen/rumah susun: pakai kartu RFID", "th": "เทน้ำออก ใส่ถุงขยะเศษอาหารเฉพาะ (음식물 전용봉투) แล้วใส่ถังเฉพาะวางหน้าบ้าน อพาร์ตเมนต์/อาคารชุดทิ้งด้วยบัตร RFID", "en": "Drain the water, put it in a food-waste bag (음식물 전용봉투), then in the special bin in front of your home. Apartments: RFID card", "ru": "Слейте воду, положите в специальный пакет для пищевых отходов и в спец. контейнер перед домом. Многоквартирные дома — по RFID-карте", "vi": "Để ráo nước, cho vào túi rác thức ăn chuyên dụng (음식물 전용봉투), bỏ vào thùng chuyên dụng, để trước nhà. Chung cư (공동주택): bỏ bằng thẻ RFID", "ja": "水気を切り、生ごみ専用袋（음식물 전용봉투）に入れ、専用容器で自宅前に出す。共同住宅はRFIDカードで出す", "zh": "沥干水分，装入厨余专用袋（음식물 전용봉투），放进专用桶放在家门前。公寓用RFID卡", "mn": "Усыг нь шүүж хүнсний хогийн тусгай уутанд хийн тусгай саваар байрны үүдэнд. Орон сууц — RFID картаар", "tw": "瀝乾水分，裝入廚餘專用袋（음식물 전용봉투），放進專用桶放在家門前。公寓用RFID卡"}, "bags": {"ko": "종량제 봉투 판매소(구 홈페이지에서 위치 조회)", "id": "Toko penjual kantong sampah berbayar (종량제 봉투) (cari lokasi di situs kantor gu)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제 봉투) (ค้นหาที่ตั้งบนเว็บไซต์สำนักงานเขต)", "en": "Pay-as-you-throw bag shops (종량제 봉투 판매소) — find locations on the district website", "ru": "Пункты продажи платных пакетов (종량제 봉투) (адреса — на сайте района)", "vi": "Nơi bán túi rác có trả phí (종량제 봉투) (tra địa điểm trên trang web của quận)", "ja": "従量制袋（종량제 봉투）の販売店（区のホームページで場所を検索）", "zh": "计量收费袋销售处（종량제 봉투 판매소）（可在区网站查询位置）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (байршлыг дүүргийн сайтаас)", "tw": "計量收費袋銷售處（종량제 봉투 판매소）（可在區網站查詢位置）"}, "bulky": {"ko": "인터넷 신고(smartclean.geumcheon.go.kr) 또는 동주민센터·청소행정과 전화 신고 후 배출", "id": "Lapor online (smartclean.geumcheon.go.kr) atau telepon kantor kelurahan (동주민센터)/bagian kebersihan (청소행정과), lalu keluarkan", "th": "แจ้งออนไลน์ (smartclean.geumcheon.go.kr) หรือโทรแจ้งศูนย์บริการชุมชน (동주민센터)/ฝ่ายรักษาความสะอาด (청소행정과) แล้วจึงนำออกไปวาง", "en": "Report online (smartclean.geumcheon.go.kr) or by phone to the community center (동주민센터) or the Cleaning Administration Division (청소행정과), then put it out", "ru": "Заявка через интернет (smartclean.geumcheon.go.kr) или по телефону в центр (동주민센터) или отдел уборки (청소행정과), затем вынос", "vi": "Khai báo online (smartclean.geumcheon.go.kr) hoặc gọi điện khai báo cho trung tâm phường (동주민센터) hay phòng hành chính vệ sinh (청소행정과), rồi để ra", "ja": "インターネットで申告（smartclean.geumcheon.go.kr）、または住民センター（동주민센터）・清掃行政課（청소행정과）に電話で申告してから出す", "zh": "网上申报（smartclean.geumcheon.go.kr）或打电话给洞居民中心（동주민센터）·清扫行政科（청소행정과）申报后排放", "mn": "Интернетээр (smartclean.geumcheon.go.kr) эсвэл хорооны төв (동주민센터)·цэвэрлэгээний хэлтэс (청소행정과)-т утсаар мэдэгдээд гаргана", "tw": "網上申報（smartclean.geumcheon.go.kr）或打電話給洞居民中心（동주민센터）·清掃行政科（청소행정과）申報後排放"}, "notes": {"ko": "폐비닐·투명 페트병은 목요일, 기타 재활용은 일~수·금요일. 투명 봉투 사용(검은 봉투는 미수거)", "id": "Plastik dan botol PET bening hari Kamis, daur ulang lain Minggu~Rabu dan Jumat. Pakai kantong bening (kantong hitam tidak diambil)", "th": "ถุงพลาสติกและขวด PET ใส ทิ้งวันพฤหัสบดี ขยะรีไซเคิลอื่นทิ้งวันอาทิตย์~พุธ และวันศุกร์ ใช้ถุงใส (ถุงดำไม่เก็บ)", "en": "Plastic film and clear PET bottles: Thursday. Other recycling: Sun–Wed and Fri. Use a clear bag (black bags are not collected)", "ru": "Плёнку и прозрачные ПЭТ-бутылки — в четверг, другое вторсырьё — вс~ср и пт. Используйте прозрачный пакет (в чёрном не заберут)", "vi": "Ni lông thải, chai PET trong suốt: Thứ 5. Rác tái chế khác: CN ~ Thứ 4 và Thứ 6. Dùng túi trong suốt (túi đen không được thu gom)", "ja": "廃ビニール・透明ペットボトルは木曜、そのほかの資源ごみは日〜水・金曜。透明な袋を使う（黒い袋は回収されない）", "zh": "塑料膜·透明PET瓶周四，其他可回收物周日至周三·周五。用透明袋（黑色袋不收）", "mn": "Гялгар уут, тунгалаг ПЭТ сав — Пүрэв гараг, бусад дахин боловсруулах хог — Ням~Лхагва·Баасан гараг. Тунгалаг уут хэрэглэнэ (хар уутыг авахгүй)", "tw": "塑膠膜·透明PET瓶週四，其他可回收物週日至週三·週五。用透明袋（黑色袋不收）"}, "days": {"ko": "일요일~금요일 (토요일 제외) · 토요일, 공휴일 전날, 매월 마지막 금요일(마지막 토요일 전날)", "id": "Minggu~Jumat (kecuali Sabtu) · Sabtu, sehari sebelum hari libur, Jumat terakhir tiap bulan (sehari sebelum Sabtu terakhir)", "th": "วันอาทิตย์~วันศุกร์ (ยกเว้นวันเสาร์) · วันเสาร์ วันก่อนวันหยุดราชการ วันศุกร์สุดท้ายของทุกเดือน (วันก่อนวันเสาร์สุดท้าย)", "en": "Sunday–Friday (not Saturday) · Saturday, the day before a public holiday, the last Friday of each month (the day before the last Saturday)", "ru": "С воскресенья по пятницу (кроме субботы) · Суббота, день перед праздником, последняя пятница месяца (день перед последней субботой)", "vi": "CN ~ Thứ 6 (trừ Thứ 7) · Thứ 7, ngày trước ngày lễ, Thứ 6 cuối cùng của mỗi tháng (ngày trước Thứ 7 cuối cùng)", "ja": "日曜〜金曜（土曜を除く） · 土曜、祝日の前日、毎月最後の金曜（最後の土曜の前日）", "zh": "周日至周五（周六除外） · 周六、公休日前一天、每月最后一个周五（最后一个周六的前一天）", "mn": "Ням~Баасан гараг (Бямба гарагаас бусад) · Бямба гараг, баярын өдрийн өмнөх өдөр, сар бүрийн сүүлийн Баасан гараг (сүүлийн Бямбын өмнөх өдөр)", "tw": "週日至週五（週六除外） · 週六、公休日前一天、每月最後一個週五（最後一個週六的前一天）"}}, "url": "https://www.geumcheon.go.kr/portal/contents.do?key=812", "checked": "2026-10-25"}, {"id": "seoul-nowon", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "노원구", "id": "Nowon-gu", "th": "Nowon-gu", "en": "Nowon-gu", "ru": "Сеул, Новон-гу", "vi": "Nowon-gu", "ja": "蘆原区（ノウォン）", "zh": "芦原区", "mn": "Сөүл, Новон-гу", "tw": "蘆原區"}, "f": {"hours": {"ko": "18시~24시", "id": "18:00~24:00", "th": "18:00~24:00", "en": "18:00–24:00", "ru": "18:00~24:00", "vi": "18:00~24:00", "ja": "18:00〜24:00", "zh": "18:00–24:00", "mn": "18:00~24:00", "tw": "18:00–24:00"}, "place": {"ko": "내 집·내 점포 앞 (인도·도로·전봇대·가로수 금지). 공동주택은 지정 장소", "id": "Di depan rumah atau toko Anda (jangan di trotoar, jalan, tiang listrik, pohon pinggir jalan). Apartemen/rumah susun: tempat yang ditentukan", "th": "หน้าบ้านหรือหน้าร้านของคุณ (ห้ามวางบนทางเท้า ถนน เสาไฟฟ้า ต้นไม้ริมถนน) อพาร์ตเมนต์/อาคารชุด: จุดที่กำหนด", "en": "In front of your own home or shop (not on the sidewalk, road, utility poles or street trees). Apartments: designated spot", "ru": "Перед своим домом или магазином (нельзя на тротуаре, дороге, у столбов и деревьев). Многоквартирные дома — в назначенном месте", "vi": "Trước nhà, cửa hàng của bạn (không để trên vỉa hè, đường, cột điện, cây ven đường). Chung cư: nơi được chỉ định", "ja": "自宅・店舗の前（歩道・道路・電柱・街路樹は禁止）。共同住宅は決められた場所", "zh": "自家·店铺门前（不可放在人行道、马路、电线杆、行道树旁）。公寓放指定地点", "mn": "Өөрийн байр, дэлгүүрийн үүдэнд (явган зам, зам, цахилгааны шон, модны дэргэд болохгүй). Орон сууц — заасан газар", "tw": "自家·店鋪門前（不可放在人行道、馬路、電線杆、行道樹旁）。公寓放指定地點"}, "food": {"ko": "단독주택은 지정 요일 저녁 6시 이후 수거용기에 납부필증 붙여 문 앞 배출. 공동주택은 전용용기·RFID", "id": "Rumah tunggal: hari yang ditentukan setelah 18:00, tempel stiker bukti bayar (납부필증) di wadah pengumpulan, taruh di depan pintu. Apartemen/rumah susun: wadah khusus atau RFID", "th": "บ้านเดี่ยว: วันที่กำหนดหลัง 18:00 ติดสติกเกอร์ชำระเงินแล้ว (납부필증) บนถังเก็บขยะ วางหน้าประตู อพาร์ตเมนต์/อาคารชุด: ถังเฉพาะหรือ RFID", "en": "Houses: on the set days after 18:00, in the collection bin with a payment sticker (납부필증), in front of your door. Apartments: special bins or RFID", "ru": "Частные дома: в назначенный день после 18:00, в контейнер с наклейкой об оплате (납부필증), перед дверью. Многоквартирные дома: спец. контейнер или RFID", "vi": "Nhà riêng: vào ngày quy định, sau 18:00, dán tem đã trả phí (납부필증) lên thùng thu gom, để trước cửa. Chung cư: thùng chuyên dụng, RFID", "ja": "一戸建ては決められた曜日の18:00以降、回収容器に納付済証（납부필증）を貼って玄関前に出す。共同住宅は専用容器・RFID", "zh": "独栋住宅：在指定日子18:00后，在回收桶上贴缴费证（납부필증）放在家门前。公寓用专用桶·RFID", "mn": "Хувийн байшин: заасан өдөр 18:00-аас хойш саванд төлбөрийн наалт (납부필증) нааж хаалганы өмнө. Орон сууц: тусгай сав, RFID", "tw": "獨棟住宅：在指定日子18:00後，在回收桶上貼繳費證（납부필증）放在家門前。公寓用專用桶·RFID"}, "bags": {"ko": "편의점, 슈퍼마켓 등 지정 판매소", "id": "Toko penjual resmi seperti minimarket (편의점), supermarket", "th": "ร้านที่ได้รับอนุญาต เช่น ร้านสะดวกซื้อ ซูเปอร์มาร์เก็ต", "en": "Designated shops such as convenience stores and supermarkets", "ru": "Назначенные пункты продажи: магазины у дома (편의점), супермаркеты и др.", "vi": "Nơi bán được chỉ định như cửa hàng tiện lợi, siêu thị", "ja": "コンビニ、スーパーなどの指定販売店", "zh": "便利店、超市等指定销售处", "mn": "Дэлгүүр (편의점), супермаркет зэрэг заасан худалдааны цэг", "tw": "便利店、超市等指定銷售處"}, "bulky": {"ko": "스마트클린 노원(smartclean.nowon.kr) 인터넷 신청·결제 후 배출증 부착, 또는 주민센터 방문 신고", "id": "Daftar dan bayar online di Smart Clean Nowon (smartclean.nowon.kr), lalu tempel bukti buang; atau lapor langsung ke kantor kelurahan (주민센터)", "th": "ยื่นขอและจ่ายเงินออนไลน์ที่ Smart Clean Nowon (smartclean.nowon.kr) แล้วติดใบอนุญาตทิ้ง หรือไปแจ้งที่ศูนย์บริการชุมชน (주민센터)", "en": "Apply and pay online at Smart Clean Nowon (smartclean.nowon.kr), then attach the disposal certificate, or report in person at the community center (주민센터)", "ru": "Заявка и оплата онлайн на «스마트클린 노원» (smartclean.nowon.kr), затем приклейте квитанцию, или заявка лично в центре (주민센터)", "vi": "Đăng ký và trả phí online ở Smart Clean Nowon (스마트클린 노원, smartclean.nowon.kr) rồi dán giấy xác nhận, hoặc đến trung tâm phường (주민센터) khai báo", "ja": "スマートクリーン蘆原（스마트클린 노원、smartclean.nowon.kr）でネット申請・支払い後、排出証を貼る。または住民センター（주민센터）で申告", "zh": "在“Smart Clean 芦原”（smartclean.nowon.kr）网上申请·付款后贴上排放证，或到居民中心（주민센터）申报", "mn": "«스마트클린 노원» (smartclean.nowon.kr)-д онлайнаар хүсэлт гаргаж төлөөд баримтаа наана, эсвэл хорооны төв (주민센터)-д очиж мэдэгдэнэ", "tw": "在“Smart Clean 蘆原”（smartclean.nowon.kr）網上申請·付款後貼上排放證，或到居民中心（주민센터）申報"}, "notes": {"ko": "투명 페트병·폐비닐은 목요일만, 그 외 재활용은 목·토요일 제외 매일. 연탄재는 화요일 배출", "id": "Botol PET bening dan plastik hanya hari Kamis, daur ulang lain setiap hari kecuali Kamis dan Sabtu. Abu briket batu bara (연탄재) dibuang hari Selasa", "th": "ขวด PET ใสและถุงพลาสติก เฉพาะวันพฤหัสบดี ขยะรีไซเคิลอื่นทิ้งได้ทุกวัน ยกเว้นวันพฤหัสบดีและวันเสาร์ ขี้เถ้าถ่านอัดแท่ง (연탄재) ทิ้งวันอังคาร", "en": "Clear PET bottles and plastic film: Thursday only. Other recycling: every day except Thursday and Saturday. Briquette ash (연탄재): Tuesday", "ru": "Прозрачные ПЭТ-бутылки и плёнку — только в четверг, другое вторсырьё — каждый день, кроме чт и сб. Угольный пепел (연탄재) — во вторник", "vi": "Chai PET trong suốt, ni lông thải: chỉ Thứ 5. Rác tái chế khác: mỗi ngày trừ Thứ 5 và Thứ 7. Tro than tổ ong (연탄재): bỏ vào Thứ 3", "ja": "透明ペットボトル・廃ビニールは木曜のみ、そのほかの資源ごみは木・土曜を除いて毎日。練炭の灰（연탄재）は火曜に出す", "zh": "透明PET瓶·塑料膜只在周四，其他可回收物除周四·周六外每天。煤球灰（연탄재）周二扔", "mn": "Тунгалаг ПЭТ сав, гялгар уутыг зөвхөн Пүрэв гарагт, бусад дахин боловсруулах хогийг Пүрэв·Бямбаас бусад өдөр бүр. Нүүрсний үнс (연탄재) — Мягмар гараг", "tw": "透明PET瓶·塑膠膜只在週四，其他可回收物除週四·週六外每天。煤球灰（연탄재）週二扔"}, "days": {"ko": "일반주택·상가: 일요일~금요일 (공휴일 제외). 공동주택·단지 내 상가는 주 3회 수거 · 토요일, 공휴일 전날", "id": "Rumah biasa dan toko: Minggu~Jumat (kecuali hari libur). Apartemen/rumah susun dan toko di dalam kompleks: diambil 3 kali seminggu · Sabtu, sehari sebelum hari libur", "th": "บ้านทั่วไปและร้านค้า: วันอาทิตย์~วันศุกร์ (ยกเว้นวันหยุดราชการ) อพาร์ตเมนต์/อาคารชุดและร้านในโครงการ: เก็บสัปดาห์ละ 3 ครั้ง · วันเสาร์ วันก่อนวันหยุดราชการ", "en": "Houses and shops: Sunday–Friday (except public holidays). Apartments and shops inside apartment complexes: pickup 3 times a week · Saturday, the day before a public holiday", "ru": "Частные дома и магазины: с воскресенья по пятницу (кроме праздников). Многоквартирные дома и магазины в комплексе: вывоз 3 раза в неделю · Суббота, день перед праздником", "vi": "Nhà riêng, cửa hàng: CN ~ Thứ 6 (trừ ngày lễ). Chung cư (공동주택) và cửa hàng trong khu: thu gom 3 lần/tuần · Thứ 7, ngày trước ngày lễ", "ja": "一般住宅・商店：日曜〜金曜（祝日を除く）。共同住宅・団地内の商店は週3回回収 · 土曜、祝日の前日", "zh": "独栋住宅·商铺：周日至周五（公休日除外）。公寓·小区内商铺每周收3次 · 周六、公休日前一天", "mn": "Хувийн байшин, дэлгүүр: Ням~Баасан гараг (баярын өдрөөс бусад). Орон сууц, хотхон доторх дэлгүүр: долоо хоногт 3 удаа ачна · Бямба гараг, баярын өдрийн өмнөх өдөр", "tw": "獨棟住宅·商鋪：週日至週五（公休日除外）。公寓·小區內商鋪每週收3次 · 週六、公休日前一天"}}, "url": "https://www.nowon.kr/www/info/info5/minwon4_03/minwon4_03_02.jsp", "checked": "2026-10-25"}, {"id": "seoul-dobong", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "도봉구", "id": "Dobong-gu", "th": "Dobong-gu", "en": "Dobong-gu", "ru": "Сеул, Тобон-гу", "vi": "Dobong-gu", "ja": "道峰区（トボン）", "zh": "道峰区", "mn": "Сөүл, Добон-гу", "tw": "道峰區"}, "f": {"hours": {"ko": "18시~24시", "id": "18:00~24:00", "th": "18:00~24:00", "en": "18:00–24:00", "ru": "18:00~24:00", "vi": "18:00~24:00", "ja": "18:00〜24:00", "zh": "18:00–24:00", "mn": "18:00~24:00", "tw": "18:00–24:00"}, "place": {"ko": "내 집·내 점포 앞", "id": "Di depan rumah atau toko Anda", "th": "หน้าบ้านหรือหน้าร้านของคุณ", "en": "In front of your own home or shop", "ru": "Перед своим домом или магазином", "vi": "Trước nhà, cửa hàng của bạn", "ja": "自宅・店舗の前", "zh": "自家·店铺门前", "mn": "Өөрийн байр, дэлгүүрийн үүдэнд", "tw": "自家·店鋪門前"}, "food": {"ko": "단독주택은 전용수거용기에 맞는 납부확인증을 붙여 배출. 공동주택은 전용용기 또는 RFID 종량기", "id": "Rumah tunggal: tempel tanda bukti bayar (납부확인증) yang sesuai ukuran wadah khusus, lalu keluarkan. Apartemen/rumah susun: wadah khusus atau mesin timbang RFID", "th": "บ้านเดี่ยว: ติดใบยืนยันการชำระเงิน (납부확인증) ที่ตรงกับขนาดถังเฉพาะ แล้วนำออกไปวาง อพาร์ตเมนต์/อาคารชุด: ถังเฉพาะหรือเครื่องชั่ง RFID", "en": "Houses: attach the payment certificate (납부확인증) that matches your special bin. Apartments: special bins or RFID food-waste machines", "ru": "Частные дома: приклейте к спец. контейнеру подходящую наклейку об оплате (납부확인증). Многоквартирные дома: спец. контейнер или RFID-устройство", "vi": "Nhà riêng: dán giấy xác nhận đã trả phí (납부확인증) đúng loại thùng thu gom chuyên dụng rồi để ra. Chung cư (공동주택): thùng chuyên dụng hoặc máy cân RFID", "ja": "一戸建ては専用回収容器に合う納付確認証（납부확인증）を貼って出す。共同住宅は専用容器またはRFID計量機", "zh": "独栋住宅：贴上与专用桶大小相符的缴费确认证（납부확인증）后排放。公寓用专用桶或RFID称重机", "mn": "Хувийн байшин: тусгай саванд тохирох төлбөрийн баримт (납부확인증) нааж гаргана. Орон сууц: тусгай сав эсвэл RFID төхөөрөмж", "tw": "獨棟住宅：貼上與專用桶大小相符的繳費確認證（납부확인증）後排放。公寓用專用桶或RFID稱重機"}, "bags": {"ko": "종량제봉투 판매소 (구 누리집 판매소 지도·현황)", "id": "Toko penjual kantong sampah berbayar (종량제봉투) (peta dan daftar toko di situs kantor gu)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (แผนที่และรายชื่อร้านบนเว็บไซต์สำนักงานเขต)", "en": "Pay-as-you-throw bag shops (종량제봉투 판매소) — see the shop map and list on the district website", "ru": "Пункты продажи платных пакетов (종량제 봉투) (карта и список на сайте района)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) (bản đồ, danh sách nơi bán trên trang web của quận)", "ja": "従量制袋（종량제봉투）の販売店（区のホームページに販売店の地図・一覧）", "zh": "计量收费袋销售处（종량제봉투 판매소）（区网站有销售处地图·列表）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (дүүргийн сайтын газрын зураг, жагсаалт)", "tw": "計量收費袋銷售處（종량제봉투 판매소）（區網站有銷售處地圖·列表）"}, "bulky": {"ko": "스마트클린 도봉(smartclean.dobong.go.kr) 또는 빼기 앱 신청, 또는 주민센터 접수", "id": "Daftar di Smart Clean Dobong (smartclean.dobong.go.kr) atau aplikasi 빼기 (Bbegi), atau lapor ke kantor kelurahan (주민센터)", "th": "ยื่นขอที่ Smart Clean Dobong (smartclean.dobong.go.kr) หรือแอป 빼기 (Bbegi) หรือแจ้งที่ศูนย์บริการชุมชน (주민센터)", "en": "Apply at Smart Clea  "th": "หน้าบ้านของคุณ", "en": "In front of your own home (door-to-door)", "ru": "Перед своим домом (у двери)", "vi": "Trước nhà bạn (bỏ trước cửa)", "ja": "自宅の前（戸別排出）", "zh": "自家门前（门前排放）", "mn": "Өөрийн байрны үүдэнд (хаалганы өмнө)", "tw": "自家門前（門前排放）"}, "food": {"ko": "물기·이물질 빼고 음식물 전용봉투에 담아 수거용기로 문 앞 배출. 아파트는 단지 전용용기에", "id": "Buang air dan benda asing, masukkan ke kantong khusus sampah makanan (음식물 전용봉투), lalu ke wadah pengumpulan di depan pintu. Apartemen: wadah khusus kompleks", "th": "เทน้ำและเอาสิ่งแปลกปลอมออก ใส่ถุงขยะเศษอาหารเฉพาะ (음식물 전용봉투) แล้วใส่ถังเก็บขยะวางหน้าประตู อพาร์ตเมนต์: ถังเฉพาะของโครงการ", "en": "Remove water and foreign objects, put it in a food-waste bag (음식물 전용봉투), then in the collection bin in front of your door. Apartments: the complex's special bins", "ru": "Слейте воду, уберите посторонние предметы, положите в специальный пакет для пищевых отходов и в контейнер перед дверью. Апарты (아파트) — в спец. контейнер комплекса", "vi": "Bỏ nước và tạp chất, cho vào túi rác thức ăn chuyên dụng (음식물 전용봉투), bỏ vào thùng thu gom để trước cửa. Chung cư (아파트): thùng chuyên dụng của khu", "ja": "水気・異物を取り除き、生ごみ専用袋（음식물 전용봉투）に入れて回収容器で玄関前へ。マンションは団地の専用容器へ", "zh": "去掉水分和杂物，装入厨余专用袋（음식물 전용봉투），放进回收桶放在门前。公寓放小区专用桶", "mn": "Ус, хольцыг нь гаргаж хүнсний хогийн тусгай уутанд хийн саваар хаалганы өмнө. Орон сууц (아파트) — хотхоны тусгай саванд", "tw": "去掉水分和雜物，裝入廚餘專用袋（음식물 전용봉투），放進回收桶放在門前。公寓放小區專用桶"}, "bags": {"ko": "종량제봉투 판매소 (구 홈페이지 판매소 목록)", "id": "Toko penjual kantong sampah berbayar (종량제봉투) (daftar toko di situs kantor gu)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (รายชื่อร้านบนเว็บไซต์สำนักงานเขต)", "en": "Pay-as-you-throw bag shops (종량제봉투 판매소) (list on the district website)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (список на сайте района)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) (danh sách trên trang web của quận)", "ja": "従量制袋（종량제봉투）の販売店（区ホームページの販売店リスト）", "zh": "计量收费袋销售处（종량제봉투 판매소）（区网站有销售处列表）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (дүүргийн сайтын жагсаалт)", "tw": "計量收費袋銷售處（종량제봉투 판매소）（區網站有銷售處列表）"}, "bulky": {"ko": "배출 2~3일 전 대행업체 전화 또는 온라인 신청(smartclean.dongjak.go.kr) 후 내 집 앞 배출", "id": "2~3 hari sebelum buang, telepon perusahaan pengumpul atau daftar online (smartclean.dongjak.go.kr), lalu taruh di depan rumah", "th": "2~3 วันก่อนทิ้ง โทรหาบริษัทเก็บขยะหรือยื่นขอออนไลน์ (smartclean.dongjak.go.kr) แล้ววางหน้าบ้าน", "en": "2–3 days before, call the contractor (대행업체) or apply online (smartclean.dongjak.go.kr), then put it in front of your home", "ru": "За 2~3 дня до выноса — звонок в компанию по вывозу или онлайн-заявка (smartclean.dongjak.go.kr), затем вынос перед домом", "vi": "2~3 ngày trước khi bỏ, gọi công ty thu gom hoặc đăng ký online (smartclean.dongjak.go.kr), rồi để trước nhà", "ja": "出す2〜3日前に代行業者へ電話、またはオンライン申請（smartclean.dongjak.go.kr）してから自宅前に出す", "zh": "排放2~3天前打电话给代理公司（대행업체）或网上申请（smartclean.dongjak.go.kr）后，放在自家门前", "mn": "Гаргахаас 2~3 хоногийн өмнө хог ачих компанид утсаар эсвэл онлайнаар (smartclean.dongjak.go.kr) хүсэлт гаргаад байрныхаа үүдэнд гаргана", "tw": "排放2~3天前打電話給代理公司（대행업체）或網上申請（smartclean.dongjak.go.kr）後，放在自家門前"}, "notes": {"ko": "이불·베개·헌옷·솜인형은 특수종량제봉투(마대)나 대형폐기물로. 재활용은 투명 봉지에", "id": "Selimut, bantal, baju bekas, boneka kapas: ke karung berbayar khusus (특수종량제봉투, 마대) atau sebagai sampah besar. Daur ulang di kantong bening", "th": "ผ้าห่ม หมอน เสื้อผ้าเก่า ตุ๊กตายัดนุ่น: ใส่ถุงแบบเสียเงินพิเศษ (특수종량제봉투, กระสอบ 마대) หรือทิ้งเป็นขยะชิ้นใหญ่ ขยะรีไซเคิลใส่ถุงใส", "en": "Blankets, pillows, old clothes and stuffed toys: special pay-as-you-throw sack (특수종량제봉투, 마대) or as large waste. Recycling in a clear bag", "ru": "Одеяла, подушки, старую одежду, мягкие игрушки — в спец. платный мешок (특수종량제봉투, 마대) или как крупный мусор. Вторсырьё — в прозрачный пакет", "vi": "Chăn, gối, quần áo cũ, thú bông: cho vào túi đặc biệt có trả phí (특수종량제봉투, bao tải) hoặc bỏ như rác cồng kềnh (대형폐기물). Rác tái chế cho vào túi trong suốt", "ja": "布団・枕・古着・ぬいぐるみは特殊従量制袋（특수종량제봉투・麻袋）か大型ごみ（대형폐기물）で。資源ごみは透明な袋に", "zh": "被子·枕头·旧衣服·毛绒玩具装特殊计量收费袋（특수종량제봉투，麻袋）或按大型废弃物处理。可回收物装透明袋", "mn": "Хөнжил, дэр, хуучин хувцас, хөвөн тоглоомыг тусгай төлбөртэй шуудай (특수종량제봉투, 마대) эсвэл том хог болгож. Дахин боловсруулах хогийг тунгалаг уутанд", "tw": "被子·枕頭·舊衣服·毛絨玩具裝特殊計量收費袋（특수종량제봉투，麻袋）或按大型廢棄物處理。可回收物裝透明袋"}, "days": {"ko": "토요일·공휴일 전날 제외하고 배출. 비닐·투명 페트병·소형가전·배터리는 목·일요일만 · 토요일, 공휴일 전날", "id": "Boleh buang kecuali Sabtu dan sehari sebelum hari libur. Plastik, botol PET bening, elektronik kecil, baterai hanya Kamis dan Minggu · Sabtu, sehari sebelum hari libur", "th": "ทิ้งได้ ยกเว้นวันเสาร์และวันก่อนวันหยุดราชการ ถุงพลาสติก ขวด PET ใส เครื่องใช้ไฟฟ้าขนาดเล็ก แบตเตอรี่ ทิ้งได้เฉพาะวันพฤหัสบดีและวันอาทิตย์ · วันเสาร์ วันก่อนวันหยุดราชการ", "en": "Any day except Saturday and the day before a public holiday. Plastic film, clear PET bottles, small appliances and batteries: Thursday and Sunday only · Saturday, the day before a public holiday", "ru": "Выносить можно, кроме субботы и дня перед праздником. Плёнку, прозрачные ПЭТ-бутылки, мелкую технику и батарейки — только в чт и вс · Суббота, день перед праздником", "vi": "Bỏ rác trừ Thứ 7 và ngày trước ngày lễ. Ni lông, chai PET trong suốt, đồ điện nhỏ, pin: chỉ Thứ 5 và CN · Thứ 7, ngày trước ngày lễ", "ja": "土曜・祝日の前日以外に出す。ビニール・透明ペットボトル・小型家電・電池は木・日曜のみ · 土曜、祝日の前日", "zh": "周六·公休日前一天以外可扔。塑料膜·透明PET瓶·小家电·电池只在周四·周日 · 周六、公休日前一天", "mn": "Бямба гараг, баярын өдрийн өмнөх өдрөөс бусад өдөр гаргана. Гялгар уут, тунгалаг ПЭТ сав, жижиг цахилгаан хэрэгсэл, зайг зөвхөн Пүрэв·Ням гарагт · Бямба гараг, баярын өдрийн өмнөх өдөр", "tw": "週六·公休日前一天以外可扔。塑膠膜·透明PET瓶·小家電·電池只在週四·週日 · 週六、公休日前一天"}}, "url": "https://www.dongjak.go.kr/portal/main/contents.do?menuNo=200589", "checked": "2026-10-25"}, {"id": "seoul-mapo", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "마포구", "id": "Mapo-gu", "th": "Mapo-gu", "en": "Mapo-gu", "ru": "Сеул, Мапхо-гу", "vi": "Mapo-gu", "ja": "麻浦区（マポ）", "zh": "麻浦区", "mn": "Сөүл, Мапо-гу", "tw": "麻浦區"}, "f": {"hours": {"ko": "11~3월 18:00~24:00 / 4~10월 19:00~24:00", "id": "Bulan 11~3: 18:00~24:00 / Bulan 4~10: 19:00~24:00", "th": "เดือน 11~3: 18:00~24:00 / เดือน 4~10: 19:00~24:00", "en": "Nov–Mar: 18:00–24:00 / Apr–Oct: 19:00–24:00", "ru": "Ноябрь~март: 18:00~24:00 / апрель~октябрь: 19:00~24:00", "vi": "Tháng 11~3: 18:00~24:00 / Tháng 4~10: 19:00~24:00", "ja": "11〜3月：18:00〜24:00 / 4〜10月：19:00〜24:00", "zh": "11–3月：18:00–24:00 / 4–10月：19:00–24:00", "mn": "11~3 сар: 18:00~24:00 / 4~10 сар: 19:00~24:00", "tw": "11–3月：18:00–24:00 / 4–10月：19:00–24:00"}, "place": {"ko": "내 집·점포(건물) 앞", "id": "Di depan rumah, toko (gedung) Anda", "th": "หน้าบ้าน หน้าร้าน (อาคาร) ของคุณ", "en": "In front of your own home or shop (building)", "ru": "Перед своим домом или магазином (зданием)", "vi": "Trước nhà, cửa hàng (tòa nhà) của bạn", "ja": "自宅・店舗（建物）の前", "zh": "自家或店铺（建筑物）门前", "mn": "Өөрийн байр, дэлгүүрийн (барилгын) үүдэнд", "tw": "自家或店鋪（建築物）門前"}, "food": {"ko": "주택: 노란색 음식물 전용봉투에 담아 음식물통으로 집 앞 (되도록 22시 전)", "id": "Rumah: masukkan ke kantong sampah makanan kuning (음식물 전용봉투), lalu ke tong sampah makanan, taruh di depan rumah (sebisanya sebelum jam 22)", "th": "บ้านพัก: ใส่ถุงขยะเศษอาหารสีเหลือง (음식물 전용봉투) แล้วใส่ถังขยะเศษอาหาร วางหน้าบ้าน (ถ้าทำได้ ก่อน 22 นาฬิกา)", "en": "Houses: yellow food-waste bag (음식물 전용봉투), in the food-waste bin in front of your home (before 22:00 if possible)", "ru": "Частный дом: в жёлтый пакет для пищевых отходов (음식물 전용봉투), затем в бак перед домом (по возможности до 22:00)", "vi": "Nhà riêng: cho vào túi rác thức ăn màu vàng (음식물 전용봉투), bỏ vào thùng rác thức ăn, để trước nhà (nên để ra trước 22 giờ)", "ja": "一戸建て：黄色の生ごみ専用袋（음식물 전용봉투）に入れ、生ごみ容器で自宅前へ（なるべく22:00前）", "zh": "独栋住宅：装入黄色厨余专用袋（음식물 전용봉투），放进厨余桶放在家门前（尽量22:00前）", "mn": "Хувийн байшин: шар өнгийн хүнсний хаягдлын уутанд (음식물 전용봉투) хийж, хогийн саванд хийн үүдэнд (боломжтой бол 22:00-аас өмнө)", "tw": "獨棟住宅：裝入黃色廚餘專用袋（음식물 전용봉투），放進廚餘桶放在家門前（儘量2 , "id": "Lapor online di sdm.go.kr atau telepon perusahaan pengangkut → tempel bukti lapor (신고필증), lalu keluarkan", "th": "แจ้งออนไลน์ที่ sdm.go.kr หรือโทรหาบริษัทเก็บขยะ → ติดใบรับแจ้ง (신고필증) แล้วนำออกไปวาง", "en": "Report online at sdm.go.kr or call the contractor (대행업체) → attach the certificate sticker (신고필증) and put it out", "ru": "Онлайн-заявка на sdm.go.kr или звонок подрядчику → приклейте квитанцию (신고필증) и выносите", "vi": "Khai báo online ở sdm.go.kr hoặc gọi công ty thu gom → dán giấy xác nhận khai báo (신고필증) rồi để ra", "ja": "sdm.go.kr でオンライン申告、または代行業者（대행업체）へ電話 → 申告済証シール（신고필증）を貼って出す", "zh": "在 sdm.go.kr 网上申报或打电话给代理公司（대행업체）→ 贴上申报证贴纸（신고필증）后排放", "mn": "sdm.go.kr-аар онлайн бүртгүүлэх эсвэл гэрээт компани руу утасдах → бүртгэлийн баримт (신고필증) нааж гаргана", "tw": "在 sdm.go.kr 網上申報或打電話給代理公司（대행업체）→ 貼上申報證貼紙（신고필증）後排放"}, "notes": {"ko": "투명페트병은 비우고 라벨 떼고 눌러서 따로. 비닐은 비닐끼리 투명 봉투에", "id": "Botol PET bening: kosongkan, lepas label, tekan sampai gepeng, pisahkan. Plastik (비닐) dikumpulkan dengan plastik, masukkan ke kantong bening", "th": "ขวด PET ใส: เทให้หมด แกะฉลาก บีบให้แบน แยกไว้ ถุงพลาสติก (비닐) รวมกับถุงพลาสติก ใส่ถุงใส", "en": "Clear PET bottles (투명페트병): empty, remove the label, crush, put out separately. Plastic film (비닐) only with other film, in a clear bag", "ru": "Прозрачные ПЭТ-бутылки (투명페트병): опустошить, снять этикетку, смять, сдавать отдельно. Плёнку (비닐) — только с плёнкой, в прозрачный пакет", "vi": "Chai PET trong suốt: đổ hết, bóc nhãn, bóp dẹt, để riêng. Ni lông gom chung với ni lông, cho vào túi trong suốt", "ja": "透明ペットボトル（투명페트병）は中を空にし、ラベルをはがしてつぶし、分けて出す。ビニール（비닐）はビニールだけで透明な袋へ", "zh": "透明PET瓶（투명페트병）：倒空、撕掉标签、压扁，单独放。塑料膜（비닐）只和塑料膜一起装透明袋", "mn": "Тунгалаг ПЭТ сав (투명페트병): хоосолж, шошгыг хуулж, дараад тусад нь. Гялгар уутыг (비닐) зөвхөн гялгар ууттай хамт тунгалаг уутанд", "tw": "透明PET瓶（투명페트병）：倒空、撕掉標籤、壓扁，單獨放。塑膠膜（비닐）只和塑膠膜一起裝透明袋"}, "days": {"ko": "동마다 다름. 월·수·금: 천연·홍제1·2·3·홍은2·남가좌1·2·북가좌1동 등 / 화·목·일: 북아현·연희·홍은1·북가좌2동, 신촌동(창천) 등", "id": "Beda-beda menurut dong (동). Senin·Rabu·Jumat: Cheonyeon, Hongje 1·2·3, Hongeun 2, Namgajwa 1·2, Bukgajwa 1-dong, dll. / Selasa·Kamis·Minggu: Bukahyeon, Yeonhui, Hongeun 1, Bukgajwa 2-dong, Sinchon-dong (Changcheon), dll.", "th": "แต่ละตำบล (동) ไม่เหมือนกัน จันทร์·พุธ·ศุกร์: Cheonyeon, Hongje 1·2·3, Hongeun 2, Namgajwa 1·2, Bukgajwa 1-dong ฯลฯ / อังคาร·พฤหัสบดี·อาทิตย์: Bukahyeon, Yeonhui, Hongeun 1, Bukgajwa 2-dong, Sinchon-dong (Changcheon) ฯลฯ", "en": "Depends on the neighborhood (동). Mon·Wed·Fri: Cheonyeon, Hongje 1·2·3, Hongeun 2, Namgajwa 1·2, Bukgajwa 1-dong, etc. / Tue·Thu·Sun: Bukahyeon, Yeonhui, Hongeun 1, Bukgajwa 2-dong, Sinchon-dong (Changcheon), etc.", "ru": "Зависит от района (동). Пн, ср, пт: Чхоннён, Хонджэ-1·2·3, Хоным-2, Намгаджва-1·2, Пукгаджва-1-дон и др. (천연·홍제1·2·3·홍은2·남가좌1·2·북가좌1동) / Вт, чт, вс: Пуканхён, Ёнхи, Хоным-1, Пукгаджва-2-дон, Синчхон-дон (Чханчхон) и др. (북아현·연희·홍은1·북가좌2동, 신촌동(창천))", "vi": "Khác nhau theo từng phường (동). Thứ 2·Thứ 4·Thứ 6: Cheonyeon, Hongje 1·2·3, Hongeun 2, Namgajwa 1·2, Bukgajwa 1-dong, v.v. / Thứ 3·Thứ 5·CN: Bukahyeon, Yeonhui, Hongeun 1, Bukgajwa 2-dong, Sinchon-dong (Changcheon), v.v.", "ja": "洞（동）ごとに違う。月・水・金：天然・弘済1・2・3・弘恩2・南加佐1・2・北加佐1洞など / 火・木・日：北阿峴・延禧・弘恩1・北加佐2洞、新村洞（滄川）など", "zh": "各洞（동）不同。周一·三·五：天然·弘济1·2·3·弘恩2·南加佐1·2·北加佐1洞等 / 周二·四·日：北阿岘·延禧·弘恩1·北加佐2洞、新村洞（沧川）等", "mn": "Хороо (동) бүрээр өөр. Даваа·Лхагва·Баасан: Чонён, Хунжэ-1·2·3, Хунын-2, Намгажва-1·2, Бүггажва-1-дон гэх мэт (천연·홍제1·2·3·홍은2·남가좌1·2·북가좌1동) / Мягмар·Пүрэв·Ням: Бугахён, Ёнхи, Хунын-1, Бүггажва-2-дон, Шинчон-дон (Чанчон) гэх мэт (북아현·연희·홍은1·북가좌2동, 신촌동(창천))", "tw": "各洞（동）不同。週一·三·五：天然·弘濟1·2·3·弘恩2·南加佐1·2·北加佐1洞等 / 週二·四·日：北阿峴·延禧·弘恩1·北加佐2洞、新村洞（滄川）等"}}, "url": "https://www.sdm.go.kr/civil/type/ceanup/info.do", "checked": "2026-10-24"}, {"id": "seoul-seocho", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "서초구", "id": "Seocho-gu", "th": "Seocho-gu", "en": "Seocho-gu", "ru": "Сеул, Сочхо-гу", "vi": "Seocho-gu", "ja": "瑞草区（ソチョ）", "zh": "瑞草区", "mn": "Сөүл, Сочо-гу", "tw": "瑞草區"}, "f": {"hours": {"ko": "18시~다음날 1시 (가로변 건물·점포·상가는 22시부터)", "id": "18:00~01:00 dini hari berikutnya (gedung, toko, pertokoan di pinggir jalan: mulai 22:00)", "th": "18:00~01:00 ของวันถัดไป (อาคาร ร้านค้า ย่านการค้าริมถนน: ตั้งแต่ 22:00)", "en": "18:00–01:00 next day (buildings, shops and stores on main roads: from 22:00)", "ru": "18:00~01:00 следующего дня (здания, магазины и торговые здания у дороги — с 22:00)", "vi": "18:00~01:00 sáng hôm sau (tòa nhà, cửa hàng ven đường lớn: từ 22:00)", "ja": "18:00〜翌01:00（通り沿いの建物・店舗・商店街は22:00から）", "zh": "18:00–次日01:00（路边的建筑·店铺·商铺22:00起）", "mn": "18:00~маргааш нь 01:00 (замын дагуух барилга, дэлгүүр, худалдааны төв — 22:00-аас)", "tw": "18:00–次日01:00（路邊的建築·店鋪·商鋪22:00起）"}, "place": {"ko": "내 집 앞, 내 점포 앞", "id": "Di depan rumah, di depan toko Anda", "th": "หน้าบ้าน หน้าร้านของคุณ", "en": "In front of your own home or shop", "ru": "Перед своим домом, перед своим магазином", "vi": "Trước nhà, trước cửa hàng của bạn", "ja": "自宅の前、店舗の前", "zh": "自家门前、自家店铺门前", "mn": "Өөрийн байрны үүдэнд, өөрийн дэлгүүрийн үүдэнд", "tw": "自家門前、自家店鋪門前"}, "food": {"ko": "이물질 빼고 물기 꽉 짜서 음식물 전용봉투에 담아 수거용기에 배출. RFID 공동주택은 상시 배출", "id": "Buang benda asing, peras air sampai kering, masukkan ke kantong khusus sampah makanan (음식물 전용봉투), lalu ke wadah pengumpulan. Apartemen/rumah susun dengan RFID: kapan saja", "th": "เอาสิ่งแปลกปลอมออก บีบน้ำออกให้แห้ง ใส่ถุงขยะเศษอาหารเฉพาะ (음식물 전용봉투) แล้วใส่ถังเก็บขยะ อพาร์ตเมนต์/อาคารชุดที่มี RFID ทิ้งได้ตลอดเวลา", "en": "Remove foreign objects, squeeze out the water, put it in a food-waste bag (음식물 전용봉투), then in the collection bin. Apartments with RFID: any time", "ru": "Уберите посторонние предметы, хорошо отожмите воду, положите в специальный пакет для пищевых отходов и в контейнер. Многоквартирные дома с RFID — в любое время", "vi": "Bỏ tạp chất, vắt thật ráo nước, cho vào túi rác thức ăn chuyên dụng (음식물 전용봉투), bỏ vào thùng thu gom. Chung cư có RFID: bỏ bất cứ lúc nào", "ja": "異物を取り除き、水気をしっかり絞って生ごみ専用袋（음식물 전용봉투）に入れ、回収容器へ。RFIDの共同住宅はいつでも出せる", "zh": "去掉杂物、拧干水分，装入厨余专用袋（음식물 전용봉투），放进回收桶。有RFID的公寓随时可扔", "mn": "Хольцыг нь гаргаж усыг сайн шахаад хүнсний хогийн тусгай уутанд хийн саванд гаргана. RFID-тай орон сууц — хүссэн үедээ", "tw": "去掉雜物、擰乾水分，裝入廚餘專用袋（음식물 전용봉투），放進回收桶。有RFID的公寓隨時可扔"}, "bags": {"ko": "근처 마트, 편의점 등 종량제 봉투 판매소", "id": "Toko penjual kantong sampah berbayar (종량제 봉투) seperti supermarket, minimarket terdekat", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제 봉투) เช่น ซูเปอร์มาร์เก็ต ร้านสะดวกซื้อใกล้บ้าน", "en": "Pay-as-you-throw bag shops such as nearby supermarkets and convenience stores", "ru": "Ближайшие пункты продажи платных пакетов (종량제 봉투): супермаркеты, магазины у дома (편의점) и др.", "vi": "Nơi bán túi rác có trả phí (종량제 봉투) như siêu thị, cửa hàng tiện lợi gần nhà", "ja": "近くのスーパー、コンビニなど従量制袋（종량제 봉투）の販売店", "zh": "附近超市、便利店等计量收费袋销售处", "mn": "Ойролцоох супермаркет, дэлгүүр (편의점) зэрэг төлбөртэй уут (종량제 봉투) зардаг газар", "tw": "附近超市、便利店等計量收費袋銷售處"}, "bulky": {"ko": "지역 수거업체 전화, 구청 홈페이지 온라인 신청(seocho.go.kr) 또는 빼기 앱", "id": "Telepon perusahaan pengumpul setempat, daftar online di situs kantor gu (seocho.go.kr), atau aplikasi 빼기 (Bbegi)", "th": "โทรหาบริษัทเก็บขยะในพื้นที่ ยื่นขอออนไลน์บนเว็บไซต์สำนักงานเขต (seocho.go.kr) หรือแอป 빼기 (Bbegi)", "en": "Call the local collection company, apply online on the district website (seocho.go.kr), or use the 'Bbegi' (빼기) app", "ru": "Звонок в местную компанию по вывозу, онлайн-заявка на сайте администрации района (구청) (seocho.go.kr) или приложение «빼기»", "vi": "Gọi công ty thu gom của khu vực, đăng ký online trên trang web của quận (seocho.go.kr) hoặc ứng dụng '빼기' (Bbegi)", "ja": "地域の回収業者に電話、区役所ホームページでオンライン申請（seocho.go.kr）、または「빼기」（ペギ）アプリ", "zh": "打电话给当地收运公司、在区厅网站网上申请（seocho.go.kr），或用“빼기”App", "mn": "Нутгийн хог ачих компанид утсаар, дүүргийн захиргааны (구청) сайтаар онлайн (seocho.go.kr) эсвэл «빼기» апп", "tw": "打電話給當地收運公司、在區廳網站網上申請（seocho.go.kr），或用“빼기”App"}, "notes": {"ko": "재활용품은 속이 보이는 투명 봉투에 종류별로. 배출시간 외엔 건물 안에 보관", "id": "Daur ulang dimasukkan ke kantong bening yang isinya kelihatan, dipisah per jenis. Di luar jam buang, simpan di dalam gedung", "th": "ขยะรีไซเคิลใส่ถุงใสที่มองเห็นข้างใน แยกตามประเภท นอกเวลาทิ้งให้เก็บไว้ในอาคาร", "en": "Recycling in a see-through clear bag, sorted by type. Outside disposal hours, keep it inside the building", "ru": "Вторсырьё — по видам в прозрачный пакет, чтобы было видно содержимое. Вне часов выноса храните в здании", "vi": "Rác tái chế cho vào túi trong suốt nhìn thấy bên trong, chia theo loại. Ngoài giờ bỏ rác thì để trong nhà", "ja": "資源ごみは中が見える透明な袋に種類別に。排出時間以外は建物の中に保管", "zh": "可回收物按种类装入看得见里面的透明袋。不在排放时间时请放在建筑物内", "mn": "Дахин боловсруулах хогийг дотор нь харагдах тунгалаг уутанд төрлөөр нь. Гаргах цагаас бусад үед барилга дотроо хадгална", "tw": "可回收物按種類裝入看得見裡面的透明袋。不在排放時間時請放在建築物內"}, "days": {"ko": "일반쓰레기·재활용: 동별 격일(일·화·목 또는 월·수·금). 음식물: 매일 · 토요일, 공휴일 전날 (모든 쓰레기 배출 금지)", "id": "Sampah umum dan daur ulang: selang sehari, beda tiap kelurahan (Minggu·Selasa·Kamis atau Senin·Rabu·Jumat). Sampah makanan: setiap hari · Sabtu, sehari sebelum hari libur (semua sampah dilarang)", "th": "ขยะทั่วไปและขยะรีไซเคิล: วันเว้นวัน แตกต่างตามแขวง (อาทิตย์·อังคาร·พฤหัสบดี หรือ จันทร์·พุธ·ศุกร์) ขยะเศษอาหาร: ทุกวัน · วันเสาร์ วันก่อนวันหยุดราชการ (ห้ามทิ้งขยะทุกประเภท)", "en": "General waste and recycling: every other day depending on the dong (Sun·Tue·Thu or Mon·Wed·Fri). Food waste: every day · Saturday, the day before a public holiday (no waste of any kind)", "ru": "Обычный мусор и вторсырьё: через день, по районам (вс, вт, чт или пн, ср, пт). Пищевые отходы: каждый день · Суббота, день перед праздником (никакой мусор не выносить)", "vi": "Rác thường, rác tái chế: cách ngày theo phường (동) (CN·Thứ 3·Thứ 5 hoặc Thứ 2·Thứ 4·Thứ 6). Rác thức ăn: mỗi ngày · Thứ 7, ngày trước ngày lễ (cấm bỏ mọi loại rác)", "ja": "一般ごみ・資源ごみ：洞（동）ごとに1日おき（日・火・木 または 月・水・金）。生ごみ：毎日 · 土
