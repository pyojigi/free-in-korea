"zh": "一般·厨余：按洞为周一·三·五 或 周二·四·日 / 可回收物：周四只收透明PET瓶和塑料膜，其他在周日·一·二·三·五 · 周六不是排放日。违反罚款10万韩元", "mn": "Энгийн ба хүнсний хог: хорооноос хамаарч Да·Лх·Ба эсвэл Мя·Пү·Ня / Дахин боловсруулах: Пүрэв гарагт зөвхөн тунгалаг PET сав ба гялгар уут, бусдыг Ня·Да·Мя·Лх·Ба · Бямба гараг хог гаргах өдөр биш. Зөрчвөл 100,000 воны торгууль", "tw": "一般·廚餘：按洞為週一·三·五 或 週二·四·日 / 可回收物：週四只收透明PET瓶和塑膠膜，其他在週日·一·二·三·五 · 週六不是排放日。違反罰款10萬韓元"}}, "url": "https://www.sd.go.kr/main/contents.do?key=1674", "checked": "2026-10-24"}, {"id": "seoul-seongbuk", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "성북구", "id": "Seongbuk-gu", "th": "Seongbuk-gu", "en": "Seongbuk-gu", "ru": "Сеул, Сонбук-гу", "vi": "Seongbuk-gu", "ja": "城北区（ソンブク）", "zh": "城北区", "mn": "Сөүл, Сонбүг-гу", "tw": "城北區"}, "f": {"hours": {"ko": "18시~20시", "id": "18:00~20:00", "th": "18:00~20:00", "en": "18:00–20:00", "ru": "18:00~20:00", "vi": "18:00~20:00", "ja": "18:00〜20:00", "zh": "18:00–20:00", "mn": "18:00~20:00", "tw": "18:00–20:00"}, "place": {"ko": "내 집, 내 점포 앞", "id": "Di depan rumah atau toko Anda", "th": "หน้าบ้านหรือหน้าร้านของคุณ", "en": "In front of your own home or shop", "ru": "Перед своим домом или магазином", "vi": "Trước nhà, cửa hàng của bạn", "ja": "自宅・店舗の前", "zh": "自家、自家店铺门前", "mn": "Өөрийн байр, дэлгүүрийн үүдэнд", "tw": "自家、自家店鋪門前"}, "food": {"ko": "음식물 종량제봉투에 담아 배출 (공동주택은 전용용기)", "id": "Masukkan ke kantong sampah makanan berbayar (음식물 종량제봉투), lalu keluarkan (apartemen/rumah susun: wadah khusus)", "th": "ใส่ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제봉투) แล้วนำออกไปวาง (อพาร์ตเมนต์/อาคารชุด: ถังเฉพาะ)", "en": "Put it in a food-waste pay-as-you-throw bag (음식물 종량제봉투) (apartments: special bins)", "ru": "В платный пакет для пищевых отходов (음식물 종량제 봉투) (многоквартирные дома — спец. контейнер)", "vi": "Cho vào túi rác thức ăn có trả phí (음식물 종량제봉투) rồi để ra (chung cư: thùng chuyên dụng)", "ja": "生ごみ用の従量制袋（음식물 종량제봉투）に入れて出す（共同住宅は専用容器）", "zh": "装入厨余计量收费袋（음식물 종량제봉투）排放（公寓用专用桶）", "mn": "Хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투)-д хийж гаргана (орон сууц — тусгай сав)", "tw": "裝入廚餘計量收費袋（음식물 종량제봉투）排放（公寓用專用桶）"}, "bags": {"ko": "종량제봉투 판매소 (특수마대도 판매소에서 구입)", "id": "Toko penjual kantong sampah berbayar (종량제봉투) (karung khusus (특수마대) juga dibeli di sana)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (กระสอบพิเศษ (특수마대) ก็ซื้อที่ร้านเดียวกัน)", "en": "Pay-as-you-throw bag shops (special sacks 특수마대 are also sold there)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (спец. мешки (특수마대) тоже там)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) (bao tải đặc biệt (특수마대) cũng mua ở đây)", "ja": "従量制袋（종량제봉투）の販売店（特殊麻袋（특수마대）も販売店で購入）", "zh": "计量收费袋销售处（特殊麻袋 특수마대 也在销售处买）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (тусгай шуудай (특수마대)-г ч тэндээс)", "tw": "計量收費袋銷售處（特殊麻袋 특수마대 也在銷售處買）"}, "bulky": {"ko": "대행업체 전화(천일에너지 1866-0554) 또는 인터넷 신고(smartclean.sb.go.kr) 후 배출", "id": "Telepon perusahaan pengumpul (Cheonil Energy 1866-0554) atau lapor online (smartclean.sb.go.kr), lalu keluarkan", "th": "โทรหาบริษัทเก็บขยะ (Cheonil Energy 1866-0554) หรือแจ้งออนไลน์ (smartclean.sb.go.kr) แล้วจึงนำออกไปวาง", "en": "Call the contractor (Cheonil Energy 천일에너지, 1866-0554) or report online (smartclean.sb.go.kr), then put it out", "ru": "Звонок в компанию по вывозу (천일에너지 1866-0554) или заявка через интернет (smartclean.sb.go.kr), затем вынос", "vi": "Gọi công ty thu gom (Cheonil Energy (천일에너지) 1866-0554) hoặc khai báo online (smartclean.sb.go.kr), rồi để ra", "ja": "代行業者に電話（チョニル・エナジー（천일에너지）1866-0554）、またはインターネットで申告（smartclean.sb.go.kr）してから出す", "zh": "打电话给代理公司（天一能源 천일에너지 1866-0554）或网上申报（smartclean.sb.go.kr）后排放", "mn": "Хог ачих компанид утсаар (천일에너지 1866-0554) эсвэл интернетээр (smartclean.sb.go.kr) мэдэгдээд гаргана", "tw": "打電話給代理公司（天一能源 천일에너지 1866-0554）或網上申報（smartclean.sb.go.kr）後排放"}, "notes": {"ko": "재활용품은 투명한 봉투에 담거나 끈으로 묶어 배출. 의류·침구류·불연성은 특수마대", "id": "Daur ulang dimasukkan ke kantong bening atau diikat tali. Pakaian, selimut/seprai, sampah tidak bisa dibakar: ke karung khusus (특수마대)", "th": "ขยะรีไซเคิลใส่ถุงใสหรือมัดด้วยเชือก เสื้อผ้า เครื่องนอน ขยะที่เผาไม่ได้ ใส่กระสอบพิเศษ (특수마대)", "en": "Put recycling in a clear bag or tie it with string. Clothes, bedding and non-burnable waste: special sack (특수마대)", "ru": "Вторсырьё — в прозрачный пакет или связать верёвкой. Одежду, постельное бельё, негорючий мусор — в спец. мешок (특수마대)", "vi": "Rác tái chế cho vào túi trong suốt hoặc buộc bằng dây. Quần áo, chăn gối, rác không cháy: bao tải đặc biệt (특수마대)", "ja": "資源ごみは透明な袋に入れるか、ひもで束ねて出す。衣類・寝具・燃えないごみは特殊麻袋（특수마대）", "zh": "可回收物装透明袋或用绳子捆好排放。衣物·寝具·不可燃垃圾装特殊麻袋（특수마대）", "mn": "Дахин боловсруулах хогийг тунгалаг уутанд хийх эсвэл утсаар боож гаргана. Хувцас, ор дэрний хэрэглэл, шатдаггүй хог — тусгай шуудайнд (특수마대)", "tw": "可回收物裝透明袋或用繩子捆好排放。衣物·寢具·不可燃垃圾裝特殊麻袋（특수마대）"}, "days": {"ko": "동별로 다름: 월·수·금 또는 화·목·일 (일부 동 재활용은 일~금). 동별 일정표 확인 · 토요일 저녁, 주중 공휴일 전날 저녁 (배출 자제)", "id": "Beda tiap kelurahan: Senin·Rabu·Jumat atau Selasa·Kamis·Minggu (daur ulang di beberapa kelurahan Minggu~Jumat). Cek jadwal tiap kelurahan · Sabtu malam, malam sebelum hari libur di hari kerja (sebaiknya jangan buang)", "th": "แตกต่างตามแขวง: จันทร์·พุธ·ศุกร์ หรือ อังคาร·พฤหัสบดี·อาทิตย์ (ขยะรีไซเคิลบางแขวง อาทิตย์~ศุกร์) ดูตารางของแต่ละแขวง · เย็นวันเสาร์ เย็นวันก่อนวันหยุดราชการในวันธรรมดา (ควรงดทิ้ง)", "en": "Depends on the dong: Mon·Wed·Fri or Tue·Thu·Sun (recycling in some dongs: Sun–Fri). Check your dong's schedule · Saturday evening, the evening before a weekday public holiday (please do not put waste out)", "ru": "Разное по районам (дон): пн, ср, пт или вт, чт, вс (в некоторых дон вторсырьё — вс~пт). Смотрите расписание своего дон · Вечер субботы, вечер перед праздником в будний день (лучше не выносить)", "vi": "Khác nhau theo phường (동): Thứ 2·Thứ 4·Thứ 6 hoặc Thứ 3·Thứ 5·CN (một số phường: rác tái chế CN ~ Thứ 6). Xem lịch của từng phường · Tối Thứ 7, tối ngày trước ngày lễ rơi vào ngày thường (hạn chế bỏ rác)", "ja": "洞（동）ごとに違う：月・水・金 または 火・木・日（一部の洞の資源ごみは日〜金）。洞ごとの日程表を確認 · 土曜の夜、平日にある祝日の前日の夜（出すのを控える）", "zh": "按洞不同：周一·三·五或周二·四·日（部分洞的可回收物为周日至周五）。请看各洞日程表 · 周六晚上、平日公休日的前一天晚上（请尽量不要扔）", "mn": "Хороо (дон)-оос хамаарна: Даваа·Лхагва·Баасан эсвэл Мягмар·Пүрэв·Ням (зарим хорооны дахин боловсруулах хог Ням~Баасан). Хорооныхоо хуваарийг шалгана уу · Бямба гарагийн орой, ажлын өдөр тохиолдох баярын өмнөх орой (гаргахгүй байхыг хүснэ)", "tw": "按洞不同：週一·三·五或週二·四·日（部分洞的可回收物為週日至週五）。請看各洞日程表 · 週六晚上、平日公休日的前一天晚上（請儘量不要扔）"}}, "url": "https://www.sb.go.kr/www/selectBbsNttView.do?key=5927&bbsNo=91&nttNo=9502164", "checked": "2026-10-25"}, {"id": "seoul-songpa", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "송파구", "id": "Songpa-gu", "th": "Songpa-gu", "en": "Songpa-gu", "ru": "Сеул, Сонпха-гу", "vi": "Songpa-gu", "ja": "松坡区（ソンパ）", "zh": "松坡区", "mn": "Сөүл, Сонпа-гу", "tw": "松坡區"}, "f": {"hours": {"ko": "해가 진 후 (일반주택 음식물은 18시~22시)", "id": "Setelah matahari terbenam (sampah makanan rumah biasa: 18:00~22:00)", "th": "หลังพระอาทิตย์ตก (ขยะเศษอาหารของบ้านทั่วไป: 18:00~22:00)", "en": "After sunset (food waste from houses: 18:00–22:00)", "ru": "После заката (пищевые отходы из частных домов: 18:00~22:00)", "vi": "Sau khi mặt trời lặn (rác thức ăn của nhà riêng: 18:00~22:00)", "ja": "日没後（一般住宅の生ごみは18:00〜22:00）", "zh": "日落后（独栋住宅厨余18:00–22:00）", "mn": "Нар жаргасны дараа (хувийн байшингийн хүнсний хог 18:00~22:00)", "tw": "日落後（獨棟住宅廚餘18:00–22:00）"}, "place": {"ko": "내 집 대문 앞(지정된 장소)", "id": "Di depan pintu gerbang rumah Anda (tempat yang ditentukan)", "th": "หน้าประตูรั้วบ้านของคุณ (จุดที่กำหนด)", "en": "In front of your own gate (designated spot)", "ru": "Перед воротами своего дома (назначенное место)", "vi": "Trước cổng nhà bạn (nơi được chỉ định)", "ja": "自宅の門の前（決められた場所）", "zh": "自家大门前（指定地点）", "mn": "Өөрийн байрны хаалганы өмнө (заасан газар)", "tw": "自家大門前（指定地點）"}, "food": {"ko": "일반주택은 음식물 종량제봉투에 담아 전용용기에 배출 또는 RFID 종량기. 공동주택은 RFID 종량기", "id": "Rumah biasa: masukkan ke kantong sampah makanan berbayar (음식물 종량제봉투), lalu ke wadah khusus, atau mesin timbang RFID. Apartemen/rumah susun: mesin timbang RFID", "th": "บ้านทั่วไป: ใส่ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제봉투) แล้วใส่ถังเฉพาะ หรือเครื่องชั่ง RFID อพาร์ตเมนต์/อาคารชุด: เครื่องชั่ง RFID", "en": "Houses: food-waste pay-as-you-throw bag (음식물 종량제봉투) in the special bin, or an RFID machine. Apartments: RFID machine", "ru": "Частные дома: в платный пакет для пищевых отходов (음식물 종량제 봉투) и в спец. контейнер, или RFID-устройство. Многоквартирные дома: RFID-устройство", "vi": "Nhà riêng: cho vào túi rác thức ăn có trả phí (음식물 종량제봉투), bỏ vào thùng chuyên dụng, hoặc máy cân RFID. Chung cư (공동주택): máy cân RFID", "ja": "一般住宅は生ごみ用の従量制袋（음식물 종량제봉투）に入れて専用容器へ、またはRFID計量機。共同住宅はRFID計量機", "zh": "独栋住宅：装入厨余计量收费袋（음식물 종량제봉투）放进专用桶，或用RFID称重机。公寓用RFID称重机", "mn": "Хувийн байшин: хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투) хийж тусгай саванд эсвэл RFID төхөөрөмж. Орон сууц: RFID төхөөрөмж", "tw": "獨棟住宅：裝入廚餘計量收費袋（음식물 종량제봉투）放進專用桶，或用RFID稱重機。公寓用RFID稱重機"}, "bags": {"ko": "종량제봉투 판매소 (구 홈페이지 동별 판매소 명단)", "id": "Toko penjual kantong sampah berbayar (종량제봉투) (daftar toko per kelurahan di situs kantor gu)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (รายชื่อร้านแต่ละแขวงบนเว็บไซต์สำนักงานเขต)", "en": "Pay-as-you-throw bag shops (list of shops by dong on the district website)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (список по дон на сайте района)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) (danh sách theo phường trên trang web của quận)", "ja": "従量制袋（종량제봉투）の販売店（区ホームページに洞ごとの販売店リスト）", "zh": "计量收费袋销售处（区网站有各洞销售处名单）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (дүүргийн сайт дахь хорооны жагсаалт)", "tw": "計量收費袋銷售處（區網站有各洞銷售處名單）"}, "bulky": {"ko": "스마트클린 송파(smartclean.songpa.go.kr) 인터넷 신고, 빼기 앱, 또는 청소대행업체 전화", "id": "Lapor online di Smart Clean Songpa (smartclean.songpa.go.kr), aplikasi 빼기 (Bbegi), atau telepon perusahaan kebersihan", "th": "แจ้งออนไลน์ที่ Smart Clean Songpa (smartclean.songpa.go.kr) แอป 빼기 (Bbegi) หรือโทรหาบริษัทรักษาความสะอาด", "en": "Report online at Smart Clean Songpa (smartclean.songpa.go.kr), use the 'Bbegi' (빼기) app, or call the cleaning contractor", "ru": "Заявка через интернет «스마트클린 송파» (smartclean.songpa.go.kr), приложение «빼기» или звонок в компанию по уборке", "vi": "Khai báo online ở Smart Clean Songpa (스마트클린 송파, smartclean.songpa.go.kr), ứng dụng '빼기' (Bbegi), hoặc gọi công ty vệ sinh", "ja": "スマートクリーン松坡（스마트클린 송파、smartclean.songpa.go.kr）でネット申告、「빼기」（ペギ）アプリ、または清掃代行業者に電話", "zh": "在“Smart Clean 松坡”（smartclean.songpa.go.kr）网上申报、用“빼기”App，或打电话给清扫代理公司", "mn": "«스마트클린 송파» (smartclean.songpa.go.kr)-д интернетээр мэдэгдэх, «빼기» апп эсвэл цэвэрлэгээний компанид утсаар", "tw": "在“Smart Clean 松坡”（smartclean.songpa.go.kr）網上申報、用“빼기”App，或打電話給清掃代理公司"}, "notes": {"ko": "폐비닐·페트병은 동별로 금요일 또는 목요일, 기타 재활용은 월·수 또는 화·일. 낮에 내놓으면 과태료", "id": "Plastik dan botol PET: Jumat atau Kamis (beda tiap kelurahan), daur ulang lain Senin·Rabu atau Selasa·Minggu. Taruh di siang hari = denda (과태료)", "th": "ถุงพลาสติกและขวด PET: วันศุกร์หรือวันพฤหัสบดี (แตกต่างตามแขวง) ขยะรีไซเคิลอื่น จันทร์·พุธ หรือ อังคาร·อาทิตย์ ถ้าวางตอนกลางวันจะถูกปรับ (과태료)", "en": "Plastic film and PET bottles: Friday or Thursday depending on the dong. Other recycling: Mon·Wed or Tue·Sun. Putting it out in the daytime: fine (과태료)", "ru": "Плёнку и ПЭТ-бутылки — по дон в пятницу или четверг, другое вторсырьё — пн, ср или вт, вс. Если вынести днём — штраф", "vi": "Ni lông thải, chai PET: Thứ 6 hoặc Thứ 5 tùy phường. Rác tái chế khác: Thứ 2·Thứ 4 hoặc Thứ 3·CN. Để ra vào ban ngày sẽ bị phạt tiền (과태료)", "ja": "廃ビニール・ペットボトルは洞ごとに金曜または木曜、そのほかの資源ごみは月・水 または 火・日。昼に出すと過料（과태료）", "zh": "塑料膜·PET瓶按洞为周五或周四，其他可回收物周一·三或周二·日。白天拿出来会被罚款（과태료）", "mn": "Гялгар уут, ПЭТ савыг хороогоор Баасан эсвэл Пүрэв гарагт, бусад дахин боловсруулах хогийг Даваа·Лхагва эсвэл Мягмар·Ням гарагт. Өдөр гаргавал торгууль", "tw": "塑膠膜·PET瓶按洞為週五或週四，其他可回收物週一·三或週二·日。白天拿出來會被罰款（과태료）"}, "days": {"ko": "일반주택은 동별로 월·수·금 또는 화·목·일 (일반·음식물). 아파트 등은 매일 수거", "id": "Rumah biasa: beda tiap kelurahan, Senin·Rabu·Jumat atau Selasa·Kamis·Minggu (sampah umum dan makanan). Apartemen dll.: diambil setiap hari", "th": "บ้านทั่วไป: แตกต่างตามแขวง จันทร์·พุธ·ศุกร์ หรือ อังคาร·พฤหัสบดี·อาทิตย์ (ขยะทั่วไปและขยะเศษอาหาร) อพาร์ตเมนต์ ฯลฯ: เก็บทุกวัน", "en": "Houses: Mon·Wed·Fri or Tue·Thu·Sun depending on the dong (general and food waste). Apartments etc.: pickup every day", "ru": "Частные дома: по районам (дон) пн, ср, пт или вт, чт, вс (обычный мусор и пищевые отходы). Апарты и т. п.: вывоз каждый день", "vi": "Nhà riêng: theo phường, Thứ 2·Thứ 4·Thứ 6 hoặc Thứ 3·Thứ 5·CN (rác thường, rác thức ăn). Chung cư (아파트), v.v.: thu gom mỗi ngày", "ja": "一般住宅は洞（동）ごとに月・水・金 または 火・木・日（一般ごみ・生ごみ）。マンションなどは毎日回収", "zh": "独栋住宅按洞为周一·三·五或周二·四·日（一般垃圾·厨余）。公寓等每天收", "mn": "Хувийн байшин: хороо (дон) бүрээр Даваа·Лхагва·Баасан эсвэл Мягмар·Пүрэв·Ням (энгийн, хүнсний хог). Орон сууц гэх мэт: өдөр бүр ачна", "tw": "獨棟住宅按洞為週一·三·五或週二·四·日（一般垃圾·廚餘）。公寓等每天收"}}, "url": "https://www.songpa.go.kr/www/contents.do?key=3153", "checked": "2026-10-25"}, {"id": "seoul-yeongdeungpo", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "영등포구", "id": "Yeongdeungpo-gu", "th": "Yeongdeungpo-gu", "en": "Yeongdeungpo-gu", "ru": "Сеул, Ёндынпхо-гу", "vi": "Yeongdeungpo-gu", "ja": "永登浦区（ヨンドゥンポ）", "zh": "永登浦区", "mn": "Сөүл, Ёндынпо-гу", "tw": "永登浦區"}, "f": {"hours": {"ko": "20:00~24:00", "id": "20:00~24:00", "th": "20:00~24:00", "en": "20:00–24:00", "ru": "20:00~24:00", "vi": "20:00~24:00", "ja": "20:00〜24:00", "zh": "20:00–24:00", "mn": "20:00~24:00", "tw": "20:00–24:00"}, "place": {"ko": "주택: 내 집·점포 앞 / 아파트: 지정 배출장소", "id": "Rumah: di depan rumah, toko Anda / Apartemen (아파트): tempat buang sampah yang ditentukan", "th": "บ้านพัก: หน้าบ้าน หน้าร้านของคุณ / อพาร์ตเมนต์ (아파트): จุดทิ้ uang. Plastik hanya didaur ulang jika ada tanda pilah buang (분리배출 표시)", "th": "ขยะรีไซเคิลแยกตามประเภทแล้วทิ้ง ถุงพลาสติกรีไซเคิลได้เฉพาะที่มีสัญลักษณ์แยกทิ้ง (분리배출 표시)", "en": "Sort recycling by type. Plastic film is recycled only if it has the recycling mark (분리배출 표시)", "ru": "Вторсырьё сортируйте по видам. Плёнка идёт во вторсырьё, только если на ней есть знак раздельного сбора", "vi": "Rác tái chế phân loại theo từng loại rồi để ra. Ni lông chỉ tái chế loại có ký hiệu phân loại (분리배출 표시)", "ja": "資源ごみは種類別に分けて出す。ビニールは分別排出マーク（분리배출 표시）があるものだけリサイクル", "zh": "可回收物按种类分好排放。塑料膜只有带分类回收标志（분리배출 표시）的才回收", "mn": "Дахин боловсруулах хогийг төрлөөр нь ялгаж гаргана. Гялгар уутаас зөвхөн ялгах тэмдэгтэйг нь дахин боловсруулна", "tw": "可回收物按種類分好排放。塑膠膜只有帶分類回收標誌（분리배출 표시）的才回收"}, "days": {"ko": "동별로 다름: 월·수·금(불광2·응암1~3·역촌·신사1·진관) 또는 일·화·목(그 외 동)", "id": "Beda tiap kelurahan: Senin·Rabu·Jumat (Bulgwang 2, Eungam 1~3, Yeokchon, Sinsa 1, Jingwan) atau Minggu·Selasa·Kamis (kelurahan lain)", "th": "แตกต่างตามแขวง: จันทร์·พุธ·ศุกร์ (Bulgwang 2, Eungam 1~3, Yeokchon, Sinsa 1, Jingwan) หรือ อาทิตย์·อังคาร·พฤหัสบดี (แขวงอื่น)", "en": "Depends on the dong: Mon·Wed·Fri (Bulgwang 2, Eungam 1–3, Yeokchon, Sinsa 1, Jingwan) or Sun·Tue·Thu (other dongs)", "ru": "Разное по районам (дон): пн, ср, пт (Пульгван-2, Ынам-1~3, Ёкчхон, Синса-1, Чингван) или вс, вт, чт (другие дон)", "vi": "Khác nhau theo phường (동): Thứ 2·Thứ 4·Thứ 6 (Bulgwang 2, Eungam 1~3, Yeokchon, Sinsa 1, Jingwan) hoặc CN·Thứ 3·Thứ 5 (các phường khác)", "ja": "洞（동）ごとに違う：月・水・金（Bulgwang 2・Eungam 1〜3・Yeokchon・Sinsa 1・Jingwan）または 日・火・木（そのほかの洞）", "zh": "按洞不同：周一·三·五（佛光2洞·鹰岩1~3洞·驿村洞·新寺1洞·津宽洞）或周日·二·四（其他洞）", "mn": "Хороо (дон)-оос хамаарна: Даваа·Лхагва·Баасан (Булгван-2, Ынам-1~3, Ёгчон, Шинса-1, Жингван) эсвэл Ням·Мягмар·Пүрэв (бусад хороо)", "tw": "按洞不同：週一·三·五（佛光2洞·鷹巖1~3洞·驛村洞·新寺1洞·津寬洞）或週日·二·四（其他洞）"}}, "url": "https://www.ep.go.kr/www/contents.do?key=1239", "checked": "2026-10-25"}, {"id": "seoul-jongno", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "종로구", "id": "Jongno-gu", "th": "Jongno-gu", "en": "Jongno-gu", "ru": "Сеул, Чонно-гу", "vi": "Jongno-gu", "ja": "鍾路区（チョンノ）", "zh": "钟路区", "mn": "Сөүл, Жунно-гу", "tw": "鍾路區"}, "f": {"hours": {"ko": "주택가·이면도로 19:00~21:00 / 큰길가 22:00~다음날 01:00", "id": "Kawasan rumah, jalan kecil: 19:00~21:00 / Jalan besar: 22:00~01:00 dini hari berikutnya", "th": "ย่านบ้านพัก ถนนซอย: 19:00~21:00 / ถนนใหญ่: 22:00~01:00 ของวันถัดไป", "en": "Residential areas and back streets: 19:00–21:00 / Main roads: 22:00–01:00 (next day)", "ru": "Жилые улицы и переулки: 19:00~21:00 / Большие улицы: 22:00~01:00 следующего дня", "vi": "Khu nhà ở, đường nhỏ: 19:00~21:00 / Đường lớn: 22:00~01:00 sáng hôm sau", "ja": "住宅街・路地：19:00〜21:00 / 大通り沿い：22:00〜翌01:00", "zh": "住宅区·小巷：19:00–21:00 / 大马路边：22:00–次日01:00", "mn": "Орон сууцны гудамж, жижиг зам: 19:00~21:00 / Том замын дагуу: 22:00~маргааш нь 01:00", "tw": "住宅區·小巷：19:00–21:00 / 大馬路邊：22:00–次日01:00"}, "place": {"ko": "내 집·점포 앞 (일반·음식물·재활용을 정해진 요일·시간에 함께)", "id": "Di depan rumah atau toko Anda (sampah umum, sampah makanan, sampah daur ulang dikeluarkan bersama, pada hari dan jam yang ditentukan)", "th": "หน้าบ้านหรือหน้าร้านของคุณ (ขยะทั่วไป ขยะเศษอาหาร ขยะรีไซเคิล วางพร้อมกันตามวันและเวลาที่กำหนด)", "en": "In front of your own home or shop (general waste, food waste and recycling together, on the set days and times)", "ru": "Перед своим домом или магазином (обычный мусор, пищевые отходы и вторсырьё — вместе, в назначенные дни и часы)", "vi": "Trước nhà hoặc cửa hàng của bạn (rác thường, rác thức ăn, rác tái chế để ra cùng lúc, đúng ngày và giờ quy định)", "ja": "自宅・店舗の前（一般ごみ・生ごみ・資源ごみを、決められた曜日・時間にまとめて）", "zh": "自家或店铺门前（一般垃圾、厨余垃圾、可回收物在规定的日期和时间一起放）", "mn": "Өөрийн байр, дэлгүүрийн үүдэнд (энгийн хог, хүнсний хаягдал, дахин боловсруулах хогийг тогтсон өдөр, цагт хамт)", "tw": "自家或店鋪門前（一般垃圾、廚餘垃圾、可回收物在規定的日期和時間一起放）"}, "food": {"ko": "음식물 종량제 봉투(1·2·3·5L)에 담아 뚜껑 있는 음식물통에 넣어 집 앞에", "id": "Masukkan ke kantong sampah makanan berbayar (음식물 종량제 봉투) (1·2·3·5 L), lalu ke tong sampah makanan bertutup, taruh di depan rumah", "th": "ใส่ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제 봉투) (1·2·3·5 ลิตร) แล้วใส่ถังขยะเศษอาหารที่มีฝา วางหน้าบ้าน", "en": "Put it in a food-waste pay-as-you-throw bag (음식물 종량제 봉투) (1, 2, 3 or 5 L), then in a food-waste bin with a lid, in front of your home", "ru": "В платный пакет для пищевых отходов (음식물 종량제 봉투, 1·2·3·5 л), затем в бак с крышкой перед домом", "vi": "Cho vào túi rác thức ăn có trả phí (음식물 종량제 봉투) (1·2·3·5L), bỏ vào thùng rác thức ăn có nắp, để trước nhà", "ja": "生ごみ用の従量制袋（음식물 종량제 봉투）（1・2・3・5L）に入れ、ふた付きの生ごみ容器に入れて自宅前へ", "zh": "装入厨余计量收费袋（음식물 종량제 봉투）（1·2·3·5L），放进带盖的厨余桶，放在家门前", "mn": "Хүнсний хаягдлын төлбөртэй уутанд (음식물 종량제 봉투, 1·2·3·5 л) хийж, таглаатай хүнсний хогийн саванд хийн байрныхаа үүдэнд", "tw": "裝入廚餘計量收費袋（음식물 종량제 봉투）（1·2·3·5L），放進帶蓋的廚餘桶，放在家門前"}, "bags": {"ko": "가까운 편의점·슈퍼마켓", "id": "Minimarket (편의점), supermarket terdekat", "th": "ร้านสะดวกซื้อ ซูเปอร์มาร์เก็ตใกล้บ้าน", "en": "Nearby convenience stores and supermarkets", "ru": "Ближайший магазин у дома (편의점) или супермаркет", "vi": "Cửa hàng tiện lợi, siêu thị gần nhà", "ja": "近くのコンビニ・スーパー", "zh": "附近的便利店、超市", "mn": "Ойролцоох дэлгүүр (편의점), супермаркет", "tw": "附近的便利店、超市"}, "bulky": {"ko": "구청 홈페이지 대형생활폐기물 신청 또는 동주민센터 → 신고필증 붙여 배출", "id": "Daftar sampah besar (대형생활폐기물) di situs kantor gu (구청) atau di kantor kelurahan (동주민센터) → tempel bukti lapor (신고필증), lalu keluarkan", "th": "ยื่นขอทิ้งขยะชิ้นใหญ่ (대형생활폐기물) บนเว็บไซต์สำนักงานเขต (구청) หรือที่ศูนย์บริการชุมชน (동주민센터) → ติดใบรับแจ้ง (신고필증) แล้วจึงนำออกไปวาง", "en": "Apply for large household waste (대형생활폐기물) on the district office (구청) website or at the community center (동주민센터) → attach the certificate sticker (신고필증) and put it out", "ru": "Заявка на крупный мусор (대형생활폐기물) на сайте администрации района (구청) или в центре (동주민센터) → приклейте квитанцию (신고필증) и выносите", "vi": "Đăng ký rác cồng kềnh (대형생활폐기물) trên trang web của quận (구청) hoặc ở trung tâm phường (동주민센터) → dán giấy xác nhận khai báo (신고필증) rồi để ra", "ja": "区役所（구청）ホームページで大型生活ごみ（대형생활폐기물）を申請、または住民センター（동주민센터）で申請 → 申告済証シール（신고필증）を貼って出す", "zh": "在区厅（구청）网站申请大型生活垃圾（대형생활폐기물），或去洞居民中心（동주민센터）→ 贴上申报证贴纸（신고필증）后排放", "mn": "Дүүргийн захиргааны (구청) сайтаар том хог (대형생활폐기물) хүсэлт гаргах эсвэл хорооны төв (동주민센터) → бүртгэлийн баримт (신고필증) наагаад гаргана", "tw": "在區廳（구청）網站申請大型生活垃圾（대형생활폐기물），或去洞居民中心（동주민센터）→ 貼上申報證貼紙（신고필증）後排放"}, "notes": {"ko": "투명페트병: 라벨 떼고 눌러서 투명 봉투에, 목요일(일·화·목 지역) 또는 금요일(월·수·금 지역)", "id": "Botol PET bening (투명페트병): lepas label, tekan sampai gepeng, masukkan ke kantong bening. Hari Kamis (daerah Minggu·Selasa·Kamis) atau Jumat (daerah Senin·Rabu·Jumat)", "th": "ขวด PET ใส (투명페트병): แกะฉลากออก บีบให้แบน ใส่ถุงใส ทิ้งวันพฤหัสบดี (ย่านที่ทิ้ง อาทิตย์·อังคาร·พฤหัสบดี) หรือวันศุกร์ (ย่านที่ทิ้ง จันทร์·พุธ·ศุกร์)", "en": "Clear PET bottles (투명페트병): remove the label, crush, put in a clear bag. Thursday (Sun·Tue·Thu areas) or Friday (Mon·Wed·Fri areas)", "ru": "Прозрачные ПЭТ-бутылки (투명페트병): снять этикетку, смять, в прозрачный пакет. Четверг (районы вс·вт·чт) или пятница (районы пн·ср·пт)", "vi": "Chai PET trong suốt (투명페트병): bóc nhãn, bóp dẹt, cho vào túi trong suốt. Bỏ vào Thứ 5 (khu CN·Thứ 3·Thứ 5) hoặc Thứ 6 (khu Thứ 2·Thứ 4·Thứ 6)", "ja": "透明ペットボトル（투명페트병）：ラベルをはがしてつぶし、透明な袋へ。木曜（日・火・木の地域）または金曜（月・水・金の地域）", "zh": "透明PET瓶（투명페트병）：撕掉标签、压扁，装入透明袋。周四（周日·二·四地区）或周五（周一·三·五地区）", "mn": "Тунгалаг ПЭТ сав (투명페트병): шошгыг хуулж, дарж хавтгайлаад тунгалаг уутанд. Пүрэв гараг (Ням·Мягмар·Пүрэв бүс) эсвэл Баасан гараг (Даваа·Лхагва·Баасан бүс)", "tw": "透明PET瓶（투명페트병）：撕掉標籤、壓扁，裝入透明袋。週四（週日·二·四地區）或週五（週一·三·五地區）"}, "days": {"ko": "지번(주소)마다 다름(예: 일·화·목 또는 월·수·금). 구청 '배출일시 검색'에서 주소로 확인", "id": "Beda-beda menurut alamat (nomor tanah) (contoh: Minggu·Selasa·Kamis atau Senin·Rabu·Jumat). Cek dengan alamat di menu '배출일시 검색' (cari hari dan jam buang sampah) di situs kantor gu (구청)", "th": "แต่ละที่อยู่ (เลขที่ดิน) ไม่เหมือนกัน (เช่น อาทิตย์·อังคาร·พฤหัสบดี หรือ จันทร์·พุธ·ศุกร์) ค้นหาด้วยที่อยู่ได้ที่เมนู '배출일시 검색' (ค้นหาวันเวลาทิ้งขยะ) บนเว็บไซต์สำนักงานเขต (구청)", "en": "Depends on your lot address (지번) (e.g. Sun·Tue·Thu or Mon·Wed·Fri). Check by address with the district office's 'Disposal day search' (배출일시 검색)", "ru": "Зависит от адреса (например, вс, вт, чт или пн, ср, пт). Проверьте по адресу на сайте администрации района (구청), раздел «배출일시 검색»", "vi": "Khác nhau theo từng địa chỉ (số nhà) (ví dụ: CN·Thứ 3·Thứ 5 hoặc Thứ 2·Thứ 4·Thứ 6). Tra bằng địa chỉ ở mục '배출일시 검색' (tìm ngày giờ bỏ rác) trên trang web của quận (구청)", "ja": "地番（지번・住所）ごとに違う（例：日・火・木 または 月・水・金）。区役所の「排出日時検索」（배출일시 검색）で住所から確認", "zh": "按地址（地番 지번）不同（例：周日·二·四 或 周一·三·五）。在区厅网站“排放日期查询”（배출일시 검색）中用地址查询", "mn": "Хаягаас хамаарч өөр (жишээ нь: Ням·Мягмар·Пүрэв эсвэл Даваа·Лхагва·Баасан). Дүүргийн захиргааны (구청) сайтын «배출일시 검색» хэсэгт хаягаараа шалгана уу", "tw": "按地址（地番 지번）不同（例：週日·二·四 或 週一·三·五）。在區廳網站“排放日期查詢”（배출일시 검색）中用地址查詢"}}, "url": "https://www.jongno.go.kr/portal/garbage/selectWasteEmissionsList.do?menuId=110339&menuNo=110339", "checked": "2026-10-24"}, {"id": "seoul-jung", "sido": {"ko": "서울특별시", "id": "Seoul", "th": "โซล (Seoul)", "en": "Seoul", "ru": "Сеул", "vi": "Seoul", "ja": "ソウル特別市", "zh": "首尔特别市", "mn": "Сөүл", "tw": "首爾特別市"}, "name": {"ko": "중구", "id": "Jung-gu (Seoul)", "th": "Jung-gu (Seoul)", "en": "Jung-gu", "ru": "Сеул, Чун-гу", "vi": "Jung-gu (Seoul)", "ja": "中区（チュン）", "zh": "中区", "mn": "Сөүл, Жун-гу", "tw": "中區"}, "f": {"hours": {"ko": "주택가 19:00~24:00 / 큰길·관광특구 22:00~다음날 01:00", "id": "Kawasan rumah: 19:00~24:00 / Jalan besar, kawasan wisata khusus (관광특구): 22:00~01:00 dini hari berikutnya", "th": "ย่านบ้านพัก: 19:00~24:00 / ถนนใหญ่ เขตท่องเที่ยวพิเศษ (관광특구): 22:00~01:00 ของวันถัดไป", "en": "Residential areas: 19:00–24:00 / Main roads and special tourist zones (관광특구): 22:00–01:00 (next day)", "ru": "Жилые улицы: 19:00~24:00 / Большие улицы и туристическая зона: 22:00~01:00 сл 0:00, in a food-waste pay-as-you-throw bag (음식물 종량제봉투) inside the special collection bin (25L), in front of your home", "ru": "Частные дома: в назначенный день 18:00~20:00, в платном пакете для пищевых отходов (음식물 종량제 봉투), в спец. контейнере (25 л) перед домом", "vi": "Nhà riêng: vào ngày quy định, 18:00~20:00, cho vào túi rác thức ăn có trả phí (음식물 종량제봉투), bỏ vào thùng thu gom chuyên dụng (25L), để trước nhà", "ja": "一般住宅は決められた曜日の18:00〜20:00、生ごみ用の従量制袋（음식물 종량제봉투）に入れて専用回収容器（25L）で自宅前に出す", "zh": "独栋住宅：在指定日子18:00–20:00，装入厨余计量收费袋（음식물 종량제봉투），放进专用回收桶（25L）放在家门前", "mn": "Хувийн байшин: заасан өдөр 18~20 цагт хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투) хийж тусгай саваар (25 л) байрны үүдэнд", "tw": "獨棟住宅：在指定日子18:00–20:00，裝入廚餘計量收費袋（음식물 종량제봉투），放進專用回收桶（25L）放在家門前"}, "bags": {"ko": "종량제봉투 판매소 (음식점 납부필증도 같은 곳)", "id": "Toko penjual kantong sampah berbayar (종량제봉투) (stiker bukti bayar (납부필증) untuk restoran juga di sana)", "th": "ร้านขายถุงขยะแบบเสียเงิน (종량제봉투) (สติกเกอร์ชำระเงิน (납부필증) สำหรับร้านอาหารก็ที่เดียวกัน)", "en": "Pay-as-you-throw bag shops (payment stickers 납부필증 for restaurants are sold at the same place)", "ru": "Пункты продажи платных пакетов (종량제 봉투) (наклейки об оплате (납부필증) для ресторанов — там же)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) (tem đã trả phí (납부필증) cho nhà hàng cũng mua ở đây)", "ja": "従量制袋（종량제봉투）の販売店（飲食店用の納付済証（납부필증）も同じ店）", "zh": "计量收费袋销售处（餐馆用的缴费证 납부필증 也在同一处）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг газар (хоолны газрын төлбөрийн наалт (납부필증) ч тэнд)", "tw": "計量收費袋銷售處（餐館用的繳費證 납부필증 也在同一處）"}, "bulky": {"ko": "인터넷 신고센터(smartclean-jungnang.kr) 또는 수거업체 전화 신고 후 내 집 앞 배출", "id": "Pusat lapor online (smartclean-jungnang.kr) atau telepon perusahaan pengumpul, lalu taruh di depan rumah", "th": "ศูนย์แจ้งออนไลน์ (smartclean-jungnang.kr) หรือโทรแจ้งบริษัทเก็บขยะ แล้ววางหน้าบ้าน", "en": "Report at the online center (smartclean-jungnang.kr) or by phone to the collection company, then put it in front of your home", "ru": "Заявка через интернет (smartclean-jungnang.k бон-2, Мук-1·2, Синнэ-1·2) или вс, вт, чт (другие). Многоквартирные дома — дни комплекса", "vi": "Khác nhau theo phường (동): Thứ 2·Thứ 4·Thứ 6 (Mangu-bon, Myeonmok 3·8·5·7, Sangbong 2, Muk 1·2, Sinnae 1·2) hoặc CN·Thứ 3·Thứ 5 (các phường khác). Chung cư (공동주택): ngày do khu quy định", "ja": "洞（동）ごとに違う：月・水・金（Mangu-bon・Myeonmok 3・8・5・7・Sangbong 2・Muk 1・2・Sinnae 1・2）または 日・火・木（そのほか）。共同住宅は団地で決めた日", "zh": "按洞不同：周一·三·五（忘忧本洞·面牧3·8·5·7洞·上凤2洞·墨1·2洞·新内1·2洞）或周日·二·四（其他）。公寓按小区指定日", "mn": "Хороо (дон)-оос хамаарна: Даваа·Лхагва·Баасан (Мануубон, Мёнмог-3·8·5·7, Санбон-2, Мүг-1·2, Шиннэ-1·2) эсвэл Ням·Мягмар·Пүрэв (бусад). Орон сууц — хотхоны заасан өдөр", "tw": "按洞不同：週一·三·五（忘憂本洞·面牧3·8·5·7洞·上鳳2洞·墨1·2洞·新內1·2洞）或週日·二·四（其他）。公寓按小區指定日"}}, "url": "https://www.jungnang.go.kr/portal/main/contents.do?menuNo=200051", "checked": "2026-10-25"}, {"id": "incheon-gyeyang", "sido": {"ko": "인천광역시", "id": "Incheon", "th": "อินชอน (Incheon)", "en": "Incheon", "ru": "Инчхон", "vi": "Incheon", "ja": "仁川広域市", "zh": "仁川广域市", "mn": "Инчхон", "tw": "仁川廣域市"}, "name": {"ko": "계양구", "id": "Gyeyang-gu", "th": "Gyeyang-gu", "en": "Gyeyang-gu", "ru": "Инчхон, Кеян-гу", "vi": "Gyeyang-gu", "ja": "桂陽区（ケヤン）", "zh": "桂阳区", "mn": "Инчхон, Гэян-гу", "tw": "桂陽區"}, "f": {"hours": {"ko": "오후 8시~다음날 오전 3시", "id": "20:00~03:00 pagi berikutnya", "th": "20:00~03:00 ของวันถัดไป", "en": "20:00–03:00 next day", "ru": "20:00~03:00 следующего дня", "vi": "20:00~03:00 sáng hôm sau", "ja": "20:00〜翌03:00", "zh": "20:00–次日03:00", "mn": "20:00~маргааш нь 03:00", "tw": "20:00–次日03:00"}, "place": {"ko": "자기 집 대문 앞", "id": "Di depan pintu gerbang rumah sendiri", "th": "หน้าประตูรั้วบ้านของตัวเอง", "en": "In front of your own gate", "ru": "Перед воротами своего дома", "vi": "Trước cổng nhà bạn", "ja": "自宅の門の前", "zh": "自家大门前", "mn": "Өөрийн байрны хаалганы өмнө", "tw": "自家大門前"}, "food": {"ko": "20세대 이상 공동주택은 120ℓ 전용용기, 단독주택은 연두색 음식물 전용봉투", "id": "Apartemen/rumah susun 20 rumah tangga ke atas: wadah khusus 120 L. Rumah tunggal: kantong khusus sampah makanan warna hijau muda (음식물 전용봉투)", "th": "อพาร์ตเมนต์/อาคารชุด 20 ครัวเรือนขึ้นไป: ถังเฉพาะ 120 ลิตร บ้านเดี่ยว: ถุงขยะเศษอาหารเฉพาะสีเขียวอ่อน (음식물 전용봉투)", "en": "Apartments with 20+ households: 120L special bin. Houses: light-green food-waste bag (음식물 전용봉투)", "ru": "Многоквартирные дома от 20 квартир: спец. контейнер 120 л. Частные дома: светло-зелёный специальный пакет для пищевых отходов", "vi": "Chung cư (공동주택) từ 20 hộ trở lên: thùng chuyên dụng 120L. Nhà riêng: túi rác thức ăn chuyên dụng màu xanh nõn chuối (음식물 전용봉투)", "ja": "20世帯以上の共同住宅は120Lの専用容器、一戸建ては黄緑色の生ごみ専用袋（음식물 전용봉투）", "zh": "20户以上的公寓用120L专用桶，独栋住宅用浅绿色厨余专用袋（음식물 전용봉투）", "mn": "20-оос дээш айлтай орон сууц: 120 л тусгай сав. Хувийн байшин: цайвар ногоон хүнсний хогийн тусгай уут", "tw": "20戶以上的公寓用120L專用桶，獨棟住宅用淺綠色廚餘專用袋（음식물 전용봉투）"}, "bulky": {"ko": "판매소 스티커 부착 후 1555-0115 신고, 또는 구 홈페이지 인터넷 신고. 수거 전날 19시~자정 배출", "id": "Tempel stiker dari toko penjual, lalu lapor ke 1555-0115, atau lapor online di situs kantor gu. Keluarkan malam sebelum hari ambil 19:00~tengah malam", "th": "ติดสติกเกอร์จากร้านขาย แล้วแจ้งที่ 1555-0115 หรือแจ้งออนไลน์บนเว็บไซต์สำนักงานเขต นำออกไปวางเย็นวันก่อนวันเก็บ 19:00~เที่ยงคืน", "en": "Attach a sticker from a shop and report to 1555-0115, or report online on the district website. Put it out the day before pickup, 19:00–midnight", "ru": "Приклейте наклейку из пункта продажи и сообщите по 1555-0115, или заявка через интернет на сайте района. Выносить накануне вывоза 19:00~полночь", "vi": "Dán tem mua ở nơi bán rồi gọi 1555-0115 khai báo, hoặc khai báo online trên trang web của quận. Để ra vào hôm trước ngày thu gom 19:00~24:00", "ja": "販売店のシールを貼って1555-0115に申告、または区ホームページでネット申告。回収日の前日19:00〜24:00に出す", "zh": "贴上销售处买的贴纸后打1555-0115申报，或在区网站网上申报。收运前一天19:00~午夜排放", "mn": "Худалдааны цэгийн наалтыг нааж 1555-0115-д мэдэгдэх, эсвэл дүүргийн сайтаар интернетээр. Ачихын өмнөх өдөр 19:00~шөнө дунд гаргана", "tw": "貼上銷售處買的貼紙後打1555-0115申報，或在區網站網上申報。收運前一天19:00~午夜排放"}, "notes": {"ko": "투명 페트병은 목 17:00〜24:00", "zh": "排放日17:00–24:00", "mn": "Гаргах өдөр 17:00~24:00", "tw": "排放日17:00–24:00"}, "place": {"ko": "내 집 앞 또는 보관대", "id": "Di depan rumah Anda atau di rak penyimpanan", "th": "หน้าบ้านของคุณหรือที่วางขยะ", "en": "In front of your own home or at the storage rack", "ru": "Перед своим домом или на стойке для мусора", "vi": "Trước nhà hoặc giá để rác", "ja": "自宅の前または保管台", "zh": "自家门前或垃圾存放架", "mn": "Өөрийн байрны үүдэнд эсвэл хогийн тавиурт", "tw": "自家門前或垃圾存放架"}, "food": {"ko": "단독주택: 물기 빼고 전용봉투에 담아 집 앞 배출. 공동주택: 단지 내 수거장·RFID 기기", "id": "Rumah tunggal: buang air, masukkan ke kantong khusus, taruh di depan rumah. Apartemen/rumah susun: tempat sampah kompleks atau mesin RFID", "th": "บ้านเดี่ยว: เทน้ำออก ใส่ถุงเฉพาะ วางหน้าบ้าน อพาร์ตเมนต์/อาคารชุด: จุดเก็บขยะในโครงการหรือเครื่อง RFID", "en": "Houses: drain the water, put it in a food-waste bag (전용봉투), in front of your home. Apartments: the complex's collection area or RFID machine", "ru": "Частные дома: слейте воду, в специальный пакет, перед домом. Многоквартирные дома: пункт сбора в комплексе или RFID-устройство", "vi": "Nhà riêng: để ráo nước, cho vào túi chuyên dụng, để trước nhà. Chung cư (공동주택): nơi thu gom trong khu, máy RFID", "ja": "一戸建て：水気を切って専用袋に入れ、自宅前に出す。共同住宅：団地内の回収場・RFID機器", "zh": "独栋住宅：沥干水分，装入专用袋（전용봉투）放在家门前。公寓：小区内回收处·RFID机器", "mn": "Хувийн байшин: усыг нь шүүж тусгай уутанд хийн байрны үүдэнд. Орон сууц: хотхоны хог цуглуулах газар, RFID төхөөрөмж", "tw": "獨棟住宅：瀝乾水分，裝入專用袋（전용봉투）放在家門前。公寓：小區內回收處·RFID機器"}, "bulky": {"ko": "행정복지센터·구 홈페이지·여기로 앱·판매소에서 스티커 구입 후 부착", "id": "Beli stiker di kantor kelurahan (행정복지센터), situs kantor gu, aplikasi 여기로 (Yeogiro), atau toko penjual, lalu tempel", "th": "ซื้อสติกเกอร์ที่ศูนย์บริการชุมชน (행정복지센터) เว็บไซต์สำนักงานเขต แอป 여기로 (Yeogiro) หรือร้านขาย แล้วติด", "en": "Buy a sticker at the community center (행정복지센터), on the district website, on the 'Yeogiro' (여기로) app, or at a shop, and attach it", "ru": "Купите наклейку в администрации (행정복지센터), на сайте района, в приложении «여기로» или в пункте продажи и приклейте", "vi": "Mua tem ở trung tâm hành chính phường (행정복지센터), trang web của quận, ứng dụng '여기로' (Yeogiro) hoặc nơi bán, rồi dán lên", "ja": "行政福祉センター（행정복지센터）・区ホームページ・「여기로」（ヨギロ）アプリ・販売店でシールを買って貼る", "zh": "在行政福利中心（행정복지센터）、区网站、“여기로”App或销售处买贴纸贴上", "mn": "Хорооны захиргаа (행정복지센터), дүүргийн сайт, «여기로» апп, худалдааны цэгээс наалт авч наана", "tw": "在行政福利中心（행정복지센터）、區網站、“여기로”App或銷售處買貼紙貼上"}, "notes": {"ko": "투명봉투에 담아 묶어 배출, 투명 페트병은 별도 배출. 요일은 동별 지정", "id": "Masukkan ke kantong bening, ikat, lalu keluarkan. Botol PET bening dibuang terpisah. Hari ditentukan tiap kelurahan", "th": "ใส่ถุงใส มัดแล้วนำออกไปวาง ขวด PET ใสทิ้งแยก วันทิ้งกำหนดตามแขวง", "en": "Put it in a clear bag, tie it, and put it out. Clear PET bottles separately. Days are set by each dong", "ru": "В прозрачный пакет, завязать. Прозрачные ПЭТ-бутылки — отдельно. Дни — по дон", "vi": "Cho vào túi trong suốt, buộc lại rồi để ra. Chai PET trong suốt để ra riêng. Ngày bỏ do từng phường quy định", "ja": "透明な袋に入れて口を縛って出す。透明ペットボトルは別に出す。曜日は洞ごとに決まっている", "zh": "装透明袋扎好排放，透明PET瓶单独排放。日子由各洞指定", "mn": "Тунгалаг уутанд хийж боож гаргана, тунгалаг ПЭТ савыг тусад нь. Өдрийг хороо бүр тогтооно", "tw": "裝透明袋紮好排放，透明PET瓶單獨排放。日子由各洞指定"}, "days": {"ko": "동별로 다름 (예: 만수1동 일·월·화·수·목 주 5회)", "id": "Beda tiap kelurahan (contoh: Mansu 1-dong Minggu·Senin·Selasa·Rabu·Kamis, 5 kali seminggu)", "th": "แตกต่างตามแขวง (เช่น Mansu 1-dong อาทิตย์·จันทร์·อังคาร·พุธ·พฤหัสบดี สัปดาห์ละ 5 ครั้ง)", "en": "Depends on the dong (e.g. Mansu 1-dong: Sun·Mon·Tue·Wed·Thu, 5 times a week)", "ru": "Разное по районам (дон) (например, Мансу-1-дон: вс, пн, вт, ср, чт — 5 раз в неделю)", "vi": "Khác nhau theo phường (ví dụ: Mansu 1-dong CN·Thứ 2·Thứ 3·Thứ 4·Thứ 5, 5 lần/tuần)", "ja": "洞（동）ごとに違う（例：Mansu 1-dong 日・月・火・水・木の週5回）", "zh": "按洞不同（例：万寿1洞 周日·一·二·三·四，每周5次）", "mn": "Хороо (дон)-оос хамаарна (жишээ нь: Мансү-1-дон Ням·Даваа·Мягмар·Лхагва·Пүрэв, долоо хоногт 5 удаа)", "tw": "按洞不同（例：萬壽1洞 週日·一·二·三·四，每週5次）"}}, "url": "https://www.namdong.go.kr/dong/bbs/bbsMsgDetail.do?msg_seq=92959&cate1=mansu1&bcd=dong_notice&dong=mansu1&pgno=7", "checked": "2026-10-25"}, {"id": "incheon-michuhol", "sido": {"ko": "인천광역시", "id": "Incheon", "th": "อินชอน (Incheon)", "en": "Incheon", "ru": "Инчхон", "vi": "Incheon", "ja": "仁川広域市", "zh": "仁川广域市", "mn": "Инчхон", "tw": "仁川廣域市"}, "name": {"ko": "미추홀구", "id": "Michuhol-gu", "th": "Michuhol-gu", "en": "Michuhol-gu", "ru": "Инчхон, Мичхухол-гу", "vi": "Michuhol-gu", "ja": "弥鄒忽区（ミチュホル）", "zh": "弥邹忽区", "mn": "Инчхон, Мичухол-гу", "tw": "彌鄒忽區"}, "f": {"hours": {"ko": "저녁 7시~12시", "id": "19:00~24:00", "th": "19:00~24:00", "en": "19:00–24:00", "ru": "19:00~24:00", "vi": "19:00~24:00", "ja": "19:00〜24:00", "zh": "19:00–24:00", "mn": "19:00~24:00", "tw": "19:00–24:00"}, "place": {"ko": "종량제봉투에 담아 문 앞(문전) 배출", "id": "Masukkan ke kantong berbayar (종량제봉투), taruh di depan pintu", "th": "ใส่ถุงขยะแบบเสียเงิน (종량제봉투) วางหน้าประตู", "en": "In a pay-as-you-throw bag (종량제봉투), in front of your door", "ru": "В платном пакете (종량제 봉투) перед дверью", "vi": "Cho vào túi rác có trả phí (종량제봉투), để trước cửa (문전)", "ja": "従量制袋（종량제봉투）に入れて玄関前（문전）に出す", "zh": "装入计量收费袋（종량제봉투）放在门前（门前排放）", "mn": "Төлбөртэй уутанд (종량제 봉투) хийж хаалганы өмнө гаргана", "tw": "裝入計量收費袋（종량제봉투）放在門前（門前排放）"}, "food": {"ko": "음식물 종량제봉투에 담아 전용수거용기에, 동별 요일(일·화·목 또는 월·수·금) 19~24시. 100세대 이상은 RFID", "id": "Masukkan ke kantong sampah makanan berbayar (음식물 종량제봉투), lalu ke wadah khusus, pada hari tiap kelurahan (Minggu·Selasa·Kamis atau Senin·Rabu·Jumat) 19:00~24:00. Gedung 100 rumah tangga ke atas: RFID", "th": "ใส่ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제봉투) แล้วใส่ถังเฉพาะ ตามวันของแต่ละแขวง (อาทิตย์·อังคาร·พฤหัสบดี หรือ จันทร์·พุธ·ศุกร์) 19:00~24:00 อาคาร 100 ครัวเรือนขึ้นไปใช้ RFID", "en": "In a food-waste pay-as-you-throw bag (음식물 종량제봉투) inside the special collection bin, on your dong's days (Sun·Tue·Thu or Mon·Wed·Fri), 19:00–24:00. Buildings with 100+ households: RFID", "ru": "В платном пакете для пищевых отходов (음식물 종량제 봉투), в спец. контейнер, в дни по дон (вс, вт, чт или пн, ср, пт) 19:00~24:00. Дома от 100 квартир — RFID", "vi": "Cho vào túi rác thức ăn có trả phí (음식물 종량제봉투), bỏ vào thùng thu gom chuyên dụng, theo ngày của phường (CN·Thứ 3·Thứ 5 hoặc Thứ 2·Thứ 4·Thứ 6) 19:00~24:00. Khu từ 100 hộ trở lên: RFID", "ja": "生ごみ用の従量制袋（음식물 종량제봉투）に入れて専用回収容器へ。洞ごとの曜日（日・火・木 または 月・水・金）19:00〜24:00。100世帯以上はRFID", "zh": "装入厨余计量收费袋（음식물 종량제봉투）放进专用回收桶，按洞的日子（周日·二·四或周一·三·五）19:00–24:00。100户以上用RFID", "mn": "Хүнсний хогийн төлбөртэй уут (음식물 종량제 봉투) хийж тусгай саванд, хороогоор (Ням·Мягмар·Пүрэв эсвэл Даваа·Лхагва·Баасан) 19~24 цагт. 100-аас дээш айлтай байр — RFID", "tw": "裝入廚餘計量收費袋（음식물 종량제봉투）放進專用回收桶，按洞的日子（週日·二·四或週一·三·五）19:00–24:00。100戶以上用RFID"}, "bulky": {"ko": "인터넷(michuhol.go.kr/bigclean), 빼기 앱, 무인키오스크, 스티커 판매소. 수거 전날 17시~자정 배출", "id": "Online (michuhol.go.kr/bigclean), aplikasi 빼기 (Bbegi), kios tanpa petugas, toko penjual stiker. Keluarkan malam sebelum hari ambil 17:00~tengah malam", "th": "ออนไลน์ (michuhol.go.kr/bigclean) แอป 빼기 (Bbegi) ตู้คีออสก์อัตโนมัติ ร้านขายสติกเกอร์ นำออกไปวางเย็นวันก่อนวันเก็บ 17:00~เที่ยงคืน", "en": "Online (michuhol.go.kr/bigclean), the 'Bbegi' (빼기) app, an unmanned kiosk, or a sticker shop. Put it out the day before pickup, 17:00–midnight", "ru": "Интернет (michuhol.go.kr/bigclean), приложение «빼기», киоск самообслуживания, пункты продажи наклеек. Выносить накануне вывоза 17:00~полночь", "vi": "Online (michuhol.go.kr/bigclean), ứng dụng '빼기' (Bbegi), ki-ốt tự động, nơi bán tem. Để ra vào hôm trước ngày thu gom 17:00~24:00", "ja": "インターネット（michuhol.go.kr/bigclean）、「빼기」（ペギ）アプリ、無人キオスク、シール販売店。回収日の前日17:00〜24:00に出す", "zh": "网上（michuhol.go.kr/bigclean）、“빼기”App、无人自助机或贴纸销售处。收运前一天17:00~午夜排放", "mn": "Интернет (michuhol.go.kr/bigclean), «빼기» апп, автомат киоск, наалт зардаг газар. Ачихын өмнөх өдөр 17:00~шөнө дунд гаргана", "tw": "網上（michuhol.go.kr/bigclean）、“빼기”App、無人自助機或貼紙銷售處。收運前一天17:00~午夜排放"}, "notes": {"ko": "동별 요일(일·화·목 또는 월·수·금) 저녁 7~12시, 씻어서 투명봉투에. 페트병은 라벨 떼고 압착해 따로", "id": "Hari tiap kelurahan (Minggu·Selasa·Kamis atau Senin·Rabu·Jumat) 19:00~24:00, dicuci lalu ke kantong bening. Botol PET: lepas label, gepengkan, terpisah", "th": "ตามวันของแต่ละแขวง (อาทิตย์·อังคาร·พฤหัสบดี หรือ จันทร์·พุธ·ศุกร์) 19:00~24:00 ล้างแล้วใส่ถุงใส ขวด PET แกะฉลาก บีบให้แบน ทิ้งแยก", "en": "On your dong's days (Sun·Tue·Thu or Mon·Wed·Fri), 19:00–24:00, washed, in a clear bag. PET bottles: remove the label, crush, and put out separately", "ru": "В дни по дон (вс, вт, чт или пн, ср, пт) 19:00~24:00, вымыть, в прозрачный пакет. С ПЭТ-бутылок снять этикетку, смять, отдельно", "vi": "Theo ngày của phường (CN·Thứ 3·Thứ 5 hoặc Thứ 2·Thứ 4·Thứ 6) 19:00~24:00, rửa sạch, cho vào túi trong suốt. Chai PET: bóc nhãn, ép dẹt, để riêng", "ja": "洞ごとの曜日（日・火・木 または 月・水・金）19:00〜24:00、洗って透明な袋に。ペットボトルはラベルをはがし、つぶして別に", "zh": "按洞的日子（周日·二·四或周一·三·五）19:00–24:00，洗干净装透明袋。PET瓶撕掉标签、压扁后单独排放", "mn": "Хороогоор (Ням·Мягмар·Пүрэв эсвэл Даваа·Лхагва·Баасан) 19~24 цагт, угааж тунгалаг уутанд. ПЭТ савны шошгыг хуулж дарж хавтгайлаад тусад нь", "tw": "按洞的日子（週日·二·四或週一·三·五）19:00–24:00，洗乾淨裝透明袋。PET瓶撕掉標籤、壓扁後單獨排放"}, "days": {"ko": "토요일 제외 매일 · 토요일", "id": "Setiap hari kecuali Sabtu · Sabtu", "th": "ทุกวัน ยกเว้นวันเสาร์ · วันเสาร์", "en": "Every day except Saturday · Saturday", "ru": "Каждый день, кроме субботы · Суббота", "vi": "Mỗi ngày trừ Thứ 7 · Thứ 7", "ja": "土曜以外毎日 · 土曜", "zh": "周六以外每天 · 周六", "mn": "Бямба гарагаас бусад өдөр бүр · Бямба гараг", "tw": "週六以外每天 · 週六"}}, "url": "https://www.michuhol.go.kr/main/content.do?sq=443", "checked": "2026-10-25"}, {"id": "incheon-seo", "sido": {"ko": "인천광역시", "id": "Incheon", "th": "อินชอน (Incheon)", "en": "Incheon", "ru": "Инчхон", "vi": "Incheon", "ja": "仁川広域市", "zh": "仁川广域市", "mn": "Инчхон", "tw": "仁川廣域市"}, "name": {"ko": "서해구 (구 서구, 2026.7.1 개편)", "id": "Seohae-gu (dulu Seo-gu)", "th": "Seohae-gu (Seo-gu เดิม)", "en": "Seohae-gu (formerly Seo-gu)", "ru": "Инчхон, Сохэ-гу", "vi": "Seohae-gu (Incheon)", "ja": "西海区（ソヘ）", "zh": "西海区（原西区）", "mn": "Инчхон, Сохэ-гу", "tw": "西海區（原西區）"}, "f": {"hours": {"ko": "수거 전날 20:00~24:00", "id": "Malam sebelum hari ambil 20:00~24:00", "th": "เย็นวันก่อนวันเก็บ 20:00~24:00", "en": "The day before pickup, 20:00–24:00", "ru": "Накануне вывоза 20:00~24:00", "vi": "Hôm trước ngày thu gom 20:00~24:00", "ja": "回収日の前日20:00〜24:00", "zh": "收运前一天20:00–24:00", "mn": "Ачихын өмнөх өдөр 20:00~24:00", "tw": "收運前一天20:00–24:00"}, "place": {"ko": "집 앞", "id": "Di depan rumah", "th": "หน้าบ้าน", "en": "In front of your home", "ru": "Перед домом", "vi": "Trước nhà", "ja": "自宅の前", "zh": "家门前", "mn": "Байрны үүдэнд", "tw": "家門前"}, "food": {"ko": "전용 수거용기에 납부필증(스티커) 붙여 문전배출. 청라는 전용봉투로 크린넷에 상시 배출", "id": "Tempel stiker bukti bayar (납부필증) di wadah khusus, taruh di depan pintu. Cheongna: kantong khusus, buang ke Clean-net (크린넷) kapan saja", "th": "ติดสติกเกอร์ชำระเงิน (납부필증) บนถังเฉพาะ วางหน้าประตู ย่าน Cheongna: ใช้ถุงเฉพาะ ทิ้งที่ระบบ Clean-net (크린넷) ได้ตลอดเวลา", "en": "In the special collection bin with a payment sticker (납부필증) attached, in front of your door. Cheongna: in a special bag, into the Clean Net (크린넷) at any time", "ru": "Спец. контейнер с наклейкой об оплате (납부필증), перед дверью. В Чхонна (청라) — в специальном пакете в автоматическую систему сбора (크린넷), в любое время", "vi": "Dán tem đã trả phí (납부필증, nhãn dán) lên thùng thu gom chuyên dụng, để trước cửa. Cheongna: dùng túi chuyên dụng, bỏ vào hệ thống Clean-net (크린넷) bất cứ lúc nào", "ja": "専用回収容器に納付済証（납부필증・シール）を貼って玄関前に出す。Cheongna（청라）は専用袋でクリーンネット（크린넷）にいつでも出せる", "zh": "在专用回收桶上贴缴费证（납부필증，贴纸）后放在门前。青罗用专用袋随时投入Clean Net（크린넷）", "mn": "Тусгай саванд төлбөрийн наалт (납부필증) нааж хаалганы өмнө. Чонна (청라)-д тусгай уутаар автомат хог цуглуулах систем (크린넷)-д хүссэн үедээ", "tw": "在專用回收桶上貼繳費證（납부필증，貼紙）後放在門前。青羅用專用袋隨時投入Clean Net（크린넷）"}, "bulky": {"ko": "인터넷 신고·결제 후 신고필증 부착, 수거 전날 20~24시 문전배출 (waste.seo.incheon.kr)", "id": "Lapor dan bayar online, tempel bukti lapor (신고필증), taruh di depan pintu malam sebelum hari ambil 20:00~24:00 (waste.seo.incheon.kr)", "th": "แจ้งและจ่ายเงินออนไลน์ ติดใบรับแจ้ง (신고필증) แล้ววางหน้าประตูเย็นวันก่อนวันเก็บ 20:00~24:00 (waste.seo.incheon.kr)", "en": "Report and pay online, attach the certificate (신고필증), and put it in front of your door 20:00–24:00 the day before pickup (waste.seo.incheon.kr)", "ru": "Заявка и оплата через интернет, приклейте квитанцию (신고필증), выносите накануне вывоза 20:00~24:00 перед дверью (waste.seo.incheon.kr)", "vi": "Khai báo và trả phí online, dán giấy xác nhận khai báo (신고필증), để trước cửa vào hôm trước ngày thu gom 20:00~24:00 (waste.seo.incheon.kr)", "ja": "インターネットで申告・支払い後、申告済証（신고필증）を貼り、回収日の前日20:00〜24:00に玄関前へ（waste.seo.incheon.kr）", "zh": "网上申报·付款后贴上申报证（신고필증），收运前一天20:00–24:00放在门前（waste.seo.incheon.kr）", "mn": "Интернетээр мэдүүлж төлөөд бүртгэлийн баримт (신고필증) нааж, ачихын өмнөх өдөр 20~24 цагт хаалганы өмнө (waste.seo.incheon.kr)", "tw": "網上申報·付款後貼上申報證（신고필증），收運前一天20:00–24:00放在門前（waste.seo.incheon.kr）"}, "notes": {"ko": "투명 페트병은 라벨 떼고 찌그러뜨려 따로. 기저귀·비닐코팅 종이는 종량제봉투에", "id": "Botol PET bening: lepas label, gepengkan, terpisah. Popok dan kertas berlapis plastik masuk kantong berbayar (종량제봉투)", "th": "ขวด PET ใส แกะฉลาก บีบให้แบน ทิ้งแยก ผ้าอ้อมและกระดาษเคลือบพลาสติกใส่ถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Clear PET bottles: remove the label, crush, and put out separately. Diapers and plastic-coated paper go in a pay-as-you-throw bag (종량제봉투)", "ru": "С прозрачных ПЭТ-бутылок снимите этикетку, сомните, отдельно. Подгузники и бумагу с плёночным покрытием — в платный пакет (종량제 봉투)", "vi": "Chai PET trong suốt: bóc nhãn, bóp dẹt, để riêng. Tã, giấy tráng ni lông: cho vào túi rác có trả phí (종량제봉투)", "ja": "透明ペットボトルはラベルをはがし、つぶして別に。おむつ・ビニールコーティングの紙は従量制袋（종량제봉투）へ", "zh": "透明PET瓶撕掉标签、压扁后单独排放。尿布·覆膜纸装计量收费袋（종량제봉투）", "mn": "Тунгалаг ПЭТ савны шошгыг хуулж дарж хавтгайлаад тусад нь. Живх, гялгар бүрхүүлтэй цаасыг төлбөртэй уутанд (종량제 봉투)", "tw": "透明PET瓶撕掉標籤、壓扁後單獨排放。尿布·覆膜紙裝計量收費袋（종량제봉투）"}, "days": {"ko": "일~금요일 저녁 (수거 월~토). 음식물·재활용은 동별 일·화·목 또는 월·수·금 · 법정공휴일, 근로자의 날", "id": "Ming  cửa nhà mình. Chung cư: nơi khu chung cư quy định", "ja": "自宅の前。マンション：団地の指定場所", "zh": "自家门前。公寓：小区指定地点", "mn": "Өөрийн хаалганы өмнө. Орон сууц (아파트): хорооллын тогтоосон газар", "tw": "自家門前。公寓：小區指定地點"}, "food": {"ko": "주택: 음식물 종량제봉투나 납부필증을 붙인 전용용기(3·5·20L)에 담아 배출일에 집 앞 도로변. 아파트: 120L 공동용기 또는 RFID 종량기", "id": "Rumah: masukkan ke kantong sampah makanan berbayar (음식물 종량제 봉투) atau wadah khusus (3·5·20L) yang ditempel stiker bukti bayar (납부필증), taruh di pinggir jalan depan rumah pada hari angkut. Apartemen: wadah bersama 120L atau mesin timbang RFID", "th": "บ้านพัก: ใส่ถุงขยะเศษอาหารแบบเสียเงิน (음식물 종량제 봉투) หรือถังเฉพาะ (3·5·20L) ที่ติดสติกเกอร์ชำระเงิน (납부필증) วางริมถนนหน้าบ้านในวันเก็บ อพาร์ตเมนต์: ถังรวม 120L หรือเครื่องชั่ง RFID", "en": "Houses: put it in a food-waste pay-as-you-throw bag (음식물 종량제 봉투) or in a special bin (3·5·20L) with a payment sticker (납부필증) attached, on the roadside in front of your home on pickup day. Apartments: 120L shared bin or RFID scale bin", "ru": "Частный дом: платный пакет для пищевых отходов (음식물 종량제 봉투) или спец. контейнер (3·5·20 л) с наклейкой об оплате (납부필증); в день вывоза — у дороги перед домом. Многоквартирный дом: общий контейнер 120 л или весы с RFID", "vi": "Nhà riêng: cho vào túi rác thức ăn có trả phí (음식물 종량제 봉투) hoặc thùng riêng (3·5·20L) có dán tem đã trả phí (납부필증), để ở lề đường trước nhà vào ngày thu gom. Chung cư: thùng chung 120L hoặc máy cân RFID", "ja": "一戸建て：生ごみ用の従量制袋（음식물 종량제 봉투）か、納付証（납부필증）を貼った専用容器（3・5・20L）に入れ、収集日に自宅前の道路沿いへ。マンション：120Lの共用容器かRFID計量機", "zh": "独栋住宅：装入厨余计量收费袋（음식물 종량제 봉투），或贴有缴费证（납부필증）的专用桶（3·5·20L），收运日放在家门前路边。公寓：120L公用桶或RFID计量桶", "mn": "Хувийн байшин: хүнсний хаягдлын төлбөртэй уут (음식물 종량제 봉투) эсвэл төлбөрийн наалт (납부필증) наасан тусгай сав (3·5·20 л)-д хийж, хог авах өдөр байрны урд замын хажууд. Орон сууц: 120 л нийтийн сав эсвэл RFID жинлүүр", "tw": "獨棟住宅：裝入廚餘計量收費袋（음식물 종량제 봉투），或貼有繳費證（납부필증）的專用桶（3·5·20L），收運日放在家門前路邊。公寓：120L公用桶或RFID計量桶"}, "bags": {"ko": "종량제봉투 지정판매소 (슈퍼, 상가 등)", "id": "Toko resmi penjual kantong sampah berbayar (종량제 봉투) (supermarket, toko, dll.)", "th": "ร้านที่ได้รับอนุญาตให้ขายถุงขยะแบบเสียเงิน (종량제 봉투) (ซูเปอร์มาร์เก็ต ร้านค้า ฯลฯ)", "en": "Official pay-as-you-throw bag (종량제 봉투) shops (supermarkets, shops, etc.)", "ru": "Назначенные пункты продажи платных пакетов (종량제 봉투) (супермаркеты, магазины и т. п.)", "vi": "Cửa hàng bán túi rác có trả phí (종량제 봉투) được chỉ định (siêu thị, cửa hàng, v.v.)", "ja": "従量制袋（종량제 봉투）指定販売所（スーパー、商店など）", "zh": "计量收费袋（종량제 봉투）指定销售处（超市、商店等）", "mn": "Төлбөртэй уут (종량제 봉투) зардаг албан ёсны дэлгүүр (супермаркет, дэлгүүр г.м.)", "tw": "計量收費袋（종량제 봉투）指定銷售處（超市、商店等）"}, "bulky": {"ko": "인터넷: 고양시 대형폐기물 인터넷신고센터(clean.gys.or.kr) 결제 후 필증 부착 / 앱 '빼기' / 판매소에서 스티커 사서 붙이고 구역 업체에 전화", "id": "Online: bayar di pusat lapor sampah besar online Goyang (clean.gys.or.kr) lalu tempel bukti (필증) / Aplikasi '빼기' / Beli stiker (스티커) di toko, tempel, lalu telepon perusahaan area Anda", "th": "ออนไลน์: ชำระเงินที่ศูนย์แจ้งขยะชิ้นใหญ่ออนไลน์ของโกยาง (clean.gys.or.kr) แล้วติดใบยืนยัน (필증) / แอป '빼기' / ซื้อสติกเกอร์ (스티커) ที่ร้าน ติดแล้วโทรหาบริษัทรับเหมาในพื้นที่", "en": "Online: pay at the Goyang bulky waste online report center (clean.gys.or.kr) and attach the receipt (필증) / App '빼기' (Ppaegi) / Buy a sticker at a shop, attach it and call your area's contractor", "ru": "Онлайн: оплатите в интернет-центре заявок на крупный мусор г. Коян (clean.gys.or.kr) и приклейте квитанцию (필증) / Приложение «빼기» / Купите наклейку (스티커) в магазине, приклейте и позвоните подрядчику вашего района", "vi": "Online: trả phí ở trung tâm khai báo rác cỡ lớn online của Goyang (clean.gys.or.kr) rồi dán giấy xác nhận (필증) / Ứng dụng '빼기' / Mua tem (스티커) ở cửa hàng, dán lên rồi gọi điện cho công ty phụ trách khu vực", "ja": "インターネット：高陽市大型廃棄物インターネット申告センター（clean.gys.or.kr）で支払い後、証明（필증）を貼る / アプリ「빼기」/ 販売所でシールを買って貼り、地域の業者に電話", "zh": "网上：在高阳市大型废弃物网上申报中心（clean.gys.or.kr）付款后贴上证明（필증）/ App“빼기” / 在销售处买贴纸贴上，再打电话给所在区域的公司", "mn": "Интернэт: Гоян хотын том хог бүртгэлийн төв (clean.gys.or.kr)-д төлөөд баримт (필증) наах / '빼기' апп / Дэлгүүрээс наалт (스티커) аваад нааж, бүсийнхээ компани руу залгах", "tw": "網上：在高陽市大型廢棄物網上申報中心（clean.gys.or.kr）付款後貼上證明（필증）/ App“빼기” / 在銷售處買貼紙貼上，再打電話給所在區域的公司"}, "notes": {"ko": "재활용품은 투명봉투에. 투명 페트병은 라벨 떼고 눌러서 뚜껑 닫아 투명봉투에. 유리·사기 같은 타지 않는 쓰레기는 고양시 불연성 마대에", "id": "Sampah daur ulang di kantong bening. Botol PET bening: lepas label, gepengkan, tutup tutupnya, masukkan ke kantong bening. Sampah tidak bisa dibakar seperti kaca dan keramik: di karung khusus sampah tidak bisa dibakar Goyang (불연성 마대)", "th": "ขยะรีไซเคิลใส่ถุงใส ขวด PET ใส: ลอกฉลาก บีบให้แบน ปิดฝา แล้วใส่ถุงใส ขยะที่เผาไม่ได้ เช่น แก้ว เครื่องเคลือบ: ใส่กระสอบขยะเผาไม่ได้ของโกยาง (불연성 마대)", "en": "Recyclables in a clear bag. Clear PET bottles: remove the label, crush, close the cap and put in a clear bag. Non-burnable waste like glass and ceramics: in Goyang's non-burnable sack (불연성 마대)", "ru": "Вторсырьё — в прозрачный пакет. Прозрачные ПЭТ-бутылки: снимите этикетку, сомните, закройте крышку, в прозрачный пакет. Негорючий мусор (стекло, керамика) — в негорючий мешок г. Коян (불연성 마대)", "vi": "Rác tái chế cho vào túi trong suốt. Chai PET trong suốt: bóc nhãn, ép dẹp, đóng nắp, cho vào túi trong suốt. Rác không cháy như thủy tinh, đồ sứ: cho vào bao rác không cháy của Goyang (불연성 마대)", "ja": "資源ごみは透明な袋へ。透明ペットボトルはラベルをはがし、つぶしてふたを閉め透明な袋へ。ガラス・陶磁器など燃えないごみは高陽市の不燃物用袋（불연성 마대）へ", "zh": "可回收物装入透明袋。透明PET瓶撕掉标签、压扁、盖好瓶盖后装入透明袋。玻璃、陶瓷等不可燃垃圾装入高阳市不可燃麻袋（불연성 마대）", "mn": "Дахин боловсруулах хогийг тунгалаг уутанд. Тунгалаг PET савыг шошгыг нь авч, дарж, тагийг нь хаагаад тунгалаг уутанд. Шил, шаазан зэрэг шатдаггүй хогийг Гоян хотын шатдаггүй хогны шуудайнд (불연성 마대)", "tw": "可回收物裝入透明袋。透明PET瓶撕掉標籤、壓扁、蓋好瓶蓋後裝入透明袋。玻璃、陶瓷等不可燃垃圾裝入高陽市不可燃麻袋（불연성 마대）"}, "days": {"ko": "매일 수거, 일요일은 수거 없음 (덕양·일산동·일산서구 공통, 구역별 대행업체가 새벽 5~11시 수거)", "id": "Diangkut setiap hari, hari Minggu tidak ada pengangkutan (sama untuk Deogyang-gu, Ilsandong-gu, Ilsanseo-gu; perusahaan tiap area mengangkut jam 05:00–11:00)", "th": "เก็บทุกวัน วันอาทิตย์ไม่มีการเก็บ (เหมือนกันทั้ง Deogyang-gu, Ilsandong-gu, Ilsanseo-gu บริษัทรับเหมาแต่ละพื้นที่เก็บเวลา 05:00–11:00)", "en": "Pickup every day, no pickup on Sunday (same in Deogyang-gu, Ilsandong-gu, Ilsanseo-gu; each area's contractor collects 05:00–11:00)", "ru": "Вывоз каждый день, в воскресенье не вывозят (одинаково в Тогян-гу, Ильсандон-гу, Ильсансо-гу; подрядчик каждого района вывозит 05:00~11:00)", "vi": "Thu gom mỗi ngày, Chủ nhật không thu gom (giống nhau ở Deogyang-gu, Ilsandong-gu, Ilsanseo-gu; công ty phụ trách từng khu vực thu gom từ 05:00 đến 11:00)", "ja": "毎日収集、日曜は収集なし（徳陽区・一山東区・一山西区共通、地域ごとの委託業者が05:00～11:00に収集）", "zh": "每天收运，周日不收（德阳区·一山东区·一山西区相同，各区域代理公司在05:00–11:00收运）", "mn": "Өдөр бүр авна, ням гарагт авахгүй (Догян-гу, Илсандун-гу, Илсансо-гу адилхан; бүс бүрийн гэрээт компани 05:00~11:00 цагт авна)", "tw": "每天收運，週日不收（德陽區·一山東區·一山西區相同，各區域代理公司在05:00–11:00收運）"}}, "url": "https://www.goyang.go.kr/www/www03/www03_3/www03_3_3/www03_3_3_tab1.jsp", "checked": "2026-10-25"}, {"id": "gg-gwangmyeong", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "광명시", "id": "Gwangmyeong-si", "th": "Gwangmyeong-si", "en": "Gwangmyeong-si", "ru": "Кёнгидо, Кванмён", "vi": "Gwangmyeong-si", "ja": "光明市（クァンミョン）", "zh": "光明市", "mn": "Гёнгидо, Гуанмён", "tw": "光明市"}, "f": {"hours": {"ko": "저녁 8시 ~ 다음날 오전 6시", "id": "Jam 8 malam (20:00) sampai jam 6 pagi (06:00) besoknya", "th": "2 ทุ่ม (20:00) ถึง 6 โมงเช้าวันรุ่งขึ้น (06:00)", "en": "20:00 to 06:00 the next day", "ru": "20:00~06:00 следующего дня", "vi": "Từ 8 giờ tối (20:00) đến 6 giờ sáng hôm sau (06:00)", "ja": "20:00～翌06:00", "zh": "20:00至次日06:00", "mn": "20:00-аас дараа өдрийн 06:00 хүртэл", "tw": "20:00至次日06:00"}, "place": {"ko": "자기 집 대문 앞", "id": "Di depan gerbang rumah sendiri", "th": "หน้าประตูบ้านตัวเอง", "en": "In front of your own gate", "ru": "Перед своими воротами", "vi": "Trước cổng nhà mình", "ja": "自宅の門の前", "zh": "自家大门前", "mn": "Өөрийн хаалганы өмнө", "tw": "自家大門前"}, "food": {"ko": "물기 꽉 짜고 노란색 음식물 전용봉투에 담아 배출용기에. 뼈·조개껍데기·과일 씨는 일반쓰레기", "id": "Peras airnya sampai kering, masukkan ke kantong khusus sampah makanan warna kuning, lalu ke wadah buang. Tulang, cangkang kerang, dan biji buah termasuk sampah umum", "th": "บีบน้ำออกให้แห้ง ใส่ถุงเศษอาหารเฉพาะสีเหลือง แล้วใส่ถังทิ้ง กระดูก เปลือกหอย เมล็ดผลไม้ เป็นขยะทั่วไป", "en": "Squeeze out the water, put it in the yellow food-waste bag, then in the disposal bin. Bones, shells and fruit seeds are general waste", "ru": "Хорошо отожмите воду, положите в жёлтый пакет для пищевых отходов и в контейнер. Кости, ракушки, косточки фруктов — в обычный мусор", "vi": "Vắt thật ráo nước, cho vào túi rác thức ăn màu vàng rồi bỏ vào thùng. Xương, vỏ sò, hạt trái cây là rác thường", "ja": "水気をしっかりしぼり、黄色の生ごみ専用袋に入れて排出容器へ。骨・貝殻・果物の種は一般ごみ", "zh": "用力挤干水分，装入黄色厨余专用袋，放进排放桶。骨头、贝壳、果核属于一般垃圾", "mn": "Усыг нь сайн шахаж, шар өнгийн хүнсний хаягдлын тусгай уутанд хийгээд саванд. Яс, хясаа, жимсний үр энгийн хог", "tw": "用力擠幹水分，裝入黃色廚餘專用袋，放進排放桶。骨頭、貝殼、果核屬於一般垃圾"}, "bags": {"ko": "쓰레기 종량제봉투 지정판매소", "id": "Toko resmi penjual kantong sampah berbayar (종량제 봉투)", "th": "ร้านที่ได้รับอนุญาตให้ขายถุงขยะแบบเสียเงิน (종량제 봉투)", "en": "Official pay-as-you-throw bag (종량제 봉투) shops", "ru": "Назначенные пункты продажи платных пакетов (종량제 봉투)", "vi": "Cửa hàng bán túi rác có trả phí (종량제 봉투) được chỉ định", "ja": "ごみ従量制袋（종량제 봉투）指定販売所", "zh": "计量收费袋（종량제 봉투）指定销售处", "mn": "Төлбөртэй уут (종량제 봉투) зардаг албан ёсны дэлгүүр", "tw": "計量收費袋（종량제 봉투）指定銷售處"}, "bulky": {"ko": "앱 '지구하다' 또는 gwangmyeong-gyeonggi.hwm.zguhada.com 에서 신고 / 전화 1866-0201 / 지정판매소 스티커 부착", "id": "Lapor lewat aplikasi '지구하다' atau gwangmyeong-gyeonggi.hwm.zguhada.com / Telepon 1866-0201 / Tempel stiker (스티커) dari toko resmi", "th": "แจ้งทางแอป '지구하다' หรือ gwangmyeong-gyeonggi.hwm.zguhada.com / โทร 1866-0201 / ติดสติกเกอร์ (스티커) จากร้านที่ได้รับอนุญาต", "en": "Report on the app '지구하다' (Zguhada) or at gwangmyeong-gyeonggi.hwm.zguhada.com / Phone 1866-0201 / Attach a sticker from a designated shop", "ru": "Заявка в приложении «지구하다» или на gwangmyeong-gyeonggi.hwm.zguhada.com / Тел. 1866-0201 / Наклейка (스티커) из назначенного пункта продажи", "vi": "Khai báo trên ứng dụng '지구하다' hoặc gwangmyeong-gyeonggi.hwm.zguhada.com / Gọi 1866-0201 / Dán tem (스티커) mua ở cửa hàng chỉ định", "ja": "アプリ「지구하다」または gwangmyeong-gyeonggi.hwm.zguhada.com で申告 / 電話 1866-0201 / 指定販売所のシールを貼る", "zh": "在App“지구하다”或 gwangmyeong-gyeonggi.hwm.zguhada.com 申报 / 电话 1866-0201 / 在指定销售处买贴纸贴上", "mn": "'지구하다' апп эсвэл gwangmyeong-gyeonggi.hwm.zguhada.com-д бүртгүүлэх / Утас 1866-0201 / Албан ёсны дэлгүүрийн наалт (스티커) наах", "tw": "在App“지구하다”或 gwangmyeong-gyeonggi.hwm.zguhada.com 申報 / 電話 1866-0201 / 在指定銷售處買貼紙貼上"}, "notes": {"ko": "종이·병·금속·플라스틱·스티로폼 등을 종류별로 끈으로 묶거나 투명 봉투에 담아 대문 앞에", "id": "Kertas, botol, logam, plastik, styrofoam, dll.: pisahkan per jenis, ikat dengan tali atau masukkan ke kantong bening, taruh di depan gerbang", "th": "กระดาษ ขวด โลหะ พลาสติก โฟม ฯลฯ แยกตามประเภท มัดด้วยเชือกหรือใส่ถุงใส วางหน้าประตูบ้าน", "en": "Paper, bottles, metal, plastic, styrofoam, etc.: sort by type, tie with string or put in clear bags, in front of your gate", "ru": "Бумагу, бутылки, металл, пластик, пенопласт и т. п. разделите по видам, свяжите верёвкой или положите в прозрачные пакеты и выносите к воротам", "vi": "Giấy, chai, kim loại, nhựa, xốp, v.v.: phân theo loại, buộc bằng dây hoặc cho vào túi trong suốt, để trước cổng", "ja": "紙・びん・金属・プラスチック・発泡スチロールなどを種類ごとにひもでしばるか透明な袋に入れて門の前へ", "zh": "纸、瓶、金属、塑料、泡沫塑料等按种类用绳子捆好或装入透明袋，放在大门前", "mn": "Цаас, шил, төмөр, хуванцар, хөөсөнцөр г.м.-ийг төрлөөр нь уяагаар боох эсвэл тунгалаг уутанд хийж хаалганы өмнө", "tw": "紙、瓶、金屬、塑膠、泡沫塑膠等按種類用繩子捆好或裝入透明袋，放在大門前"}, "days": {"ko": "매일 수거 (일요일·법정공휴일 제외). 음식물은 일~금요일 저녁 8시 이후 배출", "id": "Diangkut setiap hari (kecuali Minggu dan hari libur resmi). Sampah makanan dikeluarkan Minggu–Jumat setelah jam 8 malam (20:00)", "th": "เก็บทุกวัน (ยกเว้นวันอาทิตย์และวันหยุดราชการ) เศษอาหาร: นำออกวันอาทิตย์–ศุกร์ หลัง 2 ทุ่ม (20:00)", "en": "Pickup every day (except Sunday and public holidays). Food waste: put it out Sun–Fri after 20:00", "ru": "Вывоз каждый день (кроме воскресенья и официальных праздников). Пищевые отходы выносите вс~пт после 20:00", "vi": "Thu gom mỗi ngày (trừ Chủ nhật và ngày lễ theo luật). Rác thức ăn: để ra từ Chủ nhật đến Thứ 6, sau 8 giờ tối (20:00)", "ja": "毎日収集（日曜・法定祝日を除く）。生ごみは日～金曜日の20:00以降に出す", "zh": "每天收运（周日·法定公休日除外）。厨余在周日至周五20:00以后排放", "mn": "Өдөр бүр авна (ням гараг, албан ёсны баярын өдрөөс бусад). Хүнсний хаягдлыг ням~баасан гарагт 20:00-аас хойш гаргана", "tw": "每天收運（週日·法定公休日除外）。廚餘在週日至週五20:00以後排放"}}, "url": "https://www.gm.go.kr/pt/partInfo/en/cleaning/lfgarbage/PTMN217.jsp", "checked": "2026-10-25"}, {"id": "gg-gwangju", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "광주시", "id": "Gwangju-si (Gyeonggi)", "th": "Gwangju-si (Gyeonggi)", "en": "Gwangju-si", "ru": "Кёнгидо, Кванджу", "vi": "Gwangju-si (Gyeonggi)", "ja": "広州市（クァンジュ）", "zh": "广州市", "mn": "Гёнгидо, Гванжу", "tw": "廣州市"}, "f": {"hours": {"ko": "수거 전날 저녁 8시~오전 6시", "id": "Malam sebelum hari ambil 20:00~06:00 pagi", "th": "เย็นวันก่อนวันเก็บ 20:00~06:00", "en": "20:00 the evening before pickup – 06:00", "ru": "Накануне вывоза 20:00~06:00", "vi": "Tối hôm trước ngày thu gom 20:00 ~ 06:00", "ja": "回収日の前日20:00〜06:00", "zh": "收运前一天20:00–06:00", "mn": "Хог ачихын өмнөх өдрийн 20:00~06:00", "tw": "收運前一天20:00–06:00"}, "place": {"ko": "지정된 배출장소 (경안동·역동은 내 집·상가 앞)", "id": "Tempat buang yang ditentukan (Gyeongan-dong, Yeok-dong: di depan rumah atau toko Anda)", "th": "จุดทิ้งที่กำหนด (Gyeongan-dong, Yeok-dong: หน้าบ้านหรือหน้าร้านของคุณ)", "en": "Designated disposal spot (Gyeongan-dong and Yeok-dong: in front of your own home or shop)", "ru": "Назначенное место (Кёнан-дон, Ёк-дон — перед своим домом или магазином)", "vi": "Nơi bỏ rác được chỉ định (Gyeongan-dong, Yeok-dong: trước nhà hoặc cửa hàng của bạn)", "ja": "決められた排出場所（Gyeongan-dong・Yeok-dongは自宅・店舗の前）", "zh": "指定排放处（京安洞·驿洞为自家·商铺门前）", "mn": "Заасан газар (Гёнан-дон, Ёг-дон — өөрийн байр, дэлгүүрийн үүдэнд)", "tw": "指定排放處（京安洞·驛洞為自家·商鋪門前）"}, "food": {"ko": "물기를 최대한 빼고 음식물 전용봉투에 담아 배출. 껍데기·뼈·티백은 일반쓰레기", "id": "Buang air sebanyak mungkin, masukkan ke kantong khusus sampah makanan (음식물 전용봉투). Kulit keras, tulang, kantong teh = sampah umum", "th": "เทน้ำออกให้มากที่สุด ใส่ถุงขยะเศษอาหารเฉพาะ (음식물 전용봉투) เปลือกแข็ง กระดูก ถุงชา เป็นขยะทั่วไป", "en": "Drain as much water as possible and put it in a food-waste bag (음식물 전용봉투). Shells, bones and tea bags are general waste", "ru": "Слейте как можно больше воды, положите в специальный пакет для пищевых отходов. Скорлупу, кости, чайные пакетики — в обычный мусор", "vi": "Để thật ráo nước, cho vào túi rác thức ăn chuyên dụng (음식물 전용봉투). Vỏ cứng, xương, túi trà: là rác thường", "ja": "水気をできるだけ切って生ごみ専用袋（음식물 전용봉투）に入れて出す。殻・骨・ティーバッグは一般ごみ", "zh": "尽量沥干水分，装入厨余专用袋（음식물 전용봉투）。壳·骨头·茶包属于一般垃圾", "mn": "Усыг аль болох шүүж хүнсний хогийн тусгай уутанд хийж гаргана. Хальс, яс, цайны уутыг энгийн хогонд", "tw": "儘量瀝乾水分，裝入廚餘專用袋（음식물 전용봉투）。殼·骨頭·茶包屬於一般垃圾"}, "bags": {"ko": "지정 종량제봉투 판매소", "id": "Toko penjual resmi kantong sampah berbayar (종량제봉투)", "th": "ร้านที่ได้รับอนุญาตขายถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Designated pay-as-you-throw bag shops (종량제봉투 판매소)", "ru": "Назначенные пункты продажи платных пакетов (종량제 봉투)", "vi": "Nơi bán túi rác có trả phí (종량제봉투) được chỉ định", "ja": "指定の従量制袋（종량제봉투）販売店", "zh": "指定计量收费袋销售处（종량제봉투 판매소）", "mn": "Заасан төлбөртэй уут (종량제 봉투) зардаг газар", "tw": "指定計量收費袋銷售處（종량제봉투 판매소）"}, "bulky": {"ko": "여기로 앱·사이트(yeogiro24.co.kr) 신청, 또는 납부필증 구입·부착 후 수거업체에 전화", "id": "Daftar lewat aplikasi/situs 여기로 (Yeogiro, yeogiro24.co.kr), atau beli dan tempel stiker bukti bayar (납부필증), lalu telepon perusahaan pengumpul", "th": "ยื่นขอผ่านแอป/เว็บไซต์ 여기로 (Yeogiro, yeogiro24.co.kr) หรือซื้อและติดสติกเกอร์ชำระเงิน (납부필증) แล้วโทรหาบริษัทเก็บขยะ", "en": "Apply on the 'Yeogiro' (여기로) app or website (yeogiro24.co.kr), or buy a payment sticker (납부필증), attach it and call the collection company", "ru": "Заявка в приложении или на сайте «여기로» (yeogiro24.co.kr), или купите и приклейте наклейку об оплате (납부필증) и позвоните в компанию по вывозу", "vi": "Đăng ký qua ứng dụng/trang web '여기로' (Yeogiro, yeogiro24.co.kr), hoặc mua và dán tem đã trả phí (납부필증) rồi gọi công ty thu gom", "ja": "「여기로」（ヨギロ）アプリ・サイト（yeogiro24.co.kr）で申請、または納付済証（납부필증）を買って貼り、回収業者に電話", "zh": "通过“여기로”App·网站（yeogiro24.co.kr）申请，或买缴费证（납부필증）贴上后打电话给收运公司", "mn": "«여기로» апп, сайтаар (yeogiro24.co.kr) хүсэлт гаргах, эсвэл төлбөрийн наалт (납부필증) худалдан авч нааж хог ачих компанид утсаар", "tw": "透過“여기로”App·網站（yeogiro24.co.kr）申請，或買繳費證（납부필증）貼上後打電話給收運公司"}, "notes": {"ko": "이물질 제거 후 투명봉투에 배출. 이물질 묻은 재활용품은 종량제봉투에", "id": "Buang benda asing, lalu masukkan ke kantong bening. Daur ulang yang kotor masuk kantong berbayar (종량제봉투)", "th": "เอาสิ่งแปลกปลอมออกแล้วใส่ถุงใส ขยะรีไซเคิลที่สกปรกให้ใส่ถุงขยะแบบเสียเงิน (종량제봉투)", "en": "Remove foreign matter and put it in a clear bag. Dirty recycling goes in a pay-as-you-throw bag (종량제봉투)", "ru": "Уберите грязь и выносите в прозрачном пакете. Грязное вторсырьё — в платный пакет (종량제 봉투)", "vi": "Bỏ tạp chất rồi cho vào túi trong suốt. Rác tái chế dính bẩn: cho vào túi rác có trả phí", "ja": "異物を取り除いて透明な袋で出す。異物が付いた資源ごみは従量制袋（종량제봉투）へ", "zh": "去掉杂物后装透明袋。沾有杂物的可回收物装计量收费袋（종량제봉투）", "mn": "Хольцыг арилгаад тунгалаг уутанд гаргана. Бохир дахин боловсруулах хогийг төлбөртэй уутанд (종량제 봉투)", "tw": "去掉雜物後裝透明袋。沾有雜物的可回收物裝計量收費袋（종량제봉투）"}, "days": {"ko": "수거 전날 저녁 배출 (수거: 평일 06~15시, 토요일 06~12시) · 토요일 14시 이후, 일요일, 공휴일 수거 안 함 (명절엔 변경)", "id": "Buang malam sebelum hari ambil (ambil: hari kerja 06:00~15:00, Sabtu 06:00~12:00) · Tidak diambil Sabtu setelah 14:00, Minggu, hari libur (berubah saat hari raya)", "th": "ทิ้งเย็นวันก่อนวันเก็บ (เก็บ: วันธรรมดา 06:00~15:00 วันเสาร์ 06:00~12:00) · ไม่เก็บหลัง 14:00 วันเสาร์ วันอาทิตย์ วันหยุดราชการ (ช่วงเทศกาลอาจเปลี่ยน)", "en": "Put it out the evening before pickup (pickup: weekdays 06:00–15:00, Saturday 06:00–12:00) · No pickup after 14:00 on Saturday, on Sunday or on public holidays (changes during major holidays 명절)", "ru": "Выносить вечером накануне вывоза (вывоз: будни 06:00~15:00, суббота 06:00~12:00) · После 14:00 в субботу, в воскресенье и праздники не вывозят (в праздники Соллаль и Чхусок — изменения)", "vi": "Để ra vào tối hôm trước ngày thu gom (thu gom: ngày thường 06:00~15:00, Thứ 7 06:00~12:00) · Không thu gom sau 14:00 Thứ 7, CN, ngày lễ (dịp lễ truyền thống (명절) có thay đổi)", "ja": "回収日の前日の夜に出す（回収：平日06:00〜15:00、土曜06:00〜12:00） · 土曜14:00以降、日曜、祝日は回収なし（名節（명절）は変更あり）", "zh": "收运前一天晚上扔（收运：平日06:00–15:00，周六06:00–12:00） · 周六14:00以后、周日、公休日不收（节日 명절 时有变动）", "mn": "Хог ачихын өмнөх өдрийн орой гаргана (ачих: ажлын өдөр 06~15 цаг, Бямба 06~12 цаг) · Бямба гарагт 14:00-аас хойш, Ням гараг, баярын өдөр ачихгүй (их баяраар өөрчлөгдөнө)", "tw": "收運前一天晚上扔（收運：平日06:00–15:00，週六06:00–12:00） · 週六14:00以後、週日、公休日不收（節日 명절 時有變動）"}}, "url": "https://www.gjcity.go.kr/depart/contents.do?mId=0901010100", "checked": "2026-10-25"}, {"id": "gg-gunpo", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "군포시", "id": "Gunpo-si", "th": "Gunpo-si", "en": "Gunpo-si", "ru": "Кёнгидо, Кунпхо", "vi": "Gunpo-si", "ja": "軍浦市（クンポ）", "zh": "军浦市", "mn": "Гёнгидо, Гунпо", "tw": "軍浦市"}, "f": {"hours": {"ko": "밤 시간대 배출 (동 안내: 저녁 8시~다음날 새벽 6시)", "id": "Malam hari (info kelurahan: 20:00~06:00 pagi berikutnya)", "th": "ทิ้งช่วงกลางคืน (ประกาศของแขวง: 20:00~06:00 ของวันถัดไป)", "en": "At night (dong notice: 20:00–06:00 next day)", "ru": "Ночью (по данным дон: 20:00~06:00 следующего дня)", "vi": "Bỏ rác vào ban đêm (hướng dẫn của phường: 20:00~06:00 sáng hôm sau)", "ja": "夜に出す（洞の案内：20:00〜翌06:00）", "zh": "夜间排放（洞的通知：20:00–次日06:00）", "mn": "Шөнийн цагаар (хорооны мэдээллээр: 20:00~маргааш нь 06:00)", "tw": "夜間排放（洞的通知：20:00–次日06:00）"}, "place": {"ko": "내 집 앞", "id": "Di depan rumah Anda", "th": "หน้าบ้านของคุณ", "en": "In front of your own home", "ru": "Перед своим домом", "vi": "Trước nhà bạn", "ja": "自宅の前", "zh": "自家门前", "mn": "Өөрийн байрны үүдэнд", "tw": "自家門前"}, "food": {"ko": "음식물 전용 종량제봉투 사용, 또는 전용 수거용기에 종량제칩·납부필증 부착", "id": "Pakai kantong khusus sampah makanan berbayar (음식물 종량제봉투), atau tempel chip/stiker bukti bayar (납부필증) di wadah khusus", "th": "ใช้ถุงขยะเศษอาหารเฉพาะแบบเสียเงิน (음식물 종량제봉투) หรือติดชิป/สติกเกอร์ชำระเงิน (납부필증) บนถังเฉพาะ", "en": "Use a food-waste pay-as-you-throw bag (음식물 전용 종량제봉투), or attach a fee chip (종량제칩) or payment sticker (납부필증) to a special collection bin", "ru": "Специальный платный пакет для пищевых отходов, или спец. контейнер с чипом (종량제칩) или наклейкой об оплате (납부필증)", "vi": "Dùng túi rác thức ăn có trả phí (종량제봉투), hoặc gắn chip trả phí (종량제칩) hay tem đã trả phí (납부필증) lên thùng thu gom chuyên dụng", "ja": "生ごみ専用の従量制袋（종량제봉투）を使う、または専用回収容器に従量制チップ（종량제칩）・納付済証（납부필증）を付ける", "zh": "使用厨余专用计量收费袋（음식물 전용 종량제봉투），或在专用回收桶上贴计量芯片（종량제칩）·缴费证（납부필증）", "mn": "Хүнсний хогийн тусгай төлбөртэй уут, эсвэл тусгай саванд төлбөрийн чип (종량제칩)·төлбөрийн наалт (납부필증) наана", "tw": "使用廚餘專用計量收費袋（음식물 전용 종량제봉투），或在專用回收桶上貼計量晶片（종량제칩）·繳費證（납부필증）"}, "bulky": {"ko": "배출스티커 부착 또는 시 홈페이지 대형폐기물 배출신고 (gunpo.go.kr/waste)", "id": "Tempel stiker buang atau lapor sampah besar (대형폐기물) di situs kota (gunpo.go.kr/waste)", "th": "ติดสติกเกอร์ทิ้งขยะ หรือแจ้งทิ้งขยะชิ้นใหญ่ (대형폐기물) บนเว็บไซต์ของเมือง (gunpo.go.kr/waste)", "en": "Attach a disposal sticker, or report large waste (대형폐기물) on the city website (gunpo.go.kr/waste)", "ru": "Приклейте наклейку на вынос или заявка на крупный мусор (대형폐기물) на сайте города (gunpo.go.kr/waste)", "vi": "Dán tem bỏ rác (배출스티커) hoặc khai báo rác cồng kềnh (대형폐기물) trên trang web của thành phố (gunpo.go.kr/waste)", "ja": "排出シール（배출스티커）を貼る、または市ホームページで大型ごみ（대형폐기물）の排出申告（gunpo.go.kr/waste）", "zh": "贴上排放贴纸，或在市网站申报大型废弃物（gunpo.go.kr/waste）", "mn": "Гаргах наалт наах эсвэл хотын сайтаар том хог (대형폐기물) мэдүүлнэ (gunpo.go.kr/waste)", "tw": "貼上排放貼紙，或在市網站申報大型廢棄物（gunpo.go.kr/waste）"}, "notes": {"ko": "투명 페트병은 라벨 떼고 찌그러뜨려 배출. 종이팩·투명 페트병은 동 행정복지센터에서 종량제봉투로 교환 가능", "id": "Botol PET bening: lepas label, gepengkan. Kemasan karton susu (종이팩) dan botol PET bening bisa ditukar dengan kantong berbayar (종량제봉투) di kantor kelurahan (행정복지센터)", "th": "ขวด PET ใส แกะฉลาก บีบให้แบนแล้วทิ้ง กล่องนม (종이팩) และขวด PET ใส นำไปแลกถุงขยะแบบเสียเงิน (종량제봉투) ได้ที่ศูนย์บริการชุมชน (행정복지센터)", "en": "Clear PET bottles: remove the label and crush them. Paper cartons and clear PET bottles can be exchanged for pay-as-you-throw bags (종량제봉투) at the community center (동 행정복지센터)", "ru": "С прозрачных ПЭТ-бутылок снимите этикетку, сомните. Упаковку из картона для напитков (종이팩) и прозрачные ПЭТ-бутылки можно обменять на платные пакеты (종량제 봉투) в администрации дон (행정복지센터)", "vi": "Chai PET trong suốt: bóc nhãn, bóp dẹt rồi để ra. Hộp giấy, chai PET trong suốt có thể đổi lấy túi rác có trả phí ở trung tâm hành chính phường (행정복지센터)", "ja": "透明ペットボトルはラベルをはがし、つぶして出す。紙パック・透明ペットボトルは洞の行政福祉センター（행정복지센터）で従量制袋と交換できる", "zh": "透明PET瓶撕掉标签、压扁后排放。纸盒·透明PET瓶可在洞行政福利中心（동 행정복지센터）换计量收费袋（종량제봉투）", "mn": "Тунгалаг ПЭТ савны шошгыг хуулж дарж хавтгайлаад гаргана. Цаасан хайрцаг (종이팩), тунгалаг ПЭТ савыг хорооны захиргаа (행정복지센터)-нд төлбөртэй уутаар (종량제 봉투) сольж болно", "tw": "透明PET瓶撕掉標籤、壓扁後排放。紙盒·透明PET瓶可在洞行政福利中心（동 행정복지센터）換計量收費袋（종량제봉투）"}, "days": {"ko": "토요일 오후·일요일 제외하고 배출 · 토요일 오후~일요일 배출 금지 (동 안내: 토요일 12시~일요일 저녁 8시 미수거)", "id": "Boleh buang kecuali Sabtu sore dan Minggu · Sabtu sore~Minggu dilarang buang (info kelurahan: Sabtu 12:00~Minggu 20:00 tidak diambil)", "th": "ทิ้งได้ ยกเว้นบ่ายวันเสาร์และวันอาทิตย์ · บ่ายวันเสาร์~วันอาทิตย์ ห้ามทิ้ง (ประกาศของแขวง: วันเสาร์ 12:00~วันอาทิตย์ 20:00 ไม่เก็บ)", "en": "Any time except Saturday afternoon and Sunday · No disposal from Saturday afternoon to Sunday (dong notice: no pickup from Saturday 12:00 to Sunday 20:00)", "ru": "Выносить можно, кроме второй половины субботы и воскресенья · С полудня субботы по воскресенье выносить нельзя (по данным дон: с 12:00 субботы до 20:00 воскресенья не вывозят)", "vi": "Bỏ rác trừ chiều Thứ 7 và CN · Cấm bỏ rác từ chiều Thứ 7 ~ CN (hướng dẫn của phường: không thu gom từ 12:00 Thứ 7 ~ 20:00 CN)", "ja": "土曜午後・日曜以外に出す · 土曜午後〜日曜は排出禁止（洞の案内：土曜12:00〜日曜20:00は回収なし）", "zh": "周六下午·周日以外可扔 · 周六下午至周日禁止扔（洞的通知：周六12:00至周日20:00不收）", "mn": "Бямба гарагийн үдээс хойш, Ням гарагаас бусад үед гаргана · Бямба гарагийн үдээс хойш~Ням гарагт гаргахыг хориглоно (хорооны мэдээллээр: Бямба 12:00~Ням 20:00 хүртэл ачихгүй)", "tw": "週六下午·週日以外可扔 · 週六下午至週日禁止扔（洞的通知：週六12:00至週日20:00不收）"}}, "url": "https://www.gunpo.go.kr/www/contents.do?key=4527", "checked": "2026-10-25"}, {"id": "gg-gimpo", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "김포시", "id": "Gimpo-si", "th": "Gimpo-si", "en": "Gimpo-si", "ru": "Кёнгидо, Кимпхо", "vi": "Gimpo-si", "ja": "金浦市（キンポ）", "zh": "金浦市", "mn": "Гёнгидо, Гимпо", "tw": "金浦市"}, "f": {"hours": {"ko": "20:00 ~ 24:00 (평일·일요일)", "id": "20:00 ~ 24:00 (hari kerja dan Minggu)", "th": "20:00 ~ 24:00 (วันธรรมดาและวันอาทิตย์)", "en": "20:00–24:00 (weekdays and Sunday)", "ru": "20:00~24:00 (будни и воскресенье)", "vi": "20:00 ~ 24:00 (ngày thường và Chủ nhật)", "ja": "20:00〜24:00（平日・日曜）", "zh": "20:00–24:00（工作日·周日）", "mn": "20:00 ~ 24:00 (ажлын өдөр, Ням гараг)", "tw": "20:00–24:00（工作日·週日）"}, "place": {"ko": "정해진 배출장소. 아파트는 단지에서 정한 날", "id": "Tempat buang yang ditentukan. Apartemen: hari yang ditentukan kompleks", "th": "จุดทิ้งขยะที่กำหนด อพาร์ตเมนต์: วันที่โครงการกำหนด", "en": "Designated disposal spot. Apartments: days set by the complex", "ru": "Назначенное место выноса. Многоквартирные дома (아파트) — в дни, назначенные комплексом", "vi": "Nơi bỏ rác quy định. Chung cư: ngày do khu chung cư quy định", "ja": "決められた排出場所。マンションは団地で決めた日", "zh": "规定的排放处。公寓按小区规定的日期", "mn": "Тогтоосон гаргах цэг. Орон сууцанд (아파트) хотхоноос тогтоосон өдөр", "tw": "規定的排放處。公寓按小區規定的日期"}, "food": {"ko": "녹색 종량제 봉투", "id": "Kantong sampah berbayar (종량제 봉투) hijau", "th": "ถุงขยะแบบเสียเงิน (종량제 봉투) สีเขียว", "en": "Green pay-as-you-throw bag (종량제 봉투)", "ru": "Зелёный платный пакет (종량제 봉투)", "vi": "Túi rác có trả phí (종량제 봉투) màu xanh lá", "ja": "緑色の従量制袋（종량제 봉투）", "zh": "绿色计量收费袋（종량제 봉투）", "mn": "Ногоон төлбөртэй уут (종량제 봉투)", "tw": "綠色計量收費袋（종량제 봉투）"}, "bags": {"ko": "판매소 지도: jb.gimpo.go.kr", "id": "Peta tempat jual: jb.gimpo.go.kr", "th": "แผนที่จุดขาย: jb.gimpo.go.kr", "en": "Map of sales points: jb.gimpo.go.kr", "ru": "Карта пунктов продажи: jb.gimpo.go.kr", "vi": "Bản đồ nơi bán: jb.gimpo.go.kr", "ja": "販売所マップ：jb.gimpo.go.kr", "zh": "销售处地图：jb.gimpo.go.kr", "mn": "Борлуулах цэгийн газрын зураг: jb.gimpo.go.kr", "tw": "銷售處地圖：jb.gimpo.go.kr"}, "bulky": {"ko": "온라인 신고 후 스티커 붙여 배출 (신청 2일 뒤부터)", "id": "Lapor online, lalu tempel stiker (스티커) dan keluarkan (mulai 2 hari setelah daftar)", "th": "แจ้งออนไลน์ แล้วติดสติกเกอร์ (스티커) และนำออกไปวาง (ได้ตั้งแต่ 2 วันหลังยื่น)", "en": "Report online, then attach the sticker and put it out (from 2 days after applying)", "ru": "Онлайн-заявка, затем приклейте наклейку (스티커) и выносите (через 2 дня после заявки)", "vi": "Khai báo online rồi dán tem (스티커) và để ra (từ 2 ngày sau khi đăng ký)", "ja": "オンラインで申告後、シールを貼って出す（申請の2日後から）", "zh": "网上申报后贴上贴纸排放（申请2天后起）", "mn": "Онлайн бүртгүүлээд наалт (스티커) нааж гаргана (хүсэлт гаргаснаас 2 хоногийн дараанаас)", "tw": "網上申報後貼上貼紙排放（申請2天后起）"}, "notes": {"ko": "흰색 봉투=일반, 노란 봉투=가연성 특수, 흰 마대=깨진 유리 등", "id": "Kantong putih = umum, kantong kuning = sampah khusus yang bisa dibakar, karung putih (마대) = kaca pecah, dll.", "th": "ถุงสีขาว = ขยะทั่วไป ถุงสีเหลือง = ขยะพิเศษที่เผาได้ กระสอบสีขาว (마대) = แก้วแตก ฯลฯ", "en": "White bag = general waste, yellow bag = special burnable waste (가연성 특수), white sack (흰 마대) = broken glass, etc.", "ru": "Белый пакет = обычный мусор, жёлтый пакет = горючий спец. мусор, белый мешок (마대) = разбитое стекло и т. п.", "vi": "Túi trắng = rác thường, túi vàng = rác đặc biệt cháy được, bao tải trắng (마대) = thủy tinh vỡ, v.v.", "ja": "白い袋＝一般ごみ、黄色い袋＝可燃性特殊ごみ（가연성 특수）、白い麻袋（흰 마대）＝割れたガラスなど", "zh": "白色袋=一般垃圾，黄色袋=可燃特殊垃圾（가연성 특수），白色麻袋（흰 마대）=碎玻璃等", "mn": "Цагаан уут = энгийн хог, шар уут = шатамхай тусгай хог, цагаан шуудай (마대) = хагарсан шил гэх мэт", "tw": "白色袋=一般垃圾，黃色袋=可燃特殊垃圾（가연성 특수），白色麻袋（흰 마대）=碎玻璃等"}, "days": {"ko": "지역마다 다름. 일요일 수거 없음 · 토요일 배출 금지", "id": "Beda-beda tiap daerah. Hari Minggu tidak ada pengangkutan · Dilarang buang sampah hari Sabtu", "th": "แต่ละพื้นที่ไม่เหมือนกัน วันอาทิตย์ไม่มีการเก็บ · ห้ามทิ้งขยะวันเสาร์", "en": "Depends on the area. No pickup on Sunday · No disposal on Saturday", "ru": "Зависит от района. В воскресенье не вывозят · В субботу выносить нельзя", "vi": "Khác nhau theo từng khu. Chủ nhật không thu gom · Cấm bỏ rác vào Thứ 7", "ja": "地域ごとに違う。日曜は収集なし · 土曜は排出禁止", "zh": "按地区不同。周日不收 · 周六禁止排放", "mn": "Бүс бүрт өөр. Ням гарагт хог авахгүй · Бямба гарагт гаргахыг хориглоно", "tw": "按地區不同。週日不收 · 週六禁止排放"}}, "url": "https://www.gimpo.go.kr/portal/contents.do?key=2723", "checked": "2026-10-24"}, {"id": "gg-namyangju", "sido": {"ko": "경기도", "id": "Gyeonggi-do", "th": "จังหวัดคย็องกี (Gyeonggi-do)", "en": "Gyeonggi-do", "ru": "Кёнгидо", "vi": "Gyeonggi-do", "ja": "京畿道", "zh": "京畿道", "mn": "Гёнгидо", "tw": "京畿道"}, "name": {"ko": "남양주시", "id": "Namyangju-si", "th": "Namyangju-si", "en": "Namyangju-si", "ru": "Кёнгидо, Намъянджу", "vi": "Namyangju-si", "ja": "南楊州市（ナミャンジュ）", "zh": "南杨州市", "mn": "Гёнгидо, Намянжу", "tw": "南楊州市"}, "f": {"hours": {"ko": "수거일 전날 저녁 6시 ~ 12시", "id": "Sehari sebelum hari angkut, jam 6 sore (18:00) sampai jam 12 malam (24:00)", "th"
